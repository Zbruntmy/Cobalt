 q:"An office building's operations team wants connected sensors and smart devices to automate lighting and HVAC and monitor them in real time. Which technology is MOST suitable?",
 a:["IoT","ICS/SCADA","RTOS","Hybrid cloud"],
 w:["","ICS/SCADA is built for industrial processes like power plants, pipelines and manufacturing. That's overkill for an office building.","An RTOS is an operating system inside an embedded device, not a monitoring solution.","Hybrid cloud is a deployment model, not a device technology."],
 c:"office / everyday connected devices"},
{id:"ics",d:3,o:"3.1",g:"embedded",t:"ICS / SCADA",
 f:"Industrial control systems that monitor and control physical industrial processes (power grids, water treatment, pipelines, factories), often spread over large areas.",
 q:"A water utility monitors pumps and valves across dozens of remote sites from a central control room. Which type of system is this?",
 a:["SCADA","IoT","RTOS","Serverless"],
 w:["","IoT is general connected devices. Industrial process control across remote sites is SCADA.","An RTOS is the OS inside a device, not the overall control system.","Serverless is a cloud computing model."],
 c:"industrial / utilities / remote sites"},
{id:"rtos",d:3,o:"3.1",g:"embedded",t:"RTOS (Real-Time Operating System)",
 f:"An OS that guarantees tasks complete within strict timing deadlines. Used in embedded systems like airbag controllers, medical devices and industrial controllers.",
 q:"A car's anti-lock braking module must respond to sensor input within a few milliseconds, every time. What type of operating system does it need?",
 a:["RTOS","General-purpose OS","Hypervisor","Container runtime"],
 w:["","A general-purpose OS like Windows doesn't guarantee strict timing.","A hypervisor runs VMs; it isn't about deterministic timing.","A container runtime packages apps; it doesn't guarantee real-time response."],
 c:"strict timing / milliseconds every time"},
{id:"planes",d:3,o:"3.1",g:"plane",t:"Control plane vs data plane",
 f:"Control plane = makes the decisions (routing tables, path selection; in zero trust, the policy engine and administrator). Data plane = actually forwards and carries the traffic (in zero trust, the policy enforcement point).",
 q:"A network engineer works on the part of the network that decides how to send traffic based on routing tables. Which part is the engineer working on?",
 a:["Control plane","Data plane","Switch","Router"],
 w:["","The data plane carries and forwards the traffic; it doesn't decide the path.","A switch is a device, not a logical plane.","A router is a device that has both planes. The question asks which part does the deciding."],
 c:"DECIDES the path (routing tables)"},
{id:"ztplanes",d:1,o:"1.2",g:"plane",t:"Zero trust: PDP vs PEP",
 f:"Control plane: the Policy Engine decides and the Policy Administrator issues the decision (together, the PDP). Data plane: the Policy Enforcement Point (PEP) allows or blocks the actual connection.",
 q:"In a zero trust architecture, which component sits in the data plane and actually allows or blocks the subject's connection to the resource?",
 a:["Policy Enforcement Point","Policy Engine","Policy Administrator","Adaptive identity"],
 w:["","The Policy Engine makes the decision in the control plane; it doesn't sit in the traffic path.","The Policy Administrator relays the decision in the control plane.","Adaptive identity is a control plane concept that uses context to verify identity."],
 c:"data plane = ENFORCES"},
// ---------- 3.4 Resilience ----------
{id:"resilience",d:3,o:"3.4",g:"resil",t:"Resilience vs availability",
 f:"Availability = the system is up and reachable. Resilience = the ability to keep functioning under harmful conditions and recover quickly. Broader than just being up.",
 q:"A company redesigns its infrastructure so it can keep operating under changing or harmful conditions without significant loss of function. Which design aspect is this?",
 a:["Resilience","Availability","Load balancing","Network segmentation"],
 w:["","Availability is just being up and accessible. Operating through harmful conditions and adapting is resilience.","Load balancing spreads traffic; it's one tool, not the overall design goal.","Segmentation limits spread between zones, which is a different goal."],
 c:"keep functioning under HARMFUL conditions"},
{id:"hotsite",d:3,o:"3.4",g:"sites",t:"Hot / warm / cold site",
 f:"Hot = fully equipped and replicated, failover in minutes. Warm = hardware ready, but needs data loaded (hours to days). Cold = space and power only (days to weeks).",
 q:"A company must keep running with near-zero downtime if its primary data center is destroyed. Which recovery site should it use?",
 a:["Hot site","Warm site","Cold site","Mobile site"],
 w:["","A warm site needs hours or days to load data and come up.","A cold site is empty space that takes days to weeks to equip.","A mobile site is a portable trailer that takes time to deploy. It's not near-zero downtime."],
 c:"near-zero downtime = real-time replica"},
{id:"geodisp",d:3,o:"3.4",g:"sites",t:"Geographic dispersion",
 f:"Placing sites or backups far enough apart that one regional disaster (hurricane, earthquake, grid failure) can't take out both.",
 q:"A company's primary and backup data centers are 5 miles apart in the same hurricane zone. Which resilience concept is it MISSING?",
 a:["Geographic dispersion","Load balancing","Clustering","Multicloud"],
 w:["","Load balancing spreads traffic but doesn't protect against a regional disaster.","Clustering adds redundancy in one location; a hurricane takes out the whole cluster.","Multicloud avoids dependence on one provider, but the issue here is physical distance."],
 c:"same disaster zone = too close"},
// ---------- 2.2 Social engineering ----------
{id:"vishing",d:2,o:"2.2",g:"phish",t:"Vishing",
 f:"Phishing over voice: phone calls or VoIP, often pretending to be a bank, IT or a government agency.",
 q:"An employee receives numerous unsolicited phone calls from someone claiming to be from a bank and asking for account details. Which social engineering attack is this?",
 a:["Vishing","Smishing","Spear phishing","Whaling"],
 w:["","Smishing uses SMS text messages, not phone calls.","Spear phishing is targeted email phishing. The channel here is voice.","Whaling targets executives specifically."],
 c:"PHONE CALLS = voice"},
{id:"smishing",d:2,o:"2.2",g:"phish",t:"Smishing",
 f:"Phishing over SMS text messages, such as 'Your package is delayed, click here'.",
 q:"Employees receive text messages claiming their payroll account is locked, with a link to 'verify' their login. Which attack is this?",
 a:["Smishing","Vishing","Whaling","Pharming"],
 w:["","Vishing uses voice calls.","Whaling targets high-level executives.","Pharming redirects users to a fake site through DNS or hosts file manipulation."],
 c:"TEXT message"},
{id:"whaling",d:2,o:"2.2",g:"phish",t:"Whaling",
 f:"Spear phishing aimed at high-value executives (CEO, CFO).",
 q:"An attacker researches a company's CFO and sends her a personalized email about an urgent acquisition requiring a wire transfer. Which term BEST fits?",
 a:["Whaling","Smishing","Vishing","Watering hole"],
 w:["","Smishing uses text messages.","Vishing uses voice calls.","A watering hole compromises a website the targets visit."],
 c:"targets an EXECUTIVE"},
{id:"spear",d:2,o:"2.2",g:"phish",t:"Spear phishing",
 f:"Targeted phishing email aimed at a specific person or group using researched details. If the target is an executive, it's whaling.",
 q:"An attacker sends emails only to a company's five payroll clerks, referencing their manager by name and a real recent system migration. Which attack is this?",
 a:["Spear phishing","Whaling","Vishing","Spam"],
 w:["","Whaling targets executives; these are clerks.","Vishing uses voice calls.","Spam is untargeted bulk email."],
 c:"targeted email at specific non-exec people"},
{id:"bec",d:2,o:"2.2",g:"phish",t:"Business email compromise (BEC)",
 f:"Using a compromised or spoofed business email account (often a partner or executive) to trick staff into wiring money or sharing data.",
 q:"The CEO receives an email that appears to be from a known business partner, referencing a real meeting with the CFO and asking him to pay a 'pending invoice' to a new bank account. Which attack is this MOST likely?",
 a:["Business email compromise","Vishing","Smishing","Typosquatting"],
 w:["","Vishing uses phone calls.","Smishing uses text messages.","Typosquatting registers look-alike domains. It might be a tool used here, but the attack overall is BEC."],
 c:"spoofed partner/exec email + payment request"},
{id:"pretext",d:2,o:"2.2",g:"phish",t:"Pretexting",
 f:"Inventing a believable scenario or identity to get someone to hand over information or access ('Hi, I'm from IT doing an audit').",
 q:"A caller claims to be a new HR employee who urgently needs help sending a fax, gaining the target's trust before asking them to open a file. Which technique is the attacker using to set up the request?",
 a:["Pretexting","Tailgating","Shoulder surfing","Typosquatting"],
 w:["","Tailgating is physically following someone through a secured door.","Shoulder surfing is watching someone's screen or keyboard.","Typosquatting registers misspelled domains."],
 c:"made-up believable story/identity"},
// ---------- 1.2 CIA / non-repudiation ----------
{id:"conf",d:1,o:"1.2",g:"cia",t:"Confidentiality (encryption)",
 f:"Keeping information secret from unauthorized parties. Encryption is the primary tool.",
 q:"An anonymous source insists that a reporter set up an encrypted communication channel before sharing details. What is the source trying to ensure?",
 a:["Confidentiality","Integrity","Availability","Non-repudiation"],
 w:["","Integrity means the data isn't altered (hashing). The source wants nobody else to read it.","Availability means the system is up and reachable.","Non-repudiation proves who sent something (digital signatures). An anonymous source wants the opposite."],
 c:"encryption = keep it secret"},
{id:"integ",d:1,o:"1.2",g:"cia",t:"Integrity (and on-path attacks)",
 f:"Ensuring data isn't altered without authorization. Hashing verifies it. On-path attacks that intercept or modify traffic are integrity attacks.",
 q:"An attacker plugs a rogue device into an open network port to intercept and modify traffic between hosts. Which security property is MOST directly compromised?",
 a:["Integrity","Availability","Authentication","Non-repudiation"],
 w:["","Availability is about service disruption, such as DoS. Here data is being changed.","The core issue is data being altered in transit, not who logged in.","Non-repudiation proves who sent something. The question focuses on modified traffic."],
 c:"intercept AND MODIFY = integrity"},
{id:"nonrep",d:1,o:"1.2",g:"cia",t:"Non-repudiation",
 f:"Proof that a specific party sent or approved something, so they can't deny it later. Provided by digital signatures, which use the signer's private key.",
 q:"A contract-signing system must ensure that a signer cannot later claim they never approved the document. Which concept is required?",
 a:["Non-repudiation","Confidentiality","Availability","Obfuscation"],
 w:["","Confidentiality keeps the document secret; it doesn't prove who signed it.","Availability means the system is reachable.","Obfuscation makes things hard to understand. It doesn't prove anything."],
 c:"can't deny it later"},
// ---------- 4.5 Email security ----------
{id:"dkim",d:4,o:"4.5",g:"email",t:"DKIM (DomainKeys Identified Mail)",
 f:"The sending server digitally signs emails with a private key. Receivers verify the signature using the public key published in DNS.",
 q:"Which email security option uses encryption to let the sender digitally sign emails so recipients can verify them?",
 a:["DKIM","SPF","DMARC","EDR"],
 w:["","SPF only lists which IP addresses may send for a domain. There's no signature.","DMARC is a policy and reporting layer that relies on SPF and DKIM; it doesn't sign anything itself.","EDR is endpoint protection, not an email authentication protocol."],
 c:"digital SIGNATURE"},
{id:"spf",d:4,o:"4.5",g:"email",t:"SPF (Sender Policy Framework)",
 f:"A DNS TXT record listing which mail servers and IP addresses are allowed to send email for a domain.",
 q:"An admin publishes a DNS TXT record listing the only IP addresses allowed to send email on behalf of company.com. Which mechanism is this?",
 a:["SPF","DKIM","DMARC","S/MIME"],
 w:["","DKIM uses a cryptographic signature, not a list of allowed IPs.","DMARC tells receivers what to do when SPF or DKIM checks fail.","S/MIME encrypts or signs individual messages end to end, per user."],
 c:"list of allowed sending IPs"},
{id:"dmarc",d:4,o:"4.5",g:"email",t:"DMARC",
 f:"A policy that tells receiving servers what to do when SPF or DKIM checks fail (none, quarantine, reject) and sends reports back to the domain owner.",
 q:"A company wants receiving mail servers to reject any email claiming to be from its domain that fails SPF and DKIM checks, and to send it reports about those failures. Which should it configure?",
 a:["DMARC","SPF","DKIM","SMTP relay"],
 w:["","SPF is just the allowed sender list. It doesn't set reject policies or reporting.","DKIM provides the signature, not the policy for handling failures.","An SMTP relay forwards mail; it isn't an authentication policy."],
 c:"policy (reject/quarantine) + reporting"},
// ---------- 4.5 IDS/IPS ----------
{id:"ips",d:4,o:"4.5",g:"ids",t:"IPS vs IDS",
 f:"IDS = detects and alerts (passive, often out-of-band). IPS = sits inline and can actively block or modify malicious traffic in real time.",
 q:"An admin needs a system that provides real-time protection, sits in the traffic path, and can modify or reject malicious traffic. Which should the team focus on?",
 a:["IPS","IDS","NIDS","HIDS"],
 w:["","An IDS detects and alerts but doesn't block.","A NIDS is a network IDS: it detects and alerts, but doesn't block.","A HIDS is a host-based IDS. It detects on one host and doesn't block network traffic."],
 c:"BLOCK / modify / inline"},
{id:"hips",d:4,o:"4.5",g:"ids",t:"HIPS (Host-based IPS)",
 f:"An agent installed on an individual host that monitors and blocks malicious activity there, using signature and anomaly detection.",
 q:"After a data exfiltration, a team wants software agents installed on each server that monitor activity on that host and block malicious behavior using signature and anomaly detection. What should they deploy?",
 a:["HIPS","NIDS","Network firewall","SIEM"],
 w:["","A NIDS watches network traffic and only alerts; it doesn't run as an agent on the host.","A network firewall filters traffic between networks, not activity on each host.","A SIEM aggregates and correlates logs; it doesn't block on the host."],
 c:"agent on EACH host + blocks"},
// ---------- 1.4 PKI ----------
{id:"csr",d:1,o:"1.4",g:"pki",t:"CSR (Certificate Signing Request)",
 f:"The server generates a key pair and a CSR (containing its public key and identity), then sends it to a CA. The CA validates the identity and issues a signed third-party certificate. A self-signed cert skips the CA.",
 q:"Which statement correctly describes how a third-party SSL/TLS certificate is obtained?",
 a:["The server generates a CSR and submits it to a CA, which validates identity and issues the certificate.","The server generates a self-signed certificate to create a CSR.","The CA generates the CSR and sends it to the server.","The server submits its self-signed certificate to a CA for approval."],
 w:["","It's backwards: the CSR is what's sent to a CA. A self-signed cert doesn't involve a CSR going anywhere.","The server creates the CSR, not the CA.","You don't send a self-signed cert to a CA. You send a CSR."],
 c:"server makes CSR → CA signs"},
{id:"selfsigned",d:1,o:"1.4",g:"pki",t:"Self-signed certificate",
 f:"A certificate signed by its own private key instead of a trusted CA. Free and fine for internal testing, but browsers won't trust it by default.",
 q:"A small company wants free encryption for an internal-only test web server and accepts that browsers will show a trust warning. Which certificate option fits?",
 a:["Self-signed certificate","Wildcard certificate from a public CA","Extended validation certificate","Code-signing certificate"],
 w:["","A public CA wildcard cert costs money and is trusted, which is more than they need.","EV certs require extensive CA validation and cost money.","Code-signing certs sign software, not web server TLS."],
 c:"free + internal + trust warning OK"},
{id:"crl",d:1,o:"1.4",g:"pki",t:"CRL (Certificate Revocation List)",
 f:"A signed list published by the CA of revoked certificates. Clients must download it, so a stale or unchecked CRL can make a revoked certificate look valid.",
 q:"A CA's issuing authority was revoked, yet its certificates still appear valid in some browsers. What is the MOST likely reason?",
 a:["The CRL still requires updating or wasn't checked","The CA was a root CA","The company never implemented PKI","Certificates can't be revoked once issued"],
 w:["","Being a root CA doesn't make revoked certs appear valid.","They clearly have PKI because certificates were issued.","Certificates can be revoked; that's what the CRL is for."],
 c:"revoked but looks valid = stale list"},
{id:"ocsp",d:1,o:"1.4",g:"pki",t:"OCSP and OCSP stapling",
 f:"OCSP = the client asks the CA's responder about ONE certificate's status in real time. Stapling = the web server fetches the signed OCSP response and attaches it to the TLS handshake, which is faster and more private.",
 q:"A site wants clients to get real-time certificate status without each client contacting the CA, so the web server attaches a signed status response during the TLS handshake. What is this?",
 a:["OCSP stapling","CRL","Certificate pinning","Key escrow"],
 w:["","A CRL is a downloadable list, not a response attached to the handshake.","Pinning hard-codes which certificate or key a client trusts.","Key escrow stores copies of keys with a trusted third party."],
 c:"server ATTACHES status to handshake"},
// ---------- 2.4 Malware ----------
{id:"logicbomb",d:2,o:"2.4",g:"malware",t:"Logic bomb",
 f:"Malicious code that sits dormant until a specific condition triggers it, such as a date, time or event ('if I'm removed from payroll').",
 q:"A legitimate software update installs with no issues. One week later, at exactly midnight, a hidden payload executes and causes major damage. What type of attack is this?",
 a:["Logic bomb","Trojan","Rootkit","Ransomware"],
 w:["","A Trojan disguises itself as legitimate software, but the defining clue here is the dormant, time-triggered payload.","A rootkit hides and keeps privileged access; it isn't defined by a timed trigger.","Ransomware encrypts files and demands payment. Nothing here mentions ransom."],
 c:"dormant until a TRIGGER (time/event)"},
{id:"trojan",d:2,o:"2.4",g:"malware",t:"Trojan",
 f:"Malware disguised as legitimate software that the user installs willingly. It often drops a backdoor or RAT.",
 q:"A user downloads a free 'PC optimizer' from an email link. It works as advertised, but also secretly installs a remote access backdoor. What type of malware is this?",
 a:["Trojan","Worm","Logic bomb","Virus"],
 w:["","A worm spreads by itself across the network with no user install.","A logic bomb waits for a trigger condition.","A virus attaches to files and spreads when they're run. This was a standalone 'useful' program."],
 c:"disguised as legit software, user installs it"},
{id:"rootkit",d:2,o:"2.4",g:"malware",t:"Rootkit",
 f:"Malware that gains deep, privileged (often kernel-level) access and hides itself and other malware from the OS and security tools.",
 q:"Forensic analysts find malware that modified the OS kernel to hide its processes and files from antivirus and Task Manager. What type of malware is this?",
 a:["Rootkit","Ransomware","Spyware","Logic bomb"],
 w:["","Ransomware encrypts data for payment and announces itself.","Spyware collects information but isn't defined by kernel-level hiding.","A logic bomb is defined by its trigger condition."],
 c:"kernel-level + HIDES itself"},
{id:"worm",d:2,o:"2.4",g:"malware",t:"Worm",
 f:"Self-replicating malware that spreads across networks on its own by exploiting vulnerabilities, with no user action needed.",
 q:"Malware exploits an unpatched SMB vulnerability and spreads from machine to machine across the network without anyone clicking anything. What is it?",
 a:["Worm","Trojan","Virus","Keylogger"],
 w:["","A Trojan needs a user to install it.","A virus needs a host file and a user action to spread.","A keylogger records keystrokes; it doesn't self-spread."],
 c:"spreads BY ITSELF, no clicks"},
// ---------- 4.x Threat intel ----------
{id:"osint",d:4,o:"4.3",g:"intel",t:"OSINT (Open-Source Intelligence)",
 f:"Collecting and analyzing publicly available information (websites, forums, social media, public bulletin boards) for decision-making.",
 q:"An admin reads security bulletin boards and public forums and learns about several new exploits. What type of information is this?",
 a:["Open-source intelligence","Proprietary threat intelligence","Threat feed","Information-sharing organization"],
 w:["","Proprietary intel is paid, vendor-provided intelligence. This was free and public.","A threat feed is a structured, often automated stream of indicators, not reading forums.","An ISAC is a membership-based sharing group, not public message boards."],
 c:"PUBLIC sources (forums, boards, web)"},
{id:"feeds",d:4,o:"4.3",g:"intel",t:"Threat feeds vs ISACs",
 f:"Threat feed = a structured stream of indicators (IPs, hashes, domains) that can be fed automatically into tools. ISAC = an industry-specific information-sharing organization (such as FS-ISAC for finance).",
 q:"A bank joins an industry group where member banks share attack details and indicators with each other. What is this group?",
 a:["Information Sharing and Analysis Center (ISAC)","Threat feed","OSINT","Dark web monitoring"],
 w:["","A threat feed is a data stream, not a member organization.","OSINT is public information anyone can read.","Dark web monitoring watches criminal marketplaces."],
 c:"industry members share with each other"},
// ---------- 3.2 Firewalls / isolation ----------
{id:"dpi",d:3,o:"3.2",g:"fw",t:"Deep packet inspection / NGFW (Layer 7)",
 f:"Inspects packet contents at the application layer: it can verify that the protocol matches the port, identify apps, and track session state.",
 q:"Raw UDP packets are sneaking through open ports. The company needs a firewall that verifies the application protocol actually matches the port, tracks session state, and blocks fraudulent sessions. What should it deploy?",
 a:["Deep packet inspection firewall","Packet filtering firewall","Circuit-level gateway","Transparent firewall"],
 w:["","Packet filtering only checks headers (IP and port) at layers 3/4. It can't see whether the protocol matches the port.","A circuit-level gateway validates the session handshake at layer 5 but doesn't inspect application content.","A transparent firewall describes how it's deployed (invisible layer-2 bridge), not how deeply it inspects."],
 c:"protocol matches port = look INSIDE (L7)"},
{id:"pktfilter",d:3,o:"3.2",g:"fw",t:"Packet filtering vs circuit-level vs transparent",
 f:"Packet filter = stateless rules on IP, port and protocol (L3/4). Circuit-level gateway = validates the TCP session setup (L5). Transparent = a firewall running as an invisible layer-2 bridge, with no IP changes needed.",
 q:"An admin needs to insert a firewall between a segment and its router without re-addressing any devices, so the firewall is invisible at layer 3. Which deployment is this?",
 a:["Transparent firewall","Circuit-level gateway","Packet filtering firewall","Web application firewall"],
 w:["","A circuit-level gateway validates TCP handshakes; it's about inspection, not invisible deployment.","Packet filtering describes the inspection type. It usually acts as a routed (layer 3) hop.","A WAF protects web apps from attacks like SQLi and XSS."],
 c:"invisible / no re-addressing = layer 2 bridge"},
{id:"waf",d:3,o:"3.2",g:"fw",t:"WAF (Web Application Firewall)",
 f:"Filters HTTP/S traffic to protect web apps from attacks like SQL injection and XSS. A good immediate shield when an app has an unpatched (even zero-day) flaw.",
 q:"An e-commerce web app shows signs of an actively exploited zero-day with no patch available. What should the security team do FIRST to minimize damage?",
 a:["Deploy IDS and a web application firewall to detect and block the activity","Perform a comprehensive system backup","Force password changes for all users","Update antivirus on all company devices"],
 w:["","A backup helps recovery later, but it doesn't stop the active exploitation now.","Password resets don't fix an application vulnerability.","Antivirus on endpoints doesn't shield a web app from a zero-day exploit."],
 c:"no patch yet → shield it (block at app layer)"},
{id:"sandbox",d:3,o:"3.2",g:"isolate",t:"Sandboxing",
 f:"Runs an application in an isolated, controlled environment so that even if it's compromised, it can't affect the rest of the system.",
 q:"A security team wants to isolate applications from the rest of the system so a compromised app can't spread malware, without hurting performance or usability. Which measure should it implement?",
 a:["Sandboxing","Firewall","Intrusion detection system","Network segmentation"],
 w:["","A firewall filters network traffic; it doesn't isolate an app from the host it runs on.","An IDS detects and alerts; it doesn't isolate anything.","Segmentation separates network zones, not individual applications on a system."],
 c:"isolate the APPLICATION itself"},
// ---------- 4.6 Identity / SSO ----------
{id:"oauth",d:4,o:"4.6",g:"sso",t:"OAuth",
 f:"A token-based authorization framework. A user grants an app access to resources at another service WITHOUT giving the app their password. Often used to build SSO-style logins.",
 q:"A company wants users to log in once and access multiple cloud services without passing their credentials to each service. Which protocol meets this requirement?",
 a:["OAuth","Kerberos","FIDO","VPN"],
 w:["","Kerberos is ticket-based SSO for internal networks (Active Directory), not designed for cloud services and third-party apps.","FIDO is passwordless authentication with security keys or biometrics, not a delegated-access protocol.","A VPN creates an encrypted tunnel; it isn't an SSO protocol."],
 c:"tokens, no credentials passed to each service"},
{id:"saml",d:4,o:"4.6",g:"sso",t:"SAML",
 f:"An XML-based standard for exchanging authentication and authorization assertions between an identity provider (IdP) and a service provider (SP). Classic enterprise web SSO.",
 q:"An enterprise sets up web SSO where its identity provider sends XML-based assertions to a SaaS application to vouch for logged-in users. Which standard is this?",
 a:["SAML","Kerberos","RADIUS","LDAP"],
 w:["","Kerberos uses tickets inside a domain, not XML assertions to SaaS apps.","RADIUS is for network access authentication (VPN, Wi-Fi, 802.1X).","LDAP is a directory query protocol."],
 c:"XML assertions, IdP → SP"},
{id:"kerberos",d:4,o:"4.6",g:"sso",t:"Kerberos",
 f:"A ticket-based SSO protocol for internal networks (used by Active Directory). A Key Distribution Center issues a TGT, then service tickets.",
 q:"In a Windows domain, users authenticate once and receive a ticket-granting ticket that lets them access file servers without re-entering a password. Which protocol is this?",
 a:["Kerberos","OAuth","SAML","TACACS+"],
 w:["","OAuth is token-based delegated authorization for web and cloud apps.","SAML uses XML assertions for web SSO.","TACACS+ is used for authenticating admins to network devices."],
 c:"tickets / TGT / Windows domain"},
// ---------- 2.3 Vulnerabilities ----------
{id:"eol",d:2,o:"2.3",g:"vage",t:"End-of-life (EOL) vs legacy",
 f:"EOL = the vendor has publicly declared the product no longer supported, so there are no more patches. Legacy = older tech still in use that may be outdated or hard to secure, but isn't necessarily vendor-unsupported.",
 q:"A laptop no longer receives updates for critical software because the vendor publicly declared that version is no longer supported. Which vulnerability type is this?",
 a:["End-of-life","Legacy","Firmware","Zero-day"],
 w:["","Legacy just means old. The clue is that the vendor publicly declared end of support, which is EOL.","Firmware vulnerabilities are flaws in device low-level code.","A zero-day is an unknown flaw with no patch yet, not a product the vendor dropped."],
 c:"vendor DECLARED no longer supported"},
{id:"jailbreak",d:2,o:"2.3",g:"mobile",t:"Jailbreaking vs sideloading",
 f:"Jailbreaking (iOS) / rooting (Android) = gaining elevated privileges and system file access to remove restrictions. Sideloading = installing apps from outside the official store.",
 q:"A user exploits their iPhone to gain root-level access to system files so they can customize the OS and install unauthorized apps. What is this?",
 a:["Jailbreaking","Sideloading","Carrier unlocking","Rooting a router"],
 w:["","Sideloading just installs apps from outside the store. It doesn't by itself give elevated system privileges.","Carrier unlocking lets the phone work on other networks.","Wrong device. Rooting is the Android term for phones; on iPhone it's jailbreaking."],
 c:"ELEVATED privileges / system files"},
// ---------- 3.3 Data protection ----------
{id:"datause",d:3,o:"3.3",g:"dstate",t:"Protecting data in use",
 f:"Data at rest → encryption (FDE, database encryption). In transit → TLS/IPsec. In use (in memory) → permission restrictions and access controls, secure enclaves.",
 q:"An admin gets an alert about potential unauthorized access to sensitive data while it's in active memory on a server. Which measure is MOST appropriate?",
 a:["Permission restrictions","Data encryption","Data masking","Data obfuscation"],
 w:["","Encryption mainly protects data at rest or in transit. Data in memory generally has to be decrypted to be used.","Masking hides parts of data for display, not access to live memory.","Obfuscation makes data harder to read; it doesn't stop unauthorized access."],
 c:"in MEMORY = in use → restrict who can touch it"},
{id:"masking",d:3,o:"3.3",g:"dstate",t:"Masking vs tokenization",
 f:"Masking = hides part of the data for display (***-**-1234). Tokenization = replaces sensitive data with a random token, with the real value stored in a secure vault (common for card numbers).",
 q:"A payment system replaces each credit card number with a random value and stores the real number in a separate secure vault, so stolen tokens are useless. Which technique is this?",
 a:["Tokenization","Masking","Hashing","Obfuscation"],
 w:["","Masking only hides characters on display; the real data still exists in the same place.","Hashing is one-way, so the original can't be retrieved for later payments.","Obfuscation is a general term for making things unclear, not a vault-based swap."],
 c:"random substitute + vault"},
// ---------- 4.4 Monitoring / logs ----------
{id:"snmptrap",d:4,o:"4.4",g:"mon",t:"SNMP trap",
 f:"An alert that a device's SNMP agent pushes to the management system when a notable event happens: port failure, overheating, power loss, high CPU.",
 q:"After a server failure, a company wants devices to proactively notify a management system about port failures, chassis overheating, power loss or high CPU. What should it use?",
 a:["SNMP traps","Data loss prevention","SCAP","Antivirus"],
 w:["","DLP stops sensitive data from leaving; it doesn't monitor hardware events.","SCAP standardizes automated vulnerability and configuration checks, not device event alerts.","Antivirus detects malware, not hardware health."],
 c:"device pushes event alerts (hardware health)"},
{id:"scap",d:4,o:"4.4",g:"mon",t:"SCAP",
 f:"Security Content Automation Protocol: a set of standards (CVE, CVSS, CPE, XCCDF, OVAL) that lets tools automatically check configurations and vulnerabilities in a common format.",
 q:"A team wants its scanners to automatically check systems against a standardized baseline and report findings in a common, machine-readable format. Which standard supports this?",
 a:["SCAP","SNMP","NetFlow","Syslog"],
 w:["","SNMP monitors and manages device status, not compliance checks.","NetFlow records traffic metadata.","Syslog transports log messages; it doesn't define configuration checks."],
 c:"standardized automated config/vuln checks"},
{id:"insiderlogs",d:4,o:"4.9",g:"logs",t:"Log sources for insider threats",
 f:"Host OS logs (logons, file access), application logs (what users did in apps), and endpoint logs (EDR). These show user-level activity, which is what you need to spot an insider.",
 q:"A forensic analyst using a SIEM must identify a possible insider responsible for a data breach. Which combination of data sources should they focus on?",
 a:["Host OS logs, application logs and endpoint logs","Firewall and router logs only","Vulnerability scanner output and NetFlow","Packet captures of internet traffic only"],
 w:["","Network device logs show traffic flows but not which user did what on a system.","Scanner output shows weaknesses, not user behavior.","Packet captures show traffic, but insiders often act through legitimate access that's visible in host and app logs."],
 c:"INSIDER = what users did on hosts/apps"},
// ---------- 4.1/3.x Network access ----------
{id:"dot1x",d:3,o:"3.2",g:"nac",t:"802.1X (EAP + RADIUS)",
 f:"Port-based network access control: the device must authenticate (EAP) through the switch to a RADIUS server before it gets full network access. It defeats MAC spoofing.",
 q:"A team uses MAC filtering on switch ports but worries about MAC spoofing and the overhead of maintaining MAC lists. It now wants strong authentication before users get network access. What should it implement next?",
 a:["802.1X with EAP and RADIUS","Disable all unused switch ports","Segregate the network into security zones","Physically isolate critical servers"],
 w:["","Disabling unused ports is good hygiene, but it doesn't authenticate devices on the ports in use.","Zoning limits movement after access is granted; it doesn't authenticate before access.","Physical isolation protects servers but doesn't authenticate users connecting to the network."],
 c:"authenticate BEFORE network access"},
{id:"arp",d:2,o:"2.4",g:"onpath",t:"On-path attack and ARP poisoning",
 f:"On-path = the attacker sits between two parties to intercept or alter traffic. ARP poisoning is a common LAN technique for getting on-path (fake MAC-to-IP mappings).",
 q:"A customer says the contract numbers they received were different from what the salesman sent. Which attack technique on the local network could have let an attacker alter the data in transit?",
 a:["ARP poisoning","Denial of service","Reconnaissance","Password spraying"],
 w:["","DoS disrupts availability; it doesn't change data.","Reconnaissance gathers information but doesn't alter traffic.","Password spraying guesses logins; it doesn't modify messages in transit."],
 c:"data CHANGED in transit → get in the middle"},
// ---------- 4.6 Passwords ----------
{id:"pwage",d:4,o:"4.6",g:"pw",t:"Password expiration / age",
 f:"How often passwords must be changed. Forcing very frequent changes leads to forgotten passwords, more resets, and weak, predictable choices. Longer expiration periods balance security and usability.",
 q:"A 90-day password change policy is causing frequent resets and pushing employees to pick weak passwords. Which approach BEST balances security and convenience?",
 a:["Lengthen the password expiration period","Require even more complex passwords","Shorten expiration to 30 days","Disable password history"],
 w:["","More complexity on top of frequent changes makes forgetting even more likely.","Shorter expiration makes the reset problem worse.","Disabling history lets users reuse old passwords, which weakens security."],
 c:"too frequent changes = the problem"}
);

// Wave 2 — Domain 4 expansion (4.1–4.9 objectives not covered in Wave 1)
DECK.push(
// ---------- 4.3 Vulnerability findings ----------
{id:"fpos",d:4,o:"4.3",g:"vconf",t:"False positive",
 f:"A scanner or alert reports a problem that isn't actually there. It wastes analyst time; fix it by confirming manually and tuning.",
 q:"A vulnerability scan reports that a web server is vulnerable to an Apache flaw, but the server runs IIS and has no Apache installed. What is this finding?",
 a:["False positive","False negative","True positive","Zero-day"],
 w:["","A false negative is the opposite: a real problem the scanner MISSED.","A true positive is a correctly reported real vulnerability. This one isn't real.","A zero-day is an unknown flaw with no patch. This flaw doesn't even apply to the server."],
 c:"reported but NOT real"},
{id:"fneg",d:4,o:"4.3",g:"vconf",t:"False negative",
 f:"A real vulnerability or attack that the scanner or IDS fails to detect. More dangerous than a false positive, because nobody knows to fix it.",
 q:"A pen tester easily exploits an outdated SSH service on a server that passed last week's vulnerability scan with zero findings. What did the scan produce?",
 a:["False negative","False positive","True negative","Exception"],
 w:["","A false positive is an alert for something that isn't really there. Here a real flaw went unreported.","A true negative means there was no vulnerability and none was reported. A real flaw existed.","An exception is a formally approved deviation from policy."],
 c:"real problem, scanner MISSED it"},
{id:"credscan",d:4,o:"4.3",g:"vconf",t:"Credentialed vs non-credentialed scan",
 f:"Credentialed = the scanner logs in to each host, so it sees installed software, patch levels and configs (deeper, fewer false positives). Non-credentialed = scans from outside, seeing only what an attacker would.",
 q:"A vulnerability scan keeps missing outdated software and missing patches on Windows servers because it can only see open ports and service banners. What change gives the MOST accurate results?",
 a:["Run a credentialed scan","Run the non-credentialed scan more often","Switch to passive reconnaissance","Scan a wider port range"],
 w:["","More frequent outside-in scans still can't see installed software or patch levels.","Passive recon doesn't touch the hosts at all, so it sees even less.","More ports still only shows services from the outside, not what's installed."],
 c:"log in to see patches / installed software"},
{id:"cvss",d:4,o:"4.3",g:"vscore",t:"CVSS (Common Vulnerability Scoring System)",
 f:"Rates a vulnerability's severity from 0.0 to 10.0 (9.0+ is Critical). Used to prioritize which findings to fix first.",
 q:"A team has 400 open vulnerability findings and limited time. Which standard should it use to rank them by severity so it fixes the worst first?",
 a:["CVSS","CVE","OSINT","NetFlow"],
 w:["","CVE gives each known vulnerability a unique ID; it doesn't score severity.","OSINT is publicly available information, not a scoring system.","NetFlow records network traffic metadata."],
 c:"SCORE 0–10 → prioritize"},
{id:"cve",d:4,o:"4.3",g:"vscore",t:"CVE (Common Vulnerabilities and Exposures)",
 f:"A public list that gives each known vulnerability a unique ID (such as CVE-2021-44228), so vendors, scanners and analysts all refer to the same flaw.",
 q:"A vendor advisory, a scanner report and a news article all refer to the same flaw as CVE-2021-44228. What does that identifier provide?",
 a:["A unique, common ID for a publicly known vulnerability","A severity score from 0 to 10","An IPS signature that blocks the exploit","A record of which hosts have been patched"],
 w:["","That's CVSS. CVE is the name tag; CVSS is the severity score.","IPS signatures are vendor detection rules, not public IDs.","Patch status lives in your scanner or asset tools, not in a CVE ID."],
 c:"the NAME/ID, not the score"},
{id:"bounty",d:4,o:"4.3",g:"vfind",t:"Bug bounty / responsible disclosure",
 f:"Responsible disclosure = researchers privately report flaws so the vendor can fix them before details go public. A bug bounty pays researchers for valid reports.",
 q:"A software company invites outside security researchers to find flaws in its app and pays cash rewards for valid, privately reported vulnerabilities. What is this program?",
 a:["Bug bounty","Penetration test","Threat feed","Red team exercise"],
 w:["","A pen test is a contracted engagement with a set scope and specific testers, not an open reward program.","A threat feed is a stream of threat indicators.","A red team is a hired or internal attack team, not open to any outside researcher for rewards."],
 c:"outside researchers + rewards"},
{id:"rescan",d:4,o:"4.3",g:"vfind",t:"Validation of remediation",
 f:"After a fix, confirm it actually worked (rescan, audit, verify) before closing the finding. Then report the result.",
 q:"The server team reports that a critical vulnerability was patched. What should the security team do NEXT before closing the finding?",
 a:["Rescan the system to confirm the fix","Close the finding based on the team's report","Buy cyber insurance for the asset","Mark the risk as accepted in the register"],
 w:["","Trusting a report without checking is how 'patched' systems stay vulnerable. Validate first.","Insurance transfers risk; it doesn't confirm the fix.","The risk was mitigated, not accepted."],
 c:"verify the fix → rescan"},
// ---------- 4.1 / 4.3 App security ----------
{id:"sast",d:4,o:"4.3",g:"appsec",t:"Static vs dynamic analysis",
 f:"Static (SAST) = reviews source code without running it, early in development. Dynamic (DAST) = tests the running application by sending it inputs, such as fuzzing.",
 q:"Developers want to catch insecure code, such as hardcoded passwords, before the application is ever compiled or run. Which approach fits?",
 a:["Static code analysis","Dynamic analysis","Fuzzing","Penetration testing"],
 w:["","Dynamic analysis needs the application running.","Fuzzing sends random input to a running program, so it's a dynamic technique.","Pen testing attacks a running system, usually late in the cycle."],
 c:"code NOT running"},
{id:"pkgmon",d:4,o:"4.3",g:"appsec",t:"Package monitoring",
 f:"Tracking the third-party libraries and dependencies your apps use, and alerting when one has a known vulnerability (think Log4j).",
 q:"After a critical flaw is announced in a popular open-source logging library, a company must quickly find which of its applications include it. Which practice would have made this fast?",
 a:["Package monitoring","Static code analysis","Input validation","Code signing"],
 w:["","Static analysis reviews your own code for flaws; it isn't built to track which third-party versions you depend on.","Input validation checks user data; it doesn't track dependencies.","Code signing proves who published code and that it wasn't altered."],
 c:"third-party libraries / dependencies"},
{id:"inputval",d:4,o:"4.1",g:"appsec",t:"Input validation",
 f:"Checking that data entered into an app is the expected type, length and format before using it, and rejecting the rest. The primary defense against injection (SQLi, XSS).",
 q:"To stop SQL injection, a developer makes the 'zip code' field reject anything that isn't exactly 5 digits. Which secure coding technique is this?",
 a:["Input validation","Code signing","Secure cookies","Obfuscation"],
 w:["","Code signing proves who published code; it doesn't check user input.","Secure cookies protect session cookies; they don't filter form input.","Obfuscation makes code hard to read, not input safe."],
 c:"check input BEFORE using it"},
{id:"codesign",d:4,o:"4.1",g:"appsec",t:"Code signing",
 f:"The developer signs software with a private key. Users' systems verify the signature with the certificate, proving who published it and that it wasn't altered.",
 q:"A company wants customers' computers to verify that its software updates really came from the company and weren't tampered with. What should it implement?",
 a:["Code signing","Input validation","Static code analysis","Sandboxing"],
 w:["","Input validation checks data entered into an app.","Static analysis finds flaws in source code; it doesn't prove origin to customers.","Sandboxing isolates a running app; it doesn't prove who made it."],
 c:"prove publisher + not altered"},
// ---------- 4.1 Hardening / baselines ----------
{id:"baseline",d:4,o:"4.1",g:"harden",t:"Secure baseline",
 f:"A documented, approved secure configuration for a type of system (services, settings, permissions). Establish it, deploy it everywhere, then maintain it and watch for drift.",
 q:"A company wants every new Windows server to start from the same hardened, approved configuration, and to detect when servers drift from it. What should it establish?",
 a:["A secure baseline","A risk register","A playbook","A data inventory"],
 w:["","A risk register tracks risks, not system configurations.","A playbook is step-by-step response for one incident type.","A data inventory catalogs what data you hold."],
 c:"approved standard config + check drift"},
{id:"bench",d:4,o:"4.4",g:"harden",t:"Benchmarks (CIS)",
 f:"Published secure-configuration guides for specific products, such as CIS Benchmarks or vendor hardening guides. Scanners can check systems against them automatically.",
 q:"A team needs an industry-recognized checklist of secure settings for Ubuntu Linux to measure its servers against. What should it use?",
 a:["A CIS Benchmark","The CVE list","A bug bounty program","NetFlow records"],
 w:["","CVE lists known vulnerabilities, not recommended settings.","A bug bounty pays researchers to find flaws.","NetFlow shows traffic patterns."],
 c:"published secure-settings guide"},
// ---------- 4.1 Mobile ----------
{id:"mdm",d:4,o:"4.1",g:"mobile",t:"MDM (Mobile Device Management)",
 f:"Central control of phones and tablets: enforce passcodes and encryption, push apps and settings, and remotely lock or wipe lost devices.",
 q:"A company phone is stolen. IT wants to remotely wipe it and make sure every other phone enforces a PIN and encryption. What tool does this?",
 a:["MDM","DLP","NAC","SIEM"],
 w:["","DLP stops sensitive data from leaving; it doesn't manage or wipe phones.","NAC checks devices before letting them onto the network; it can't wipe a stolen phone.","A SIEM collects and correlates logs; it doesn't control devices."],
 c:"central control + remote wipe"},
{id:"mobdeploy",d:4,o:"4.1",g:"mobile",t:"BYOD / COPE / CYOD",
 f:"BYOD = employees use their own devices. COPE = corporate-owned, personally enabled: the company owns and issues it, and personal use is allowed. CYOD = the employee chooses from a company-approved list; the company owns it.",
 q:"A company buys and issues the same phone model to everyone. Employees don't pick the model, but they may use the phone for personal apps and calls. Which deployment model is this?",
 a:["COPE","BYOD","CYOD","VDI"],
 w:["","In BYOD the employee owns the device.","CYOD lets employees choose from an approved list. Here nobody chooses.","VDI is centrally hosted virtual desktops, not a mobile ownership model."],
 c:"company owns + personal use + no choice"},
// ---------- 4.1 Wireless ----------
{id:"wpa3",d:4,o:"4.1",g:"wifi",t:"WPA3 and SAE",
 f:"WPA3 replaces WPA2's pre-shared key handshake with SAE (Simultaneous Authentication of Equals), which resists offline dictionary attacks on captured handshakes.",
 q:"Attackers captured the Wi-Fi handshake of a WPA2-Personal network and cracked the password offline. Which upgrade BEST prevents this attack?",
 a:["WPA3 with SAE","WPA2 with a longer pre-shared key","WEP","MAC filtering"],
 w:["","A longer key slows cracking, but WPA2-PSK handshakes can still be attacked offline.","WEP is badly broken and far weaker.","MAC filtering is easily spoofed and doesn't protect the handshake."],
 c:"offline handshake cracking → SAE"},
{id:"wpaent",d:4,o:"4.1",g:"wifi",t:"Enterprise vs Personal Wi-Fi",
 f:"Personal = one shared passphrase for everyone. Enterprise = each user authenticates with their own credentials through 802.1X and a RADIUS server (AAA).",
 q:"A company's staff Wi-Fi uses one shared password, so when anyone quits, IT has to change it on every device. Which change lets each user log in with their own credentials?",
 a:["WPA3-Enterprise with RADIUS","WPA3-Personal","Hiding the SSID","A captive portal"],
 w:["","Personal mode still uses one shared passphrase.","Hiding the SSID doesn't change authentication and is easily discovered.","A captive portal is a web login page, usually for guests. It isn't per-user 802.1X authentication."],
 c:"per-user logins = Enterprise + RADIUS"},
{id:"survey",d:4,o:"4.1",g:"wifi",t:"Site survey and heat map",
 f:"A wireless site survey measures signal strength and interference across a space. A heat map shows coverage visually. Used to place access points and find dead zones or signal leaking outside.",
 q:"Before installing new access points, a company wants to see where signal is weak and whether its Wi-Fi leaks into the parking lot. What should it do?",
 a:["Perform a site survey and build a heat map","Run a vulnerability scan","Enable MAC filtering","Deploy a WAF"],
 w:["","A vulnerability scan finds software weaknesses, not signal coverage.","MAC filtering controls which devices connect; it shows nothing about coverage.","A WAF protects web applications."],
 c:"coverage / dead zones / leakage"},
// ---------- 4.2 Asset disposal ----------
{id:"certdest",d:4,o:"4.2",g:"asset",t:"Certification of destruction",
 f:"Documented proof (often from a disposal vendor) that media was sanitized or destroyed. Auditors want it for every drive.",
 q:"A company hires a vendor to shred old hard drives and needs documented proof for auditors that each drive was destroyed. What should it get from the vendor?",
 a:["A certificate of destruction","A data inventory","A service level agreement","A legal hold notice"],
 w:["","A data inventory lists what data you hold and where, not proof of destruction.","An SLA defines service performance targets.","A legal hold ORDERS you to preserve data, which is the opposite."],
 c:"PROOF it was destroyed"},
{id:"sanitize",d:4,o:"4.2",g:"asset",t:"Sanitization vs destruction",
 f:"Sanitization = wiping data so the device can be reused (overwriting, secure or crypto erase). Destruction = physically ruining the media (shredding, pulverizing, incinerating, degaussing magnetic drives).",
 q:"A school wants to donate old laptops to a charity. The drives must stay usable, but no data can be recoverable. Which approach fits?",
 a:["Sanitization","Physical destruction","Degaussing","Deleting files and emptying the recycle bin"],
 w:["","Destroying the drives makes them unusable, which defeats the donation.","Degaussing wrecks magnetic drives (and doesn't reliably erase SSDs), so the drives wouldn't be reusable.","Deleted files are easily recovered with free tools."],
 c:"reuse the device → wipe, don't destroy"},
// ---------- 4.4 Monitoring ----------
{id:"siem",d:4,o:"4.4",g:"mon",t:"SIEM",
 f:"Security Information and Event Management: aggregates logs from many sources, correlates events across them, alerts on suspicious patterns, and supports reporting and archiving.",
 q:"A SOC wants one place that collects logs from firewalls, servers and endpoints, links related events together, and alerts when they add up to an attack. What does it need?",
 a:["SIEM","NetFlow","DLP","Antivirus"],
 w:["","NetFlow records traffic metadata; it doesn't aggregate and correlate all your logs.","DLP stops sensitive data from leaving.","Antivirus detects malware on endpoints."],
 c:"aggregate + correlate + alert"},
{id:"alerttune",d:4,o:"4.4",g:"mon",t:"Alert tuning",
 f:"Adjusting detection rules and thresholds to cut false positives and alert fatigue, so real alerts get attention.",
 q:"SOC analysts get thousands of alerts a day, mostly from one rule that flags normal backup traffic, and they've started ignoring alerts. What should the team do?",
 a:["Tune the alert rules","Turn off the SIEM","Add more analysts to every shift","Archive all alerts without review"],
 w:["","Turning off the SIEM removes detection entirely.","More people doesn't fix a noisy rule; they'd still drown in false positives.","Archiving unreviewed alerts means real attacks get missed."],
 c:"too many false alerts → tune"},
// ---------- 4.9 Data sources ----------
{id:"netflow",d:4,o:"4.9",g:"logs",t:"NetFlow",
 f:"Records metadata about network traffic: who talked to whom, ports, protocols, bytes and timing. No packet contents. Good for spotting unusual data volumes.",
 q:"An analyst needs to see which internal hosts sent unusually large amounts of data to external IPs last week, but doesn't need packet contents. Which data source fits BEST?",
 a:["NetFlow","Full packet capture","SNMP traps","Vulnerability scans"],
 w:["","Packet capture records full contents. That's heavier than needed and rarely kept for a week.","SNMP traps are device event alerts, such as overheating or port failures.","Vulnerability scans show weaknesses, not traffic."],
 c:"who talked to whom + how much (no contents)"},
{id:"pcap",d:4,o:"4.9",g:"logs",t:"Packet capture",
 f:"Records the full contents of network traffic, showing exactly what was sent (payloads), at a large storage cost.",
 q:"Investigators need to see the exact commands an attacker sent to a compromised server over an unencrypted protocol. Which data source provides this?",
 a:["Packet capture","NetFlow","Firewall logs","Dashboard reports"],
 w:["","NetFlow shows that the hosts talked, and how much, but not the contents.","Firewall logs show allowed or blocked connections, not payloads.","Dashboards summarize data; they don't hold raw traffic."],
 c:"actual CONTENTS of traffic"},
// ---------- 4.5 Filtering ----------
{id:"webfilter",d:4,o:"4.5",g:"filter",t:"Web filter (agent vs proxy)",
 f:"Controls which websites users can reach, using URL scanning, content categories, reputation and block rules. Agent-based filters follow the device anywhere; a centralized proxy only filters traffic that passes through it.",
 q:"A company wants to block whole categories of websites, such as gambling and known malware sites, including on laptops used from home. Which solution fits BEST?",
 a:["Agent-based web filter","A centralized proxy in the office","Firewall port rules","DNS caching"],
 w:["","An office proxy only filters traffic that passes through the office network.","Port rules can't tell gambling sites from news sites, since both use port 443.","DNS caching speeds up lookups; it doesn't filter."],
 c:"categories + off-site laptops → agent"},
{id:"dnsfilter",d:4,o:"4.5",g:"filter",t:"DNS filtering",
 f:"Blocks access by refusing to resolve known-bad or disallowed domain names. Covers every device and app that uses the DNS resolver, not just browsers.",
 q:"A company wants to stop every device on its network, including IoT devices with no browser and no agent support, from reaching known malicious domains. Which control fits BEST?",
 a:["DNS filtering","Agent-based web filter","Code signing","File integrity monitoring"],
 w:["","Agents can't be installed on most IoT devices.","Code signing verifies software publishers.","FIM watches for changes to files."],
 c:"block at name resolution, every device"},
// ---------- 4.5 Endpoint / data controls ----------
{id:"fim",d:4,o:"4.5",g:"endp",t:"FIM (File Integrity Monitoring)",
 f:"Watches critical files (system binaries, configs) by comparing their hashes to a known-good baseline, and alerts on unauthorized changes.",
 q:"An admin wants an alert whenever anyone changes critical system files or web server config files on production servers. What should be deployed?",
 a:["File integrity monitoring","DLP","NetFlow","A web filter"],
 w:["","DLP watches sensitive data leaving, not changes to system files.","NetFlow records traffic metadata.","A web filter controls website access."],
 c:"alert when critical files CHANGE"},
{id:"dlp",d:4,o:"4.5",g:"endp",t:"DLP (Data Loss Prevention)",
 f:"Detects and blocks sensitive data (card numbers, SSNs, classified documents) from leaving through email, uploads, USB drives or cloud apps.",
 q:"A company wants to automatically block outgoing emails that contain customer credit card numbers. What should it implement?",
 a:["DLP","FIM","IPS","MDM"],
 w:["","FIM alerts on changes to files; it doesn't inspect outgoing email.","An IPS blocks malicious network traffic, not your own sensitive data leaving.","MDM manages mobile devices."],
 c:"stop sensitive data LEAVING"},
{id:"xdr",d:4,o:"4.5",g:"endp",t:"EDR vs XDR",
 f:"EDR = agents on endpoints that detect, investigate and respond there (isolate the host, kill a process). XDR = extends detection and response across endpoints, network, email and cloud, correlated in one platform.",
 q:"A SOC wants one platform that correlates detections from endpoints, email, network traffic and cloud workloads, not just endpoints. Which solution fits?",
 a:["XDR","EDR","HIDS","Antivirus"],
 w:["","EDR focuses on endpoints only.","A HIDS monitors a single host.","Antivirus is malware protection on endpoints."],
 c:"beyond endpoints: email + network + cloud"},
{id:"uba",d:4,o:"4.5",g:"endp",t:"UBA / UEBA (User Behavior Analytics)",
 f:"Learns each user's (or device's) normal patterns and flags deviations, such as logins at odd hours or sudden mass downloads.",
 q:"A tool knows an accountant normally logs in 8–5 from Chicago and opens a few files a day. It alerts when the account downloads 5,000 files at 3 a.m. Which capability is this?",
 a:["User behavior analytics","Signature-based IDS","DNS filtering","Code signing"],
 w:["","Signature-based IDS matches known attack patterns, not deviations from one user's normal behavior.","DNS filtering blocks bad domains.","Code signing verifies software publishers."],
 c:"learns NORMAL per user, flags deviation"},
{id:"nacpost",d:4,o:"4.5",g:"nac",t:"NAC posture checks",
 f:"Network access control checks a device's identity and health (patched? AV running? company-managed?) before allowing it on the network, and can quarantine non-compliant devices to a remediation VLAN.",
 q:"A company wants any laptop that's missing patches or has antivirus disabled to land on a quarantine VLAN when it connects, until it's fixed. What should it deploy?",
 a:["NAC","DLP","FIM","SIEM"],
 w:["","DLP stops sensitive data from leaving.","FIM alerts on changed files.","A SIEM correlates logs; it doesn't decide which VLAN a device joins."],
 c:"health check BEFORE network access"},
// ---------- 4.5 OS security ----------
{id:"gpo",d:4,o:"4.5",g:"osec",t:"Group Policy",
 f:"A Windows Active Directory feature that pushes security settings (password rules, screen lock, disabling USB storage) to all domain computers and users from one place.",
 q:"An admin must enforce a 15-minute screen lock and disable USB storage on all 2,000 Windows domain computers from one place. What should they use?",
 a:["Group Policy","SELinux","A web filter","NetFlow"],
 w:["","SELinux is a Linux kernel security module.","A web filter controls which websites users can visit.","NetFlow records network traffic metadata."],
 c:"Windows domain, push settings centrally"},
{id:"selinux",d:4,o:"4.5",g:"osec",t:"SELinux",
 f:"Security-Enhanced Linux: a kernel module that enforces mandatory access control, confining what each process can touch even if it's compromised.",
 q:"On a Linux web server, the team wants the kernel to confine the web server process to its own files, even if an attacker takes it over. What should they enable?",
 a:["SELinux","Group Policy","Standard file permissions only","A web filter"],
 w:["","Group Policy is for Windows domains.","Standard (discretionary) permissions don't confine a compromised process the way MAC does.","A web filter controls which sites users browse."],
 c:"Linux + mandatory access control"},
// ---------- 4.6 Access control models ----------
{id:"mac",d:4,o:"4.6",g:"acm",t:"MAC (Mandatory Access Control)",
 f:"The system decides access using security labels (Secret, Top Secret) and user clearances. Users and owners cannot change permissions.",
 q:"In a military system, files are labeled Secret or Top Secret, and users can only open files at or below their clearance. Nobody can share a file by changing its permissions. Which model is this?",
 a:["MAC","DAC","RBAC","ABAC"],
 w:["","In DAC the owner chooses who gets access.","RBAC grants access by job role, not by classification labels.","ABAC weighs many attributes. The clue here is labels plus clearances."],
 c:"labels + clearances, owner can't change"},
{id:"dac",d:4,o:"4.6",g:"acm",t:"DAC (Discretionary Access Control)",
 f:"The owner of a resource decides who can access it, such as sharing your own folder. Flexible, but easy to over-share.",
 q:"An employee creates a folder and personally grants read access to two coworkers. Which access control model allows this?",
 a:["DAC","MAC","RBAC","Rule-based"],
 w:["","MAC doesn't let owners change permissions.","RBAC grants access through job roles, not personal choice.","Rule-based applies admin-defined rules to everyone."],
 c:"OWNER decides"},
{id:"rbac",d:4,o:"4.6",g:"acm",t:"RBAC (Role-Based Access Control)",
 f:"Permissions are assigned to roles (Nurse, AP Clerk), and users get access by being placed in a role. Easy to manage at scale.",
 q:"When a new hire joins accounts payable, IT adds them to the 'AP Clerk' group, and they automatically get every permission that job needs. Which model is this?",
 a:["RBAC","DAC","MAC","ABAC"],
 w:["","DAC is the owner granting access personally.","MAC uses classification labels and clearances.","ABAC combines many attributes, such as device and location, not just the job role."],
 c:"job role / group"},
{id:"abac",d:4,o:"4.6",g:"acm",t:"ABAC (Attribute-Based Access Control)",
 f:"Evaluates multiple attributes of the user, resource and environment together, such as department, device, location and time.",
 q:"A policy allows access to patient records only if the user is in Cardiology, on a company-managed device, inside the hospital network, during their shift. Which model is this?",
 a:["ABAC","RBAC","DAC","MAC"],
 w:["","RBAC looks only at role. This combines department with device, location and time.","DAC lets owners decide.","MAC uses labels and clearances."],
 c:"many attributes combined"},
{id:"rulebac",d:4,o:"4.6",g:"acm",t:"Rule-based access control",
 f:"Access follows system-wide rules set by an administrator that apply to everyone, such as firewall ACLs or time-of-day restrictions.",
 q:"An admin configures the payroll application so that no one can log in between 8 p.m. and 6 a.m., regardless of their role. Which model does this BEST describe?",
 a:["Rule-based access control","RBAC","DAC","MAC"],
 w:["","RBAC is about roles. This rule ignores roles entirely.","DAC lets owners decide access.","MAC uses labels and clearances."],
 c:"admin rule for EVERYONE (time, ACL)"},
// ---------- 4.6 Authentication ----------
{id:"mfa",d:4,o:"4.6",g:"mfa",t:"MFA factor categories",
 f:"Something you know (password, PIN), have (phone, token, smart card), are (fingerprint, face), and somewhere you are (location). Real MFA uses factors from DIFFERENT categories.",
 q:"Which login combination is TRUE multifactor authentication?",
 a:["A password and a code from an authenticator app","A password and a PIN","A password and a security question","A fingerprint and a face scan"],
 w:["","A password and a PIN are both something you know: one factor, used twice.","A security question is also something you know.","Fingerprint and face are both something you are."],
 c:"DIFFERENT categories"},
{id:"pwless",d:4,o:"4.6",g:"mfa",t:"Passwordless authentication",
 f:"Signing in without a password, using a security key (FIDO2/WebAuthn) or biometrics on a trusted device. Removes the password that phishing steals.",
 q:"A company wants to stop password phishing entirely by having employees sign in with a hardware security key and a fingerprint instead of a password. What approach is this?",
 a:["Passwordless authentication","Stronger password complexity rules","SSO with SAML","Security questions"],
 w:["","Stronger passwords can still be phished.","SSO reduces how many passwords you type, but usually still starts with one.","Security questions are another thing you know, and can be phished."],
 c:"no password at all"},
{id:"jit",d:4,o:"4.6",g:"pam",t:"PAM: just-in-time permissions",
 f:"Privileged access management protects admin access. Just-in-time (JIT) grants elevated rights only when requested and removes them automatically afterward. Related: ephemeral credentials that expire after use.",
 q:"Admins currently hold permanent domain admin rights. The company wants them to request elevated rights only when needed, with access removed automatically after 2 hours. Which capability is this?",
 a:["Just-in-time permissions","Password vaulting","Single sign-on","Federation"],
 w:["","Vaulting stores and checks out privileged passwords; it doesn't grant time-limited rights.","SSO lets users log in once to many services.","Federation trusts identities across organizations."],
 c:"elevate only when needed, auto-expire"},
{id:"vault",d:4,o:"4.6",g:"pam",t:"PAM: password vaulting",
 f:"Privileged passwords live in a secure vault. Admins check them out, every use is logged, and the password can rotate automatically after check-in.",
 q:"Shared admin passwords for network devices are kept in a spreadsheet. The company wants them in a secure system where admins check them out, every use is logged, and passwords rotate after use. What is this?",
 a:["Password vaulting","Just-in-time permissions","Federation","Self-service password reset"],
 w:["","JIT grants temporary elevated rights to an account; it doesn't store shared passwords.","Federation trusts identities from another organization.","Self-service reset lets users reset their own passwords."],
 c:"check out admin passwords + logged + rotated"},
{id:"federation",d:4,o:"4.6",g:"sso",t:"Federation",
 f:"A trust relationship between organizations or identity domains, so users authenticated by their home identity provider can access a partner's resources without a separate account.",
 q:"Two partner companies want each other's employees to access a shared project portal with their own company logins, without creating new accounts. What should they set up?",
 a:["Federation","Password vaulting","Rule-based access control","Group Policy"],
 w:["","Vaulting stores privileged passwords.","Rule-based access applies admin rules; it doesn't trust another organization's logins.","Group Policy pushes Windows settings within one domain."],
 c:"trust ANOTHER org's logins"},
{id:"deprov",d:4,o:"4.6",g:"iamlife",t:"Provisioning and deprovisioning",
 f:"Provisioning = creating accounts and granting the access a person needs. Deprovisioning = promptly removing it when they leave or change roles. Stale accounts are a common way in.",
 q:"An audit finds 40 active accounts belonging to employees who left the company months ago. Which IAM process failed?",
 a:["Deprovisioning","Provisioning","Identity proofing","Federation"],
 w:["","Provisioning creates accounts. The failure was in removing them.","Identity proofing verifies who someone is before creating their account.","Federation is trust between organizations."],
 c:"left the company, account still active"},
// ---------- 4.7 Automation ----------
{id:"guardrail",d:4,o:"4.7",g:"auto",t:"Automation: guard rails and use cases",
 f:"Automation enforces baselines consistently. Guard rails automatically block insecure actions (such as a public storage bucket). Other uses: user and resource provisioning, ticket creation, escalation, enabling or disabling services.",
 q:"A cloud team adds automation that instantly blocks anyone from creating a storage bucket that's open to the public internet. What is this an example of?",
 a:["A guard rail","Technical debt","A tabletop exercise","Risk transference"],
 w:["","Technical debt is the future cost of shortcuts, not a protective control.","A tabletop is a discussion-based IR exercise.","Transference shifts risk to another party, such as an insurer."],
 c:"auto-blocks an insecure config"},
{id:"autorisk",d:4,o:"4.7",g:"auto",t:"Automation drawbacks",
 f:"Automation concerns: complexity, cost, becoming a single point of failure, technical debt from quick scripts, and ongoing supportability (who maintains it?). Benefits include efficiency, enforcing baselines, faster reaction time, and acting as a workforce multiplier.",
 q:"A company's critical account provisioning runs on scripts written by one engineer who just left, and nobody else understands them. Which automation concern does this show?",
 a:["Ongoing supportability","Workforce multiplier","Enforcing baselines","Reaction time"],
 w:["","Workforce multiplier is a BENEFIT: automation lets a few people do more.","Enforcing baselines is a benefit.","Faster reaction time is a benefit."],
 c:"nobody can maintain it"},
// ---------- 4.8 Investigation & forensics ----------
{id:"rca",d:4,o:"4.8",g:"irdisc",t:"Root cause analysis",
 f:"Finding the underlying reason an incident happened (an unpatched server, missing MFA), not just its symptoms, so it doesn't happen again. Feeds lessons learned.",
 q:"After recovering from a breach, the team investigates WHY the attacker got in, and traces it to a firewall rule left open after a change two years ago. What process is this?",
 a:["Root cause analysis","Threat hunting","E-discovery","Containment"],
 w:["","Threat hunting proactively searches for attackers not yet detected.","E-discovery produces electronic evidence for legal proceedings.","Containment stops the spread during the incident; it's already over here."],
 c:"WHY it happened"},
{id:"hunt",d:4,o:"4.8",g:"irdisc",t:"Threat hunting",
 f:"Proactively searching for threats that slipped past existing defenses, guided by a hypothesis or threat intel, instead of waiting for alerts.",
 q:"With no alerts firing, analysts use new intel about an APT's techniques to search their logs for signs the group is already inside. What is this?",
 a:["Threat hunting","Root cause analysis","Vulnerability scanning","Alert tuning"],
 w:["","RCA explains why a known incident happened.","Vulnerability scanning looks for weaknesses, not attackers already inside.","Alert tuning adjusts detection rules to reduce noise."],
 c:"proactive, no alert, assume breach"},
{id:"legalhold",d:4,o:"4.8",g:"forensic",t:"Legal hold",
 f:"An instruction to preserve all data related to a lawsuit or investigation. Normal deletion and retention schedules are suspended for that data.",
 q:"Legal counsel tells IT that a lawsuit is expected and that all email for three employees must be preserved, even if retention policy would normally delete it. What is this?",
 a:["Legal hold","Chain of custody","E-discovery","Data sovereignty"],
 w:["","Chain of custody documents who handled evidence; it doesn't order data kept.","E-discovery is finding and producing the evidence. The preservation order comes first.","Data sovereignty is about which country's laws apply."],
 c:"PRESERVE, override deletion"},
{id:"custody",d:4,o:"4.8",g:"forensic",t:"Chain of custody",
 f:"A record of everyone who handled a piece of evidence, when, and why, from collection to court. Gaps can make evidence inadmissible.",
 q:"Evidence from a breach may go to court. Which document tracks every person who handled the seized hard drive, and when?",
 a:["Chain of custody form","Legal hold notice","Incident response plan","Certificate of destruction"],
 w:["","A legal hold orders data preserved; it doesn't track who handled it.","The IR plan describes how to respond, not who touched a specific item.","A certificate of destruction proves media was destroyed."],
 c:"who handled the evidence, when"},
{id:"volatility",d:4,o:"4.8",g:"forensic",t:"Order of volatility",
 f:"Collect the most volatile evidence first, because it disappears fastest: CPU registers and cache → RAM → swap and temp files → disk → remote logs → backups and archives. Named outright in the older SY0-601 objectives; in SY0-701 it sits under acquisition.",
 q:"A responder arrives at a running, compromised server. Which evidence should they collect FIRST?",
 a:["Contents of RAM","A full hard drive image","Logs on a remote syslog server","Backup tapes"],
 w:["","The disk survives a reboot. RAM doesn't, so it goes first.","Remote logs are much less volatile.","Backups are the least volatile of all."],
 c:"what vanishes first → RAM before disk"},
{id:"ediscovery",d:4,o:"4.8",g:"forensic",t:"E-discovery",
 f:"Identifying, collecting and producing electronically stored information (email, files, chats) as evidence in legal proceedings.",
 q:"Opposing lawyers request all emails and chat messages about a contract dispute. The company searches, collects and hands over the relevant data. What is this process?",
 a:["E-discovery","Legal hold","Threat hunting","Root cause analysis"],
 w:["","A legal hold preserves the data; producing it for the other side is e-discovery.","Threat hunting searches for attackers.","RCA finds why an incident happened."],
 c:"find + PRODUCE data for a lawsuit"}
);

// Wave 3 — Domain 2 expansion (threat actors, vectors, vulnerabilities, indicators, mitigations)
DECK.push(
// ---------- 2.1 Threat actors ----------
{id:"nation",d:2,o:"2.1",g:"actor",t:"Nation-state actor",
 f:"Government-backed attackers with huge resources and high sophistication. Motives: espionage, war, and disrupting another country's infrastructure. Often run long, stealthy APT campaigns.",
 q:"Investigators find an attacker has quietly stayed inside a defense contractor's network for 18 months, using custom zero-day malware to steal weapons designs. Which threat actor is MOST likely?",
 a:["Nation-state","Unskilled attacker","Hacktivist","Organized crime"],
 w:["","Unskilled attackers use existing tools and can't build custom zero-days or stay hidden for 18 months.","Hacktivists want publicity for a cause; quiet long-term theft of designs isn't their style.","Organized crime wants money fast, such as ransom or stolen card data, not weapons designs."],
 c:"huge resources + espionage + long and stealthy (APT)"},
{id:"unskilled",d:2,o:"2.1",g:"actor",t:"Unskilled attacker (script kiddie)",
 f:"Low sophistication and low resources. Runs tools and exploits other people wrote, often for bragging rights or curiosity.",
 q:"A teenager downloads a ready-made DDoS tool from a forum and points it at his school's website to impress friends. Which threat actor type is this?",
 a:["Unskilled attacker","Nation-state","Insider threat","Organized crime"],
 w:["","A nation-state has massive resources and writes its own tools.","An insider is someone with legitimate access inside the organization; using a downloaded tool on the public website doesn't make him one.","Organized crime is motivated by money and is well resourced."],
 c:"someone else's tools + bragging rights"},
{id:"hacktivist",d:2,o:"2.1",g:"actor",t:"Hacktivist",
 f:"Attacks to promote a political, social or philosophical cause: defacing websites, leaking data, or DDoS against organizations they oppose.",
 q:"After an oil company announces a new pipeline, its homepage is replaced with an environmental protest message, and internal emails are leaked online. Which threat actor is MOST likely?",
 a:["Hacktivist","Organized crime","Shadow IT","Nation-state"],
 w:["","Organized crime wants money and would demand ransom or sell data, not post protest messages.","Shadow IT is employees using unapproved technology, not an attack.","Nation-states usually work quietly and wouldn't announce a cause on the homepage."],
 c:"political / social cause + publicity"},
{id:"orgcrime",d:2,o:"2.1",g:"actor",t:"Organized crime",
 f:"Well-funded criminal groups motivated by financial gain: ransomware, extortion, stolen card data, fraud. Fairly sophisticated, and they operate like a business.",
 q:"A group encrypts a hospital's systems, threatens to leak patient data, and demands $2 million in cryptocurrency. Which threat actor is MOST likely?",
 a:["Organized crime","Hacktivist","Unskilled attacker","Shadow IT"],
 w:["","Hacktivists are driven by a cause, not a multi-million-dollar payout.","Running a double-extortion ransomware operation takes more skill and resources than an unskilled attacker has.","Shadow IT is unapproved tech use by employees."],
 c:"money (ransom, extortion, fraud)"},
{id:"insideract",d:2,o:"2.1",g:"actor",t:"Insider threat (actor)",
 f:"Someone with legitimate access: an employee, contractor or partner. Motives include revenge, financial gain or being coerced. They are internal and already past most perimeter defenses.",
 q:"A system admin who was passed over for promotion deletes critical databases on his last day using his own admin account. Which threat actor type and motivation fit BEST?",
 a:["Insider threat motivated by revenge","Nation-state motivated by espionage","Hacktivist motivated by philosophy","Unskilled attacker motivated by curiosity"],
 w:["","There's no sign of a foreign government or of data being stolen.","There's no political or social cause.","He's a skilled admin using legitimate access, not an outsider poking around."],
 c:"legitimate access + grudge"},
{id:"shadowit",d:2,o:"2.1",g:"actor",t:"Shadow IT",
 f:"Employees using hardware, software or cloud services that IT hasn't approved, such as a personal Dropbox for work files. Not malicious, but it creates unmanaged risk.",
 q:"A marketing team signs up for an unapproved file-sharing service with a company card and stores client contracts there, because IT's tool is 'too slow'. What is this?",
 a:["Shadow IT","Insider threat with malicious intent","Supply chain attack","Data sovereignty"],
 w:["","They aren't trying to cause harm; they're working around IT.","A supply chain attack compromises a vendor to reach you.","Data sovereignty is about which country's laws apply to data."],
 c:"unapproved tech, not malicious"},
// ---------- 2.2 Threat vectors ----------
{id:"typosquat",d:2,o:"2.2",g:"vector",t:"Typosquatting",
 f:"Registering look-alike domain names that rely on users mistyping or misreading them, such as rnicrosoft.com or amazom.com.",
 q:"Attackers register 'paypa1.com' so that users who mistype or don't notice the '1' land on a fake login page. What technique is this?",
 a:["Typosquatting","Watering hole","Pharming","Vishing"],
 w:["","A watering hole compromises a real site the targets already visit.","Pharming redirects users who typed the CORRECT address, by poisoning DNS or hosts files.","Vishing uses phone calls."],
 c:"look-alike / misspelled domain"},
{id:"watering",d:2,o:"2.2",g:"vector",t:"Watering hole attack",
 f:"Compromising a legitimate website that a specific target group is known to visit, so their browsers get infected when they go there.",
 q:"Attackers can't phish a well-trained bank's staff, so they compromise a local sandwich shop's online ordering site that the bank's employees use every day. What is this?",
 a:["Watering hole attack","Typosquatting","Spear phishing","Brand impersonation"],
