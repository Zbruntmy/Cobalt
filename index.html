<style>
*{box-sizing:border-box} html,body{margin:0}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,select,summary,.flip,.pl{touch-action:manipulation}
select,textarea{font-size:16px}
.installbtn{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px;font:500 .72rem var(--f-mono)}
:root{
  --bg:#f3f6fc; --surface:#ffffff; --surface2:#eaf0fb; --ink:#0d1526; --muted:#55617a; --line:#d8e0ee;
  --accent:#0047ab; --accent-ink:#ffffff; --accent-soft:rgba(0,71,171,.09);
  --safe:#1a7a4f; --safe-soft:rgba(26,122,79,.10); --miss:#c0352b; --miss-soft:rgba(192,53,43,.09);
  --warn:#9a5c00; --warn-soft:rgba(168,100,0,.11);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0a0f1d; --surface:#121a2e; --surface2:#18223b; --ink:#e8eefb; --muted:#9aa8c4; --line:#24304d;
  --accent:#4f8cff; --accent-ink:#071023; --accent-soft:rgba(79,140,255,.15);
  --safe:#5fd39a; --safe-soft:rgba(95,211,154,.12); --miss:#ff7b6e; --miss-soft:rgba(255,123,110,.12);
  --warn:#f2b544; --warn-soft:rgba(242,181,68,.13); color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top,0px)) 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:36px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.4rem,7vw,3.3rem);letter-spacing:.04em}
h2{font-size:1.5rem} h3{font-size:1.12rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
section{display:grid;gap:14px}
.eyebrow{font:500 .72rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lbl{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:grid;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:22px;position:relative}
header.top .lede{color:var(--muted);max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 .76rem var(--f-mono);color:var(--muted)}
.iconbtn{position:absolute;top:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.safe{background:var(--safe-soft);border-color:transparent;color:var(--safe)}
.btn.miss{background:var(--miss-soft);border-color:transparent;color:var(--miss)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* study next */
.next{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.next b{font-family:var(--f-display);font-size:1.35rem}
.next p{color:var(--muted);font-size:.92rem}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 .76rem var(--f-mono);color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* mode tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;text-align:left;align-content:start}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--f-display);font-size:1.18rem;color:var(--accent)}
.tile span{font-size:.88rem;color:var(--muted)}
.tile.main{background:var(--accent-soft);border-color:var(--accent)}
/* domain rows */
.drow{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.drow .top2{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.drow b{font-family:var(--f-display);font-size:1.05rem}
.drow .pct{font:500 .82rem var(--f-mono);color:var(--accent);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.drow small{font:500 .72rem var(--f-mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.stats b{font:700 1.5rem var(--f-display)}
.stats span{font:500 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* study view */
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:14px;flex-wrap:wrap}
.bar-top .left{display:flex;align-items:center;gap:12px}
.sess{font:500 .76rem var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.tag{display:flex;gap:10px;flex-wrap:wrap;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag .d{color:var(--accent)}
.q{font-size:1.06rem;line-height:1.55}
.flip{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;border-radius:12px;background:var(--surface2);padding:24px 18px;border:1px dashed var(--line)}
.flip .front{font:700 clamp(1.6rem,5vw,2.2rem)/1.15 var(--f-display)}
.flip .back{font-size:1.04rem;line-height:1.6;text-align:left}
.flip .hint{font:500 .7rem var(--f-mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:14px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;min-height:52px}
.opt .k{font:600 .8rem var(--f-mono);color:var(--muted);width:1.7rem;height:1.7rem;border-radius:6px;display:grid;place-items:center;background:var(--surface2)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--safe);background:var(--safe-soft)}
.opt.right .k{background:var(--safe);color:var(--bg)}
.opt.wrong{border-color:var(--miss);background:var(--miss-soft)}
.opt.wrong .k{background:var(--miss);color:var(--bg)}
.opt:disabled{cursor:default}
.fb{display:grid;gap:10px;border-radius:12px;padding:14px 16px}
.fb.good{background:var(--safe-soft)} .fb.bad{background:var(--miss-soft)} .fb.idk{background:var(--warn-soft)}
.fb .verdict{font:700 1.2rem var(--f-display)}
.fb.good .verdict{color:var(--safe)} .fb.bad .verdict{color:var(--miss)} .fb.idk .verdict{color:var(--warn)}
.fb p{font-size:.94rem}
.clue{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:.92rem}
.clue b{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block}
.bd{display:grid;gap:10px}
.bdr{border:1px solid var(--line);border-left:4px solid var(--miss);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.bdr.ok{border-left-color:var(--safe);background:var(--safe-soft)}
.bdr.mine:not(.ok){background:var(--miss-soft)}
.bdh{display:grid;grid-template-columns:1.7rem minmax(0,1fr);gap:10px;align-items:start}
.bdh .k{font:600 .8rem var(--f-mono);width:1.7rem;height:1.7rem;border-radius:6px;display:grid;place-items:center;background:var(--miss);color:var(--bg)}
.bdr.ok .bdh .k{background:var(--safe)}
.bdtag{font:500 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--miss);display:block;margin-top:2px}
.bdr.ok .bdtag{color:var(--safe)}
.bdr p{font-size:.92rem;padding-left:2.325rem}
.ptab{display:grid;gap:10px}
.prow{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.prow.ok{border-left:4px solid var(--safe)} .prow.no{border-left:4px solid var(--miss)}
.pfx,.psel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pv{font-weight:600;font-size:.95rem} .pv.mono{font:500 .76rem/1.45 var(--f-mono);word-break:break-all}
select.sok{border-color:var(--safe);background:var(--safe-soft)} select.sbad{border-color:var(--miss);background:var(--miss-soft)}
select:disabled{opacity:1;color:var(--ink)}
.pfb{border-left:3px solid var(--miss);padding:2px 0 2px 10px;font-size:.9rem} .pfb.ok{border-color:var(--safe)}
.pfb b{color:var(--miss)} .pfb.ok b{color:var(--safe)}
.pord{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pord li{display:grid;grid-template-columns:1.7rem minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.pord li .k{font:600 .8rem var(--f-mono);width:1.7rem;height:1.7rem;border-radius:6px;display:grid;place-items:center;background:var(--surface2)}
.pord li.ok{border-left:4px solid var(--safe);background:var(--safe-soft)} .pord li.no{border-left:4px solid var(--miss);background:var(--miss-soft)}
.pord p{font-size:.88rem;margin-top:4px}
.mv{display:flex;gap:6px} .mv .btn{min-height:44px;padding:6px 14px}
.plog{display:grid;gap:6px}
.pl{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:44px}
.pl code{font:500 .74rem/1.45 var(--f-mono);white-space:pre-wrap;word-break:break-all}
.pl.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.pl.ok{border-left:4px solid var(--safe);background:var(--safe-soft)} .pl.miss{border-left:4px solid var(--warn);background:var(--warn-soft)}
.pl.fp{border-left:4px solid var(--miss);background:var(--miss-soft)} .pl.quiet{opacity:.75}
.pl:disabled{cursor:default;color:var(--ink)} .pn{font-size:.85rem}
.linkbtn.gl{color:var(--accent);text-align:left}
.glist{display:grid;gap:10px}
.gobj{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;font-size:.95rem}
.gobj>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:6px;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink)}
.gobj>summary::-webkit-details-marker{display:none}
.gobj[open]>summary{border-bottom:1px solid var(--line)}
.gs{display:flex;gap:10px;align-items:baseline} .gs b{font-family:var(--f-display);font-size:1.12rem}
.go{font:600 .78rem var(--f-mono);color:var(--accent)} .gm{font:500 .72rem var(--f-mono);color:var(--muted)} .gwt{color:var(--miss)}
.gbody{padding:14px 16px;display:grid;gap:10px}
.gcard{border-left:3px solid var(--line);padding:6px 0 6px 12px;display:grid;gap:4px}
.gcard.weak{border-left-color:var(--miss);background:var(--miss-soft);border-radius:0 8px 8px 0;padding-right:10px}
.gcard.hl{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.gt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .gt b{font-size:.98rem}
.gw,.gk{font:600 .62rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.gw{background:var(--miss);color:var(--bg)} .gk{background:var(--safe-soft);color:var(--safe)}
.gcard p{font-size:.9rem} .gc{font-size:.84rem;color:var(--muted)} .gc span{font:600 .64rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
details{font-size:.9rem}
details summary{cursor:pointer;color:var(--muted);font:500 .74rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
details ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.kbd{font:500 .68rem var(--f-mono);color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--warn);font-weight:600;padding:8px 0;justify-self:start}
.toggle{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:500 .72rem var(--f-mono);color:var(--muted)}
.toggle.on{color:var(--accent);border-color:var(--accent)}
/* exam */
.timer{font:700 1.3rem var(--f-mono);color:var(--accent)}
.timer.low{color:var(--miss)}
.prog{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.score{font:700 clamp(3rem,12vw,4.5rem)/1 var(--f-display)}
.miss-list{display:grid;gap:12px}
.miss-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;font-size:.93rem}
/* audio */
.audio-q{font-size:1.15rem;line-height:1.55;min-height:6em}
.audio-a{font:700 1.4rem var(--f-display);color:var(--safe);min-height:1.6em}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{font:500 .74rem var(--f-mono);min-height:180px;resize:vertical}
.field{display:grid;gap:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,10,20,.6);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:560px;width:100%;display:grid;gap:12px}
.note{font-size:.88rem;color:var(--muted)}
.ok{color:var(--safe);font-weight:600;font-size:.9rem}
.err{color:var(--miss);font-weight:600;font-size:.9rem}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:clamp(48px,11vw,64px);height:auto;color:var(--accent);flex:none}
.mark.sm{width:22px;vertical-align:-5px;margin-right:6px}
footer{font:500 .74rem var(--f-mono);color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:560px){
  .tiles,.row2,.ctl{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .iconbtn{position:static;justify-self:start}
  .card{padding:18px 14px}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const DECK=[];
// Domain 5 — Security Program Management & Oversight (part A)
// a[0] is always the correct answer; w[i] explains why a[i] is wrong. Options are shuffled at render.
DECK.push(
// ---------- 5.3 Agreement types ----------
{id:"mou",d:5,o:"5.3",g:"agree",t:"MOU (Memorandum of Understanding)",
 f:"An informal, usually non-binding agreement that states two parties intend to work together. Typically the first step before formal contracts.",
 q:"Two companies are in early talks about possibly teaming up on a shared support service. Before lawyers get involved, they want a document that simply records their intent to cooperate. Which agreement fits BEST?",
 a:["MOU","MOA","BPA","SOW"],
 w:["","An MOA is more formal: it spells out specific responsibilities and conditions each side agrees to. Too heavy for 'early talks'.","A BPA governs an established partnership, such as how profits, losses and responsibilities are split. They aren't partners yet.","A SOW defines a specific project's scope, deliverables and timeline. There's no project defined yet."],
 c:"early talks / record intent"},
{id:"moa",d:5,o:"5.3",g:"agree",t:"MOA (Memorandum of Agreement)",
 f:"A more formal agreement than an MOU that defines the specific responsibilities and conditions each party commits to. Often used between agencies or departments.",
 q:"Two government agencies have agreed to share an incident-response team. They need a formal document that lists exactly which agency provides staff, which provides equipment, and under what conditions. Which agreement is MOST appropriate?",
 a:["MOA","MOU","NDA","SLA"],
 w:["","An MOU only records intent to cooperate and is usually non-binding. They need specific responsibilities and conditions.","An NDA only covers keeping information confidential.","An SLA defines measurable service levels (uptime, response time) from a provider, not shared responsibilities between peers."],
 c:"formal + specific responsibilities and conditions"},
{id:"sla",d:5,o:"5.3",g:"agree",t:"SLA (Service Level Agreement)",
 f:"A contract that defines measurable service performance a provider must meet: uptime percentage, response and resolution times, and penalties if they miss.",
 q:"A company signs with a cloud provider and wants a guarantee of 99.95% uptime, a 1-hour response time for critical tickets, and service credits if those targets are missed. Which document covers this?",
 a:["SLA","SOW","MSA","MOU"],
 w:["","A SOW describes a project's scope, deliverables and timeline, not ongoing performance metrics.","An MSA sets general terms for a long-term relationship; the measurable targets live in an SLA.","An MOU is an informal statement of intent with no measurable guarantees."],
 c:"measurable uptime / response metrics"},
{id:"sow",d:5,o:"5.3",g:"agree",t:"SOW / WO (Statement of Work / Work Order)",
 f:"Defines a specific engagement: scope, deliverables, timeline, milestones and responsibilities. Often issued under an MSA.",
 q:"A software firm is starting a project for a new client. The client wants a document that lays out exactly what will be built, the deliverables, and the project timeline. Which document is MOST appropriate?",
 a:["SOW","SLA","MOU","NDA"],
 w:["","An SLA covers ongoing service performance (uptime, response time), not a project's scope and deliverables.","An MOU only states intent to work together; it doesn't define deliverables.","An NDA only covers confidentiality."],
 c:"scope + deliverables + timeline"},
{id:"msa",d:5,o:"5.3",g:"agree",t:"MSA (Master Service Agreement)",
 f:"An umbrella contract that sets the general terms (payment, liability, IP, dispute resolution) for an ongoing relationship, so each future project only needs a short SOW.",
 q:"A company expects to hire the same consulting firm for many projects over the next three years. It wants to negotiate payment, liability and confidentiality terms once, then issue short project documents as needed. Which agreement should it sign first?",
 a:["MSA","SOW","SLA","BPA"],
 w:["","A SOW covers one specific project. The MSA is the umbrella that future SOWs fall under.","An SLA defines measurable service levels, not overall contract terms.","A BPA is for business partners sharing profits and responsibilities, not a client-vendor relationship."],
 c:"many future projects / negotiate terms once"},
{id:"bpa",d:5,o:"5.3",g:"agree",t:"BPA (Business Partnership Agreement)",
 f:"An agreement between business partners that defines how they share profits, losses, responsibilities and decision-making.",
 q:"Two firms are forming a formal partnership. They need to document how profits and losses will be split and which partner is responsible for each part of the business. Which agreement fits BEST?",
 a:["BPA","MOU","SLA","NDA"],
 w:["","An MOU is only a preliminary statement of intent; it doesn't define profit sharing.","An SLA sets performance targets for a service provider.","An NDA only protects confidential information."],
 c:"partners + profits/losses split"},
{id:"nda",d:5,o:"5.3",g:"agree",t:"NDA (Non-Disclosure Agreement)",
 f:"A legal agreement that requires parties to keep specified information confidential. It doesn't define services, projects or partnerships.",
 q:"Before showing a vendor its unreleased product designs during a sales pitch, a company wants the vendor legally bound to keep those details secret. Which agreement should it use?",
 a:["NDA","MOA","SOW","BPA"],
 w:["","An MOA defines responsibilities in a formal cooperation, not secrecy.","A SOW defines a project's deliverables and timeline.","A BPA governs how partners share profits and responsibilities."],
 c:"keep it secret"},
// ---------- 5.3 Vendor management ----------
{id:"rta",d:5,o:"5.3",g:"vendor",t:"Right-to-audit clause",
 f:"A contract clause that gives the customer the right to audit (or have a third party audit) the vendor's security controls and compliance.",
 q:"A company is negotiating a contract with a payroll processor and wants to be able to inspect the processor's security controls in the future. What should it add to the contract?",
 a:["A right-to-audit clause","A non-disclosure agreement","A service level agreement","A conflict-of-interest statement"],
 w:["","An NDA keeps information confidential; it doesn't grant any right to inspect controls.","An SLA defines performance targets, not inspection rights.","A conflict-of-interest statement is part of vendor selection, not ongoing inspection."],
 c:"inspect the vendor's controls later"},
{id:"vmon",d:5,o:"5.3",g:"vendor",t:"Vendor monitoring",
 f:"Ongoing oversight of vendors after selection: periodic risk assessments, checking compliance with contracts and internal policies, and reviewing security performance.",
 q:"A government agency's IT team already uses several cloud vendors. Which activity is part of the team's ongoing vendor MONITORING duties?",
 a:["Assessing vendors' compliance with contractual and policy requirements","Checking whether vendors hit their sales targets","Reviewing vendors' stock price and market reputation","Negotiating the initial purchase price"],
 w:["","A vendor's sales targets don't affect your security posture.","Financial reputation can be part of initial due diligence, but it isn't a security monitoring task.","Price negotiation happens during selection and contracting, not monitoring."],
 c:"ongoing + compliance with contract/policy"},
{id:"dued",d:5,o:"5.3",g:"vendor",t:"Due diligence (vendor selection)",
 f:"Researching and verifying a vendor before signing: financial health, security practices, certifications, references, and history of breaches.",
 q:"Before choosing a managed security provider, a company researches each candidate's breach history, certifications, financial stability and customer references. What is this process called?",
 a:["Due diligence","Due care","Attestation","Rules of engagement"],
 w:["","Due care is acting responsibly to protect assets once you're accountable (implementing controls). Researching before choosing is due diligence.","Attestation is a formal statement that something is true, such as an auditor's opinion or a user signing off on a policy.","Rules of engagement define the scope and limits of a penetration test."],
 c:"research BEFORE signing"},
{id:"coi",d:5,o:"5.3",g:"vendor",t:"Conflict of interest",
 f:"When a person involved in a decision (such as vendor selection) has a personal or financial interest that could bias the outcome. Must be disclosed during vendor selection.",
 q:"During a vendor bake-off, it's discovered that the IT manager scoring the bids owns stock in one of the bidders. What vendor-selection concern does this raise?",
 a:["Conflict of interest","Supply chain analysis","Vendor diversity","Right to audit"],
 w:["","Supply chain analysis looks at risks in the vendor's own suppliers and components.","Vendor diversity means using multiple vendors to avoid a single point of failure.","Right to audit is a contract clause for inspecting a vendor's controls."],
 c:"personal financial interest in the outcome"},
{id:"sca",d:5,o:"5.3",g:"vendor",t:"Supply chain analysis",
 f:"Evaluating risks in a vendor's suppliers, components and subcontractors, such as counterfeit hardware, compromised software updates or a fragile single source.",
 q:"A company buying network switches wants to confirm the vendor's components don't come from untrusted manufacturers, and that firmware updates can't be tampered with on the way in. Which assessment is this?",
 a:["Supply chain analysis","Penetration testing","Vendor questionnaire","Business impact analysis"],
 w:["","A pen test actively attacks a system to find weaknesses; it doesn't trace component origins.","A questionnaire is a self-reported survey of the vendor's own practices; it doesn't go deep into upstream suppliers.","A BIA measures the business impact of losing a function (RTO/RPO)."],
 c:"components / suppliers / upstream"},
{id:"vq",d:5,o:"5.3",g:"vendor",t:"Vendor questionnaire",
 f:"A standardized survey the vendor fills out about its security controls, policies and compliance. Quick to scale, but self-reported.",
 q:"A company has 60 small SaaS vendors and wants a scalable first look at each one's security practices without auditing them all on-site. What should it use?",
 a:["Security questionnaires","Right-to-audit clauses","Independent penetration tests","Rules of engagement"],
 w:["","A right-to-audit clause grants permission to audit but doesn't scale to 60 vendors as a first look.","Independent pen tests on 60 vendors would be expensive and slow, which is the opposite of scalable.","Rules of engagement define the limits of a pen test, not a vendor survey."],
 c:"scalable first look / self-reported"},
{id:"roe",d:5,o:"5.3",g:"pentest",t:"Rules of engagement (RoE)",
 f:"The agreed scope and limits of a penetration test: which systems, what times, which techniques are allowed, emergency contacts, and how to handle sensitive data.",
 q:"Before a pen test begins, the tester and client sign a document listing the in-scope IP ranges, permitted testing hours, and forbidden techniques such as denial of service. What is this document?",
 a:["Rules of engagement","Statement of work","Non-disclosure agreement","Attestation of compliance"],
 w:["","A SOW defines the deliverables and timeline. The technical do's and don'ts of the test are the RoE.","An NDA only covers confidentiality.","An attestation is a formal declaration that requirements are met, usually after an assessment."],
 c:"scope + allowed techniques + times"},
// ---------- 5.2 Risk roles / register ----------
{id:"rown",d:5,o:"5.2",g:"rrole",t:"Risk owner",
 f:"The person or team accountable for managing a specific risk: assessing it, putting mitigations in place, and monitoring whether they work.",
 q:"A company finds a high-likelihood, high-impact data breach risk in its e-commerce app. It assigns a team to manage that risk and implement controls to mitigate it. What role is this team performing?",
 a:["Risk owner","Risk stakeholder","Key risk indicator","Risk appetite evaluator"],
 w:["","A stakeholder is anyone affected by or interested in the risk; they aren't necessarily accountable for managing it.","A KRI is a metric, not a person or team.","Risk appetite is set by leadership for the whole organization; that isn't managing a single risk."],
 c:"assigned to MANAGE that specific risk"},
{id:"kri",d:5,o:"5.2",g:"rrole",t:"KRI (Key Risk Indicator)",
 f:"A metric that signals rising exposure to a risk, such as unpatched systems count, failed logins, or the percentage of staff who completed required training.",
 q:"A company expanding into a region with new regulations wants a metric that tracks its regulatory compliance risk over time. Which is the MOST useful key risk indicator?",
 a:["Percentage of employees who completed compliance training","Total revenue from the new region","Number of competitors in the region","Number of new customers acquired"],
 w:["","Revenue measures business performance, not compliance risk.","Competitor count is market data with no link to compliance exposure.","Customer growth doesn't show whether you're following the rules."],
 c:"metric that tracks the RISK, not the business"},
{id:"rreg",d:5,o:"5.2",g:"rrole",t:"Risk register",
 f:"A document that lists identified risks with their likelihood, impact, owner, current controls, and status. The central tracker for risk management.",
 q:"A risk manager needs one document that lists every identified risk, its likelihood and impact rating, the assigned owner, and the planned response. What is this document?",
 a:["Risk register","Business impact analysis","Risk appetite statement","Gap analysis"],
 w:["","A BIA measures how losing business functions affects the organization (RTO/RPO). It isn't a list of all risks.","A risk appetite statement declares how much risk leadership will accept overall.","A gap analysis compares current state to desired state; it isn't an ongoing risk list."],
 c:"one list of all risks + owners + ratings"},
{id:"rthr",d:5,o:"5.2",g:"rrole",t:"Risk threshold",
 f:"The specific level at which a risk becomes unacceptable and triggers action, such as 'any vulnerability with CVSS 9 or higher gets patched within 48 hours'.",
 q:"A policy states that any risk scored above 15 on the risk matrix must be escalated to the CISO immediately. What does the value 15 represent?",
 a:["Risk threshold","Risk appetite","Annualized rate of occurrence","Residual risk"],
 w:["","Risk appetite is the broad, organization-wide willingness to take risk. A specific trigger number is a threshold.","ARO is how often a loss event is expected per year.","Residual risk is what remains after controls are applied."],
 c:"specific trigger point for action"},
// ---------- 5.2 Appetite / tolerance ----------
{id:"rapp",d:5,o:"5.2",g:"appetite",t:"Risk appetite",
 f:"How much risk an organization is willing to pursue or accept overall to meet its goals. Set by leadership. CompTIA categories: expansionary, conservative, neutral.",
 q:"A board of directors states that the company is willing to accept moderate cybersecurity risk in exchange for launching products faster. What has the board defined?",
 a:["Risk appetite","Risk threshold","Risk tolerance","Risk register"],
 w:["","A threshold is a specific trigger level for action, not a broad organizational stance.","Tolerance is the acceptable variation around a specific risk or objective. A broad strategic stance is appetite.","A register is a list of identified risks."],
 c:"board-level overall willingness"},
{id:"rtol",d:5,o:"5.2",g:"appetite",t:"Risk tolerance",
 f:"The acceptable amount of deviation for a specific risk or objective, for example 'up to 4 hours of downtime per quarter'. Narrower and more measurable than appetite.",
 q:"The operations director says the order system can tolerate up to 2 hours of unplanned downtime per month before it's unacceptable. This statement BEST describes:",
 a:["Risk tolerance","Risk appetite","Risk transference","Risk avoidance"],
 w:["","Appetite is the broad organizational stance. A measurable limit on one specific risk is tolerance.","Transference shifts risk to another party, such as an insurer.","Avoidance means stopping the risky activity entirely."],
 c:"measurable limit on ONE specific risk"},
{id:"rappx",d:5,o:"5.2",g:"appetite",t:"Expansionary / Conservative / Neutral appetite",
 f:"Expansionary = willing to take more risk for growth. Conservative = prioritizes minimizing risk. Neutral = balances risk against reward.",
 q:"A startup's leadership decides to aggressively adopt new, unproven cloud technologies, accepting higher risk to gain market share quickly. Which risk appetite does this describe?",
 a:["Expansionary","Conservative","Neutral","Residual"],
 w:["","Conservative appetite minimizes risk. This is the opposite.","Neutral balances risk and reward evenly; 'aggressively accept higher risk' goes beyond that.","Residual is the risk left after controls, not an appetite type."],
 c:"aggressive / growth / accept more risk"},
// ---------- 5.2 Risk strategies ----------
{id:"rtrans",d:5,o:"5.2",g:"rstrat",t:"Risk transference",
 f:"Shifting the financial impact of a risk to another party, most commonly by buying cybersecurity insurance or outsourcing.",
 q:"A company buys cyber insurance to cover costs if it suffers a ransomware attack. Which risk management strategy is this?",
 a:["Transfer","Accept","Avoid","Mitigate"],
 w:["","Acceptance means taking no action and living with the risk.","Avoidance means stopping the risky activity altogether.","Mitigation reduces likelihood or impact with controls. Insurance shifts the cost instead."],
 c:"insurance / shift to a third party"},
{id:"raccept",d:5,o:"5.2",g:"rstrat",t:"Risk acceptance",
 f:"Deciding to live with a risk without extra controls, usually because the cost of mitigation exceeds the potential loss. Formalized through an exception or exemption.",
 q:"Patching a legacy kiosk would cost $80,000, but the worst-case loss from its vulnerability is estimated at $5,000. Management documents the decision and takes no further action. Which strategy is this?",
 a:["Accept","Transfer","Avoid","Mitigate"],
 w:["","Transfer shifts the cost to someone else, such as an insurer. Here nobody else takes it on.","Avoidance would mean removing the kiosk or stopping the activity.","Mitigation would mean applying controls. They chose none."],
 c:"cost of fixing > potential loss, do nothing"},
{id:"ravoid",d:5,o:"5.2",g:"rstrat",t:"Risk avoidance",
 f:"Eliminating a risk by stopping or never starting the activity that causes it.",
 q:"After a risk review, a company decides to stop storing customers' credit card numbers at all and stops offering the 'save my card' feature. Which strategy is this?",
 a:["Avoid","Mitigate","Transfer","Accept"],
 w:["","Mitigation would keep storing the cards but add controls such as encryption.","Transfer would shift the cost or responsibility, for example to a payment processor or insurer, while the activity continues.","Acceptance would continue storing cards with no extra action."],
 c:"stop doing the risky thing entirely"},
{id:"rmit",d:5,o:"5.2",g:"rstrat",t:"Risk mitigation",
 f:"Reducing a risk's likelihood or impact by applying controls, such as patching, MFA, encryption or segmentation.",
 q:"To reduce the chance of account takeovers, a company rolls out MFA for all remote logins. Which risk strategy is this?",
 a:["Mitigate","Avoid","Transfer","Accept"],
 w:["","Avoidance would mean disabling remote logins entirely.","Transfer would shift the cost to someone else, such as an insurer.","Acceptance would mean doing nothing."],
 c:"add a control to reduce it"},
{id:"rexc",d:5,o:"5.2",g:"rstrat",t:"Exception vs exemption (risk acceptance)",
 f:"Both are formal risk acceptance. Exception = permission to deviate from a policy in a specific case, often temporary and with compensating controls. Exemption = formal release from a requirement altogether.",
 q:"A lab machine can't run the mandatory EDR agent because it would break a scientific instrument. Security formally approves the deviation for 6 months, with the machine isolated on its own VLAN. What is this?",
 a:["A policy exception","Risk transference","Risk avoidance","A risk threshold"],
 w:["","Transference shifts the risk to another party. Nobody else takes it on here.","Avoidance would mean removing the machine or stopping the activity.","A threshold is a trigger level for action, not an approved deviation."],
 c:"approved deviation for a specific case, time-limited"},
// ---------- 5.2 Quantitative analysis ----------
{id:"sle",d:5,o:"5.2",g:"quant",t:"SLE (Single Loss Expectancy)",
 f:"The expected cost of ONE occurrence of a loss event. SLE = Asset Value × Exposure Factor.",
 q:"A server worth $50,000 would lose 40% of its value in a single flood. What is the SLE?",
 a:["$20,000","$50,000","$200,000","$12,500"],
 w:["","$50,000 is the full asset value. Exposure factor is only 40%.","$200,000 multiplies instead of using the percentage correctly.","$12,500 doesn't come from AV × EF ($50,000 × 0.4 = $20,000)."],
 c:"SLE = AV × EF"},
{id:"ale",d:5,o:"5.2",g:"quant",t:"ALE (Annualized Loss Expectancy)",
 f:"The expected loss per year from a risk. ALE = SLE × ARO. Used to justify how much to spend on a control each year.",
 q:"A laptop theft costs $3,000 each time (SLE) and is expected to happen 4 times per year (ARO). What is the ALE?",
 a:["$12,000","$750","$3,000","$7,000"],
 w:["","$750 divides SLE by ARO instead of multiplying.","$3,000 is only the SLE, for one event.","$7,000 adds instead of multiplying."],
 c:"ALE = SLE × ARO"},
{id:"aro",d:5,o:"5.2",g:"quant",t:"ARO (Annualized Rate of Occurrence)",
 f:"How many times per year a loss event is expected to occur. Once every 4 years = 0.25.",
 q:"A data center expects a major flood once every 20 years. What ARO should be used in the risk calculation?",
 a:["0.05","20","0.2","5"],
 w:["","20 is the number of years between events, not the yearly rate.","0.2 would mean once every 5 years.","5 would mean five floods per year."],
 c:"events per YEAR (1 ÷ years between)"},
{id:"ef",d:5,o:"5.2",g:"quant",t:"EF (Exposure Factor)",
 f:"The percentage of an asset's value lost in a single incident. 100% means total loss.",
 q:"In quantitative risk analysis, which value represents the percentage of an asset's value that would be lost in a single incident?",
 a:["Exposure factor","Annualized rate of occurrence","Single loss expectancy","Residual risk"],
 w:["","ARO is how many times per year the event happens.","SLE is a dollar amount (AV × EF), not a percentage.","Residual risk is what's left after controls are applied."],
 c:"percentage lost in one incident"},
{id:"qualq",d:5,o:"5.2",g:"quant",t:"Qualitative vs quantitative risk analysis",
 f:"Qualitative = ratings such as High/Medium/Low or a heat map, based on judgment. Quantitative = dollar figures and probabilities (SLE, ALE, ARO).",
 q:"A risk team rates each risk as High, Medium or Low for likelihood and impact, then plots them on a heat map. What type of risk analysis is this?",
 a:["Qualitative","Quantitative","Business impact analysis","Gap analysis"],
 w:["","Quantitative analysis uses actual numbers such as dollar values and ALE.","A BIA focuses on the impact of losing business functions (RTO/RPO).","Gap analysis compares current state against a target state."],
 c:"High/Med/Low, heat map"},
// ---------- 5.2 BIA ----------
{id:"rto",d:5,o:"5.2",g:"bia",t:"RTO (Recovery Time Objective)",
 f:"The maximum acceptable time to restore a system or function after an outage. 'How long can we be DOWN?'",
 q:"Management decides the payroll system must be back online within 4 hours of any outage. Which metric is this?",
 a:["RTO","RPO","MTBF","MTTR"],
 w:["","RPO is about how much DATA you can lose, measured back in time. This is about downtime.","MTBF measures average time between failures, which is reliability.","MTTR is the average time it actually takes to repair. RTO is the target set by the business."],
 c:"how long DOWN (time to restore)"},
{id:"rpo",d:5,o:"5.2",g:"bia",t:"RPO (Recovery Point Objective)",
 f:"The maximum acceptable amount of data loss, measured in time. An RPO of 1 hour means backups must run at least hourly. 'How much DATA can we lose?'",
 q:"A company says it can afford to lose no more than 15 minutes of transaction data. This drives how often backups or replication must run. Which metric is this?",
 a:["RPO","RTO","MTTR","ALE"],
 w:["","RTO is how quickly you must be back up, not how much data you can lose.","MTTR is the average time to repair a failed component.","ALE is the expected yearly financial loss from a risk."],
 c:"how much DATA lost / backup frequency"},
{id:"mttr",d:5,o:"5.2",g:"bia",t:"MTTR (Mean Time To Repair)",
 f:"The average time it takes to repair a failed component and get it working again.",
 q:"Over the past year, a firewall cluster failed 3 times, and each repair took on average 90 minutes. Which metric does 90 minutes represent?",
 a:["MTTR","MTBF","RPO","RTO"],
 w:["","MTBF is the average time between failures, not how long a repair takes.","RPO is acceptable data loss.","RTO is the target restore time set by the business. 90 minutes is the measured average repair time."],
 c:"measured average REPAIR time"},
{id:"mtbf",d:5,o:"5.2",g:"bia",t:"MTBF (Mean Time Between Failures)",
 f:"The average operating time between failures of a repairable component. Higher = more reliable.",
 q:"A hardware vendor advertises that its storage controller runs an average of 200,000 hours before failing. Which reliability metric is this?",
 a:["MTBF","MTTR","RTO","ARO"],
 w:["","MTTR is how long a repair takes.","RTO is a business recovery target.","ARO is how often a loss event happens per year in risk calculations."],
 c:"average time BETWEEN failures (reliability)"},
{id:"bia",d:5,o:"5.2",g:"bia",t:"BIA (Business Impact Analysis)",
 f:"Identifies critical business functions and measures how disruption would affect them. Produces RTO, RPO and recovery priorities.",
 q:"Before writing a disaster recovery plan, a company identifies which business functions are most critical and how long each can be down before serious harm. What is this process?",
 a:["Business impact analysis","Gap analysis","Tabletop exercise","Risk transference"],
 w:["","Gap analysis compares current security against a target state or framework.","A tabletop exercise is a discussion-based test of an existing plan.","Transference shifts risk to another party."],
 c:"critical functions + how long they can be down"}
);

// Domain 5 — part B: governance, data roles, compliance, audits, pen testing, awareness
DECK.push(
// ---------- 5.1 Governance documents ----------
{id:"policy",d:5,o:"5.1",g:"docs",t:"Policy",
 f:"A high-level, mandatory statement of management's intent and rules, such as the Information Security Policy or AUP. Says WHAT and WHY, not how.",
 q:"Senior management publishes a document stating that all company data must be protected according to its classification, and that violations may result in termination. What type of governance document is this?",
 a:["Policy","Standard","Procedure","Guideline"],
 w:["","A standard sets specific mandatory requirements, such as 'use AES-256'. This is broad intent.","A procedure gives step-by-step instructions.","A guideline is a recommendation and isn't mandatory."],
 c:"high-level intent from management"},
{id:"standard",d:5,o:"5.1",g:"docs",t:"Standard",
 f:"A specific, mandatory requirement that supports a policy, such as 'passwords must be 14+ characters' or 'all laptops use AES-256 full-disk encryption'.",
 q:"A document requires that all company laptops use AES-256 full-disk encryption and that all passwords be at least 14 characters. What type of document is this?",
 a:["Standard","Policy","Guideline","Procedure"],
 w:["","A policy is high-level intent. Specific measurable requirements belong in a standard.","Guidelines are optional recommendations. These are mandatory.","A procedure is step-by-step how-to instructions."],
 c:"specific + measurable + mandatory"},
{id:"procedure",d:5,o:"5.1",g:"docs",t:"Procedure / SOP",
 f:"Step-by-step instructions for performing a task consistently, such as onboarding, offboarding or change management.",
 q:"The help desk follows a numbered checklist when an employee leaves: disable the account, revoke badge access, collect the laptop, and transfer mailbox ownership. What type of document is this?",
 a:["Procedure","Policy","Standard","Guideline"],
 w:["","A policy states intent, not step-by-step actions.","A standard sets measurable requirements, not a sequence of steps.","A guideline is an optional recommendation."],
 c:"numbered step-by-step"},
{id:"guideline",d:5,o:"5.1",g:"docs",t:"Guideline",
 f:"A recommended, non-mandatory best practice that gives flexibility in how to meet a policy or standard.",
 q:"A document suggests that employees consider using a passphrase made of four random words, but doesn't require it. What type of document is this?",
 a:["Guideline","Standard","Policy","Procedure"],
 w:["","A standard is mandatory. This is only a suggestion.","A policy is mandatory high-level intent.","A procedure is a required set of steps."],
 c:"suggests / recommended / optional"},
{id:"aup",d:5,o:"5.1",g:"docs",t:"AUP (Acceptable Use Policy)",
 f:"Defines what users may and may not do with company systems, networks and data. Usually signed during onboarding.",
 q:"New hires must sign a document stating they won't use company laptops for personal crypto mining, torrenting, or accessing inappropriate sites. What is this document?",
 a:["Acceptable use policy","Non-disclosure agreement","Service level agreement","Data retention policy"],
 w:["","An NDA protects confidential information; it doesn't define allowed system use.","An SLA defines a provider's service performance.","A data retention policy defines how long data is kept."],
 c:"what users may/may not do on systems"},
{id:"playbook",d:4,o:"4.8",g:"docs",t:"Playbook",
 f:"A step-by-step response guide for a specific type of incident, such as a phishing playbook or ransomware playbook. It can be manual or automated (SOAR).",
 q:"The SOC wants every analyst to handle a reported phishing email the same way: quarantine the message, pull IOCs, block the sender, and reset affected credentials. What should the SOC create?",
 a:["A playbook","An acceptable use policy","A risk register","A business impact analysis"],
 w:["","An AUP defines user behavior rules, not incident response steps.","A risk register lists risks and owners.","A BIA measures the impact of losing business functions."],
 c:"step-by-step for ONE incident type"},
{id:"govstruct",d:5,o:"5.1",g:"gov",t:"Centralized vs decentralized governance",
 f:"Centralized = one central team sets and enforces security decisions for the whole org (consistent, but slower). Decentralized = business units make their own decisions (flexible, but inconsistent).",
 q:"A multinational lets each regional office choose its own security tools and write its own policies, with minimal oversight from headquarters. Which governance structure is this?",
 a:["Decentralized","Centralized","Committee-based","Federated identity"],
 w:["","Centralized means headquarters makes and enforces the decisions.","A committee is a group that makes decisions. Regions acting independently is decentralized.","Federated identity is an authentication concept (SSO across domains), not a governance structure."],
 c:"each region decides for itself"},
{id:"chgmgmt",d:1,o:"1.3",g:"gov",t:"Change management: backout plan",
 f:"A pre-planned way to roll back a change if it fails, approved as part of the change request along with impact analysis, test results and a maintenance window.",
 q:"A change advisory board refuses to approve a firewall upgrade until the engineer documents exactly how to restore the old configuration if the upgrade breaks production. What is the board asking for?",
 a:["A backout plan","An impact analysis","A maintenance window","An SOP"],
 w:["","Impact analysis predicts what the change will affect; it isn't the rollback method.","A maintenance window is the approved time slot for the change.","An SOP is a general step-by-step procedure, not a change-specific rollback."],
 c:"restore if it breaks = roll back"},
// ---------- 5.1 Data roles ----------
{id:"downer",d:5,o:"5.1",g:"droles",t:"Data owner",
 f:"A senior person accountable for a data set: decides its classification and who should have access. Usually a business executive, not IT.",
 q:"The VP of Human Resources decides that employee salary data is classified 'Confidential' and approves who may access it. Which data role is the VP fulfilling?",
 a:["Data owner","Data custodian","Data processor","Data steward"],
 w:["","A custodian handles day-to-day technical care (backups, storage, applying controls) but doesn't decide classification.","A processor handles data on behalf of a controller, typically a third party.","A steward focuses on data quality, labeling and metadata."],
 c:"decides classification + access (accountable)"},
{id:"dcust",d:5,o:"5.1",g:"droles",t:"Data custodian",
 f:"Handles the day-to-day technical care of data as directed by the owner: storage, backups, access control implementation, patching.",
 q:"A database administrator runs nightly backups, applies the access permissions the data owner approved, and keeps the database server patched. Which data role is this?",
 a:["Data custodian","Data owner","Data controller","Data subject"],
 w:["","The owner decides classification and who gets access; the DBA just implements it.","The controller decides why and how personal data is processed (a privacy-law role).","The data subject is the person the data is about."],
 c:"hands-on care: backups, storage, applies controls"},
{id:"dsteward",d:5,o:"5.1",g:"droles",t:"Data steward",
 f:"Focuses on data quality: accuracy, labeling, metadata and making sure data is used in line with policy.",
 q:"An analyst is responsible for making sure customer records are accurate, consistently labeled, and tagged with correct metadata. Which role is this?",
 a:["Data steward","Data custodian","Data owner","Data processor"],
 w:["","A custodian handles technical storage and backups, not data quality.","The owner is the accountable executive who sets classification.","A processor handles personal data on behalf of a controller."],
 c:"quality, labeling, metadata"},
{id:"dctrl",d:5,o:"5.4",g:"droles",t:"Data controller vs processor",
 f:"Controller = decides WHY and HOW personal data is processed, and is legally accountable (GDPR). Processor = processes the data on the controller's behalf, following its instructions.",
 q:"An online store collects customer data and decides how it's used. It hires a third-party email service to send marketing emails using that data, following the store's instructions. What role does the email service play?",
 a:["Data processor","Data controller","Data owner","Data subject"],
 w:["","The store is the controller because it decides why and how the data is used.","Data owner is an internal accountability role, not the outside service acting on instructions.","The data subjects are the customers the data is about."],
 c:"acts on someone else's instructions"},
{id:"dsubj",d:5,o:"5.4",g:"droles",t:"Data subject",
 f:"The individual that personal data is about. Under privacy laws like GDPR, data subjects have rights such as access, correction and erasure.",
 q:"Under GDPR, what term describes the individual whose personal information is being collected and processed?",
 a:["Data subject","Data owner","Data custodian","Data processor"],
 w:["","The data owner is an internal accountable executive.","The custodian handles technical storage.","The processor handles data for a controller."],
 c:"the person the data is ABOUT"},
// ---------- 5.4 Compliance & privacy ----------
{id:"rtbf",d:5,o:"5.4",g:"privacy",t:"Right to be forgotten",
 f:"A GDPR right that lets individuals request that an organization erase their personal data (with some exceptions).",
 q:"A former customer in the EU emails a company demanding that all of their personal data be permanently deleted from its systems. Which privacy right are they exercising?",
 a:["Right to be forgotten","Data sovereignty","Data retention","Attestation"],
 w:["","Data sovereignty is about which country's laws apply based on where data is located.","Data retention defines how long data must be kept, which is the opposite direction.","Attestation is a formal declaration that requirements are met."],
 c:"individual demands deletion"},
{id:"dsov",d:5,o:"5.4",g:"privacy",t:"Data sovereignty",
 f:"Data is subject to the laws of the country or jurisdiction where it's collected or stored. A jurisdiction can restrict processing or storing its data on systems outside its borders.",
 q:"Which statement is a correct interpretation of data sovereignty?",
 a:["A jurisdiction can restrict processing or storage of its data on systems outside that jurisdiction.","Data can move freely across borders without restriction.","A data center's physical location has no effect on which laws apply.","Data is always owned by its creator regardless of where it's stored."],
 w:["","Freely moving data across borders is exactly what sovereignty laws restrict.","Physical location is the whole point: it decides which laws apply.","This describes ownership, not which jurisdiction's laws govern the data."],
 c:"jurisdiction / location decides the laws"},
{id:"dret",d:5,o:"5.4",g:"privacy",t:"Data retention",
 f:"Policies defining how long data is kept and preserved, based on legal, regulatory and operational requirements. Supports compliance and limits breach exposure by not keeping data longer than needed.",
 q:"A company keeps financial records for exactly 7 years because regulations require it, then securely deletes them. Which concept does this policy implement?",
 a:["Data retention","Data sovereignty","Right to be forgotten","Data masking"],
 w:["","Sovereignty is about which jurisdiction's laws apply based on location.","Right to be forgotten is a person requesting deletion. This is a fixed retention schedule.","Masking hides part of data for display, such as ***-**-1234."],
 c:"how LONG to keep it (legal/regulatory)"},
{id:"dinv",d:5,o:"5.4",g:"privacy",t:"Data inventory",
 f:"A catalog of what data an organization holds, where it's stored, who owns it, and how sensitive it is. You can't protect or retain data you don't know you have.",
 q:"To prepare for a privacy audit, a company builds a catalog listing every database that holds personal data, where it's stored, its owner and its classification. What is this?",
 a:["Data inventory","Risk register","Data retention policy","Asset disposal record"],
 w:["","A risk register lists risks, not data locations and owners.","A retention policy defines how long data is kept; it doesn't catalog where the data is.","A disposal record documents destroyed assets."],
 c:"catalog of what data / where / owner"},
{id:"compcons",d:5,o:"5.4",g:"comp",t:"Consequences of non-compliance",
 f:"Fines, sanctions, reputational damage, loss of license, and contractual impacts (such as losing customers or partners).",
 q:"A hospital's audit shows it repeatedly failed HIPAA requirements. Besides fines, which is another recognized consequence of non-compliance?",
 a:["Loss of license","Increased MTBF","Lower ARO","Improved risk appetite"],
 w:["","MTBF is a hardware reliability metric that compliance doesn't change.","ARO is a risk calculation input, not a consequence.","Risk appetite is a leadership choice, not a penalty."],
 c:"fines, sanctions, reputation, license, contracts"},
{id:"license",d:5,o:"5.4",g:"comp",t:"Software licensing compliance",
 f:"Following the vendor's usage terms (number of seats, users, installs). Exceeding them is a compliance and licensing violation that can lead to fines or losing usage rights.",
 q:"A company buys a commercial scanning tool licensed for 4 developers. An audit finds 5 developers using it. What has the company violated?",
 a:["Licensing compliance","Regulatory framework","Vendor diversity","Data sovereignty"],
 w:["","No law or regulator is involved. This is the vendor's license terms.","Vendor diversity is about avoiding reliance on one vendor.","Data sovereignty concerns which country's laws apply to data."],
 c:"more users than the license allows"},
{id:"duecare",d:5,o:"5.4",g:"comp",t:"Due care vs due diligence",
 f:"Due care = doing what a reasonable organization should do to protect assets (implementing controls); it tends to describe INTERNAL activities. Due diligence = investigating and verifying, and is often tied to THIRD PARTIES (vendors, partners).",
 q:"A company implements encryption, access controls and security training because a reasonable organization in its position would be expected to. Which concept does this BEST demonstrate?",
 a:["Due care","Due diligence","Attestation","Risk transference"],
 w:["","Due diligence is the investigating and verifying. Actually putting reasonable protections in place is due care.","Attestation is a formal statement that requirements are met.","Transference shifts risk to another party."],
 c:"doing what a reasonable org SHOULD do"},
{id:"attest",d:5,o:"5.4",g:"comp",t:"Attestation and acknowledgement",
 f:"Attestation = a formal statement that something is true or compliant (such as an auditor's report or management's sign-off). Acknowledgement = users confirming they've read and agree to a policy.",
 q:"Each year, every employee must click a box confirming they've read and understood the updated information security policy. This is an example of:",
 a:["Acknowledgement","Exemption","Data retention","Risk tolerance"],
 w:["","An exemption is a formal release from a requirement.","Data retention is about how long data is kept.","Risk tolerance is an acceptable level of deviation for a risk."],
 c:"user confirms they read and agree"},
// ---------- 5.5 Audits & assessments ----------
{id:"intaudit",d:5,o:"5.5",g:"audit",t:"Internal audit",
 f:"An audit performed by the organization's own audit staff, often reporting to an audit committee, to check compliance and control effectiveness.",
 q:"A company's own audit department, which reports to the board's audit committee, reviews whether IT is following the access control policy. What type of assessment is this?",
 a:["Internal audit","External audit","Regulatory examination","Penetration test"],
 w:["","External audits are done by an independent outside firm.","A regulatory examination is performed by a government regulator.","A pen test actively attacks systems; it isn't a policy compliance review."],
 c:"own staff + audit committee"},
{id:"extaudit",d:5,o:"5.5",g:"audit",t:"External / independent third-party audit",
 f:"An audit performed by an independent outside firm, such as a SOC 2 audit. Provides an objective opinion that customers and regulators trust more than self-reporting.",
 q:"A SaaS vendor's customers demand objective proof of its security controls, so the vendor hires an outside CPA firm to perform a SOC 2 audit. What type of assessment is this?",
 a:["Independent third-party audit","Self-assessment","Internal audit","Vendor questionnaire"],
 w:["","A self-assessment is done by the organization itself. Customers wanted objective proof.","An internal audit uses the company's own staff, not an outside firm.","A questionnaire is self-reported. It's the opposite of independent."],
 c:"outside firm = objective"},
{id:"regexam",d:5,o:"5.5",g:"audit",t:"Regulatory examination",
 f:"An assessment performed by a government regulator to verify an organization complies with the law, such as bank examiners reviewing a bank.",
 q:"Federal banking examiners arrive at a bank to verify it complies with financial regulations. What type of assessment is this?",
 a:["Regulatory examination","Internal audit","Self-assessment","Independent third-party audit"],
 w:["","An internal audit is done by the bank's own staff.","A self-assessment is the bank evaluating itself.","A third-party audit is a private firm hired by the organization. These examiners are a government regulator."],
 c:"government regulator"},
{id:"selfassess",d:5,o:"5.5",g:"audit",t:"Self-assessment",
 f:"The organization evaluates its own controls against a framework or checklist. Cheap and fast, but less objective.",
 q:"A small company uses the CIS Controls checklist to grade its own security posture before deciding where to invest. What type of assessment is this?",
 a:["Self-assessment","External audit","Regulatory examination","Penetration test"],
 w:["","An external audit is performed by an independent outside firm.","A regulatory exam is performed by a government regulator.","A pen test actively attacks systems instead of grading them against a checklist."],
 c:"grade ourselves vs a checklist"},
{id:"gap",d:5,o:"5.5",g:"audit",t:"Gap analysis",
 f:"Comparing the current security state against a desired state (a framework, regulatory requirements, or security objectives) to find what's missing.",
 q:"A company compares its current controls against NIST CSF, its regulatory obligations, and its own security objectives to identify what's missing. What is this process?",
 a:["Gap analysis","Business impact analysis","Risk transference","Root cause analysis"],
 w:["","A BIA measures the impact of losing business functions.","Transference shifts risk to another party.","Root cause analysis finds why a specific incident happened."],
 c:"current vs desired = what's missing"},
// ---------- 5.5 Pen testing ----------
{id:"ptenv",d:5,o:"5.5",g:"pentest",t:"Known / partially known / unknown environment",
 f:"Known (white box) = full details given to the tester. Partially known (gray box) = some info. Unknown (black box) = no info, like a real outside attacker.",
 q:"A pen tester is given only the company's name and must discover everything else on their own, simulating an outside attacker. What type of test is this?",
 a:["Unknown environment","Known environment","Partially known environment","Integrated test"],
 w:["","A known environment test gives full details such as network diagrams and credentials.","Partially known gives some information, such as a list of IP ranges or a user account.","Integrated describes red and blue teams working together, not how much information is given."],
 c:"only the name / no info"},
{id:"ptrecon",d:5,o:"5.5",g:"pentest",t:"Passive vs active reconnaissance",
 f:"Passive = gathering info without touching the target (OSINT, WHOIS, social media). Active = directly interacting with the target (port scans, banner grabbing), which can be detected.",
 q:"A pen tester runs Nmap port scans against the client's public IP range to find open services. What type of reconnaissance is this?",
 a:["Active reconnaissance","Passive reconnaissance","OSINT","Social engineering"],
 w:["","Passive recon never touches the target. A port scan sends packets straight to it.","OSINT uses public sources and is a form of passive recon.","Social engineering manipulates people, not scans."],
 c:"directly touches the target (scan)"},
{id:"ptteams",d:5,o:"5.5",g:"pentest",t:"Offensive / defensive / integrated testing",
 f:"Offensive = red team attacks. Defensive = blue team detects and responds. Integrated = purple team: red and blue work together and share findings in real time.",
 q:"During an exercise, the attacking team and the defending SOC sit together, sharing each technique as it's used so detections can be tuned immediately. What type of penetration testing is this?",
 a:["Integrated","Offensive","Defensive","Physical"],
 w:["","Offensive testing is attack-only (red team) with no live collaboration.","Defensive is the blue team side on its own.","Physical testing targets locks, badges and buildings."],
 c:"attackers + defenders together"},
{id:"ptphys",d:5,o:"5.5",g:"pentest",t:"Physical penetration testing",
 f:"Testing physical security controls: tailgating, badge cloning, lock picking, and getting into restricted areas.",
 q:"A tester is hired to see whether they can tailgate into the data center, clone an employee badge, and plug a device into a network jack. What kind of test is this?",
 a:["Physical penetration test","Unknown environment web test","Vulnerability scan","Tabletop exercise"],
 w:["","How much information the tester gets doesn't make it physical. The target here is the building and badges.","A vulnerability scan is an automated, non-intrusive check of systems.","A tabletop is a discussion exercise for incident response."],
 c:"buildings, badges, doors"},
// ---------- 5.6 Awareness ----------
{id:"phishcamp",d:5,o:"5.6",g:"aware",t:"Phishing campaigns (simulations)",
 f:"Controlled fake phishing emails sent to employees to measure who clicks or reports, followed by targeted training. Part of security awareness programs.",
 q:"Security sends employees realistic fake emails, tracks who clicks the link versus who reports it, and assigns extra training to repeat clickers. What is this?",
 a:["A phishing campaign","A watering hole attack","A tabletop exercise","Business email compromise"],
 w:["","A watering hole is a real attack that compromises a site the targets visit.","A tabletop is a discussion-based incident response exercise.","BEC is a real fraud attack using a compromised or spoofed business email."],
 c:"simulated phish + measure + train"},
{id:"anomaly",d:5,o:"5.6",g:"aware",t:"Anomalous behavior: risky / unexpected / unintentional",
 f:"Risky = knowingly unsafe actions (disabling AV). Unexpected = unusual activity (logins at 3am, odd data access). Unintentional = honest mistakes (emailing the wrong person).",
 q:"An employee accidentally emails a spreadsheet of customer data to the wrong external address because of autocomplete. Which type of anomalous behavior is this?",
 a:["Unintentional","Risky","Unexpected","Malicious insider"],
 w:["","Risky behavior is a knowingly unsafe choice. This was an accident.","Unexpected means out-of-pattern activity, like odd hours or access. This was a simple mistake.","There's no malicious intent here."],
 c:"accident / honest mistake"},
{id:"opsec",d:5,o:"5.6",g:"aware",t:"Operational security (OPSEC) awareness",
 f:"Training users not to leak useful information through everyday actions, such as posting badge photos online, discussing projects in public, or oversharing on social media.",
 q:"Training warns employees not to post photos of their ID badges, whiteboards, or desk setups on social media. Which awareness topic is this?",
 a:["Operational security","Password management","Removable media policy","Hybrid work guidance"],
 w:["","Password training covers creating and storing credentials.","Removable media covers USB drives and cables.","Hybrid work covers secure home networks and public Wi-Fi."],
 c:"don't leak info through everyday sharing"},
{id:"insider",d:5,o:"5.6",g:"aware",t:"Insider threat awareness",
 f:"Teaching staff to recognize and report signs that a trusted person may misuse access: unusual data hoarding, access outside their role, or disgruntlement combined with odd activity.",
 q:"Training teaches employees to report coworkers who suddenly download large amounts of data unrelated to their job or try to access systems outside their role. What is this training focused on?",
 a:["Insider threats","Phishing recognition","Physical security","Shadow IT"],
 w:["","Phishing comes from outside, through email or messages.","Physical security is about facilities and badges.","Shadow IT is unapproved technology use, not misuse of legitimate access."],
 c:"trusted person misusing access"}
);

// Pretest misses + confusion pairs from Domains 1–4
DECK.push(
// ---------- 4.8 IR exercises (missed on BOTH attempts) ----------
{id:"tabletop",d:4,o:"4.8",g:"irex",t:"Tabletop exercise",
 f:"Key people sit together and DISCUSS what they would do in a hypothetical incident scenario. Lowest effort and cost, with no systems touched.",
 q:"The IR team gathers in a conference room. A facilitator describes a ransomware scenario step by step, and each person explains what their department would do. No systems are touched. Which exercise is this?",
 a:["Tabletop exercise","Walkthrough","Simulation","Parallel processing test"],
 w:["","A walkthrough goes a step further: participants demonstrate the actual actions, such as running scans in a sandbox.","A simulation stages a realistic incident and requires heavy investment and preparation.","Parallel processing is a resilience technique (splitting work across processors or systems), not a discussion-based exercise."],
 c:"talk only, conference room"},
{id:"walkthrough",d:4,o:"4.8",g:"irex",t:"Walkthrough",
 f:"More than a tabletop, less than a simulation. Participants step through the plan and DEMONSTRATE the actions they'd take (such as scans in a sandbox). Realistic without big investment. Heads-up: this came from your WGU pretest. The official SY0-701 objectives only list tabletop exercises and simulations.",
 q:"After updating its IR plan, a company wants a realistic test where staff actually demonstrate their response steps, including running tools in a sandbox, but without extensive investment and planning. Which exercise is BEST?",
 a:["Walkthrough","Tabletop exercise","Simulation","Security awareness training"],
 w:["","A tabletop is discussion only, so nobody demonstrates actions.","A simulation is the most realistic but requires extensive investment and preparation, which they want to avoid.","Training teaches skills; it doesn't test the IR plan."],
 c:"realistic + demonstrate + NOT extensive investment"},
{id:"simulation",d:4,o:"4.8",g:"irex",t:"Simulation",
 f:"A staged, realistic incident (often by an outside team in a sandbox) to test how staff actually respond. Most realistic, but requires extensive investment and preparation.",
 q:"A company worried about complacency hires an outside firm to stage a strong attack in a sandbox environment to see how the IT department actually responds. Which exercise is this?",
 a:["Simulation","Walkthrough","Tabletop exercise","Communication plan"],
 w:["","A walkthrough has staff step through and demonstrate the plan. It isn't a staged attack run by an outside team.","A tabletop is discussion only.","A communication plan is part of the IR plan, not an exercise."],
 c:"outside team stages a real attack"},
{id:"irplan",d:4,o:"4.8",g:"irplan",t:"IR plan key components",
 f:"Roles and the CIRT, the communication plan (internal, external, who may speak publicly), stakeholder management, and escalation and contact lists. It must be reviewed and tested regularly so contacts stay current.",
 q:"During an incident, a company finds its IR plan lists contacts who no longer work there and is missing who may talk to the press. Which IR plan component needs the MOST work?",
 a:["Communication plan","Lessons learned","Eradication","Containment"],
 w:["","Lessons learned is a phase after an incident, not where contacts and press rules live.","Eradication removes the threat; it isn't a contact list.","Containment limits the spread of an incident."],
 c:"contacts + who talks to press"},
{id:"irorder",d:4,o:"4.8",g:"irplan",t:"IR process order (CompTIA 701)",
 f:"Preparation → Detection → Analysis → Containment → Eradication → Recovery → Lessons learned.",
 q:"An analyst has confirmed malware on a server and isolated it from the network. According to the CompTIA IR process, what is the NEXT phase?",
 a:["Eradication","Recovery","Lessons learned","Detection"],
 w:["","Recovery comes after the threat is removed. You can't restore a box that's still infected.","Lessons learned is the final phase.","Detection already happened."],
 c:"isolated = contained → next remove it"},
// ---------- 1.1 Control types ----------
{id:"cdirective",d:1,o:"1.1",g:"ctype",t:"Directive control",
 f:"Enforces a rule of behavior by telling people what to do: policies, standards, SOPs, and posted signs saying 'authorized personnel only'.",
 q:"After noticing most tickets are for new computer setups, an IT manager writes a new standard operating procedure for them. What control function does the SOP serve?",
 a:["Directive","Compensating","Corrective","Deterrent"],
 w:["","A compensating control substitutes for a primary control that can't be used. Nothing is being replaced here.","Corrective controls fix things after an incident, such as restoring from backup.","Deterrent controls discourage attackers, such as warning banners or visible cameras."],
 c:"SOP / policy = tells people what to do"},
{id:"ccomp",d:1,o:"1.1",g:"ctype",t:"Compensating control",
 f:"A substitute that gives comparable protection when the primary control can't be implemented. Example: no MFA possible, so enforce strict password rules plus monitoring. Note: modern guidance discourages very frequent forced rotation for everyday use (see the password-age card), but as a stand-in for missing MFA, strict complexity and rotation is still the exam answer.",
 q:"A company can't deploy MFA because of how its operations work. Which option is a compensating control for this gap?",
 a:["A strict password complexity and rotation policy","A firewall at key network points","Regular risk assessments","A network IDS"],
 w:["","A firewall protects network boundaries but doesn't stand in for an authentication control.","Risk assessments identify risk; they don't provide protection in place of MFA.","A NIDS detects network attacks; it doesn't strengthen authentication."],
 c:"substitute for a control you CAN'T use"},
{id:"ccorr",d:1,o:"1.1",g:"ctype",t:"Corrective control",
 f:"Reduces impact or restores things after an incident: restoring from backup, reimaging a host, patching after exploitation.",
 q:"After ransomware encrypts a file server, the team restores the data from last night's backups. What type of control are the backups acting as?",
 a:["Corrective","Detective","Deterrent","Directive"],
 w:["","Detective controls find or alert on incidents (IDS, logs); they don't restore anything.","Deterrent controls discourage attempts before they happen.","Directive controls tell people what to do."],
 c:"fix / restore AFTER"},
{id:"cdeter",d:1,o:"1.1",g:"ctype",t:"Deterrent control",
 f:"Discourages an attacker from trying at all, through visible consequences: warning banners, visible cameras, signs, and lighting.",
 q:"A login banner warns that unauthorized access will be prosecuted. What type of control is this?",
 a:["Deterrent","Preventive","Detective","Corrective"],
 w:["","A preventive control physically or technically stops the action (like a lock). A banner only discourages.","Detective controls identify an incident in progress or after it.","Corrective controls fix things after an incident."],
 c:"discourage / warn"},
{id:"cdetect",d:1,o:"1.1",g:"ctype",t:"Detective vs preventive control",
 f:"Detective = identifies and records an incident (IDS, logs, cameras that are reviewed). Preventive = stops it from happening (firewall rules, locks, IPS).",
 q:"A SIEM alert notifies analysts when an account fails to log in 50 times in a minute. What control type is the alert?",
 a:["Detective","Preventive","Corrective","Compensating"],
 w:["","Preventive would block the attempts, like an account lockout. The alert only identifies them.","Corrective would fix damage afterward.","Compensating substitutes for a control that can't be used."],
 c:"alerts / identifies"},
{id:"ccat",d:1,o:"1.1",g:"ccat",t:"Control categories",
 f:"Technical = enforced by systems (firewalls, encryption). Managerial = oversight and planning (risk assessments, policies). Operational = done by people (guards, training). Physical = tangible barriers (fences, locks).",
 q:"Security guards checking badges and staff completing annual security awareness training are examples of which control category?",
 a:["Operational","Technical","Managerial","Physical"],
 w:["","Technical controls are enforced by technology, not people.","Managerial controls are planning and oversight, like risk assessments.","Physical controls are barriers such as fences and locks. Guards' actions and training are carried out by people, so they're operational."],
 c:"carried out by PEOPLE"},
// ---------- 3.1 Architecture models ----------
{id:"hybrid",d:3,o:"3.1",g:"cloud",t:"Hybrid cloud",
 f:"A mix of private and public cloud (or on-prem plus public). Keep sensitive data private and put the rest in public cloud for flexibility.",
 q:"A company wants to keep sensitive data on private cloud infrastructure while storing non-sensitive data on a public cloud. Which model provides this?",
 a:["Hybrid","Serverless","Single-tenant","Multi-tenant"],
 w:["","Serverless means the provider runs your code with no servers to manage. It says nothing about private and public data placement.","Single-tenant means dedicated infrastructure for one customer, with no public cloud mix.","Multi-tenant means many customers share infrastructure; that's a public cloud trait, not a mix."],
 c:"private + public together"},
{id:"tenancy",d:3,o:"3.1",g:"cloud",t:"Multi-tenant vs single-tenant",
 f:"Multi-tenant = many customers share the same infrastructure (cheaper, with isolation risk). Single-tenant = dedicated infrastructure for one customer (more control, higher cost).",
 q:"A healthcare company is concerned that a flaw in a cloud provider's isolation could expose its data to other customers on the same hardware. Which architecture addresses this concern?",
 a:["Single-tenant","Multi-tenant","Serverless","Hybrid"],
 w:["","Multi-tenant is the shared model that creates this exact concern.","Serverless still runs on shared provider infrastructure.","Hybrid mixes private and public, but the public portion is still shared."],
 c:"don't want to share hardware with others"},
{id:"serverless",d:3,o:"3.1",g:"cloud",t:"Serverless",
 f:"The cloud provider runs your code (functions) on demand and manages all servers. You pay per execution and patch no OS.",
 q:"A developer wants to run small functions triggered by file uploads without provisioning, patching or managing any servers. Which model fits?",
 a:["Serverless","Virtualization","Single-tenant","On-premises"],
 w:["","With VMs you still manage guest operating systems.","Single-tenant is about dedicated hardware, not removing server management.","On-prem means you manage everything yourself."],
 c:"no servers to manage, run functions"},
{id:"container",d:3,o:"3.1",g:"virt",t:"Containerization",
 f:"Packages an app with its dependencies into a lightweight, isolated container that shares the host OS kernel. Reproducible across environments, efficient on resources.",
 q:"A company wants to isolate its dev, test and production environments, make each one reproducible, and manage dependencies consistently, with low overhead. Which approach is BEST?",
 a:["Containerization","Virtualization","Microservices","SDN"],
 w:["","VMs isolate well but each carries a full guest OS, which means more overhead. Containers are the lightweight, reproducible option.","Microservices is an app design pattern (small services), not the isolation and packaging method itself.","SDN manages network traffic in software; it doesn't package applications."],
 c:"app + dependencies + reproducible + low overhead"},
{id:"virtualization",d:3,o:"3.1",g:"virt",t:"Virtualization",
 f:"A hypervisor runs multiple virtual machines, each with its own full guest OS, on one physical host. Strong isolation, but heavier than containers.",
 q:"A company needs to run a Windows Server and a Linux server, each with its own separate operating system kernel, on one physical machine. Which technology is required?",
 a:["Virtualization","Containerization","Serverless","Microservices"],
 w:["","Containers share the host's kernel, so they can't run a separate kernel per workload.","Serverless runs functions; you don't control the OS at all.","Microservices is a design approach, not a way to run separate operating systems."],
 c:"separate OS kernel each = VM"},
{id:"microsvc",d:3,o:"3.1",g:"virt",t:"Microservices",
 f:"An architecture that breaks an app into small, independent services that communicate over APIs. Each can be updated and scaled separately.",
 q:"A company redesigns its monolithic e-commerce app so that cart, payment and search each run as small, independently deployable services that talk over APIs. Which architecture is this?",
 a:["Microservices","Virtualization","Hybrid cloud","ICS"],
 w:["","Virtualization runs VMs; it doesn't describe how the app itself is split up.","Hybrid cloud is a private plus public deployment model.","ICS is industrial control systems."],
 c:"split one app into small services via APIs"},
{id:"iot",d:3,o:"3.1",g:"embedded",t:"IoT (Internet of Things)",
 f:"Network-connected everyday devices and sensors (smart thermostats, cameras, building sensors) used for monitoring and automation. Often weakly secured.",
