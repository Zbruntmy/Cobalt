 w:["","Typosquatting uses a look-alike domain. This is the real site, compromised.","Spear phishing sends targeted messages; here the victims come to the site.","Brand impersonation fakes a company's identity; the sandwich shop's site is real."],
 c:"infect the site THEY already visit"},
{id:"brandimp",d:2,o:"2.2",g:"vector",t:"Brand impersonation",
 f:"Pretending to be a well-known company, using its logos, colors and style in emails, websites or ads, to trick people into trusting a scam.",
 q:"Customers receive emails with a major bank's exact logo, colors and footer, urging them to 'confirm account details' on a copycat site. Which technique is MOST central here?",
 a:["Brand impersonation","Watering hole","Business email compromise","Shadow IT"],
 w:["","A watering hole compromises a real site the victims visit.","BEC uses a compromised or spoofed business account to target that company's staff or partners, usually for payments.","Shadow IT is unapproved technology use by employees."],
 c:"copy a known company's look"},
{id:"disinfo",d:2,o:"2.2",g:"vector",t:"Misinformation vs disinformation",
 f:"Misinformation = false information spread without intent to deceive (an honest mistake). Disinformation = false information spread deliberately to mislead.",
 q:"A coordinated group creates fake social media accounts to deliberately spread false claims that a company's product leaks customer data. What is this?",
 a:["Disinformation","Misinformation","Typosquatting","Pretexting"],
 w:["","Misinformation is spread without intent to deceive. This was deliberate and coordinated.","Typosquatting is look-alike domain names.","Pretexting is a made-up story aimed at an individual to get information from them."],
 c:"DELIBERATE false info = DISinformation"},
{id:"usbdrop",d:2,o:"2.2",g:"vector",t:"Removable media (USB drop)",
 f:"Attackers leave infected USB drives where employees will find them and plug them in, or use malicious cables. Mitigate by disabling USB storage and training users.",
 q:"Several USB drives labeled 'Q4 Layoffs' are found in a company parking lot. One employee plugged one in, and malware ran. Which threat vector was used?",
 a:["Removable device","Message-based","Watering hole","Open service port"],
 w:["","Nothing came by email, SMS or chat.","No website was involved.","No network service was exploited; the user plugged the device in."],
 c:"curiosity + plug it in"},
{id:"defcreds",d:2,o:"2.2",g:"vector",t:"Default credentials",
 f:"Devices often ship with known usernames and passwords (admin/admin). If they aren't changed, anyone can log in. Common in IoT, routers and cameras.",
 q:"An attacker logs in to a company's security cameras using 'admin' and 'admin', taken from the manufacturer's public manual. Which attack surface was exploited?",
 a:["Default credentials","Zero-day vulnerability","Race condition","Watering hole"],
 w:["","A zero-day is an unknown flaw. This password is published in the manual.","A race condition is a timing flaw in code.","A watering hole infects a website that targets visit."],
 c:"admin/admin never changed"},
{id:"msp",d:2,o:"2.2",g:"vector",t:"Supply chain: MSPs and vendors",
 f:"Attacking a trusted provider (MSP, software vendor, hardware supplier) to reach its many customers through that trusted access or software.",
 q:"Attackers breach a managed service provider and use its remote management tool to deploy ransomware to dozens of the MSP's clients at once. Which attack vector is this?",
 a:["Supply chain","Watering hole","Typosquatting","Default credentials"],
 w:["","A watering hole compromises a website that targets visit.","Typosquatting uses look-alike domains.","Nothing indicates factory-default passwords were used."],
 c:"breach the trusted provider → reach its customers"},
// ---------- 2.3 Vulnerability types ----------
{id:"bof",d:2,o:"2.3",g:"vtype",t:"Buffer overflow",
 f:"A program writes more data into a memory buffer than it can hold, overwriting adjacent memory. Attackers use it to crash the app or run their own code. Mitigations: bounds checking, ASLR, DEP.",
 q:"An attacker sends a 5,000-character username to a login service that expects 32 characters. The extra data overwrites memory and the attacker's code executes. What vulnerability is this?",
 a:["Buffer overflow","SQL injection","Cross-site scripting","Race condition"],
 w:["","SQL injection sends database commands through input; it doesn't overwrite memory.","XSS injects script into web pages viewed by other users.","A race condition depends on timing between two operations."],
 c:"too much data → overwrites MEMORY"},
{id:"meminj",d:2,o:"2.3",g:"vtype",t:"Memory injection",
 f:"Malicious code is injected into the memory space of a legitimate running process (such as DLL injection), so it runs under that process's identity and is harder to detect. Often fileless.",
 q:"EDR shows malicious code running inside the memory of a legitimate explorer.exe process, with no malware file ever written to disk. Which vulnerability type is this?",
 a:["Memory injection","Buffer overflow","Directory traversal","Misconfiguration"],
 w:["","A buffer overflow overruns a buffer with too much input. The clue here is code hiding inside another legitimate process.","Directory traversal reads files outside the intended folder.","Nothing points to a bad setting."],
 c:"hides inside a LEGIT process's memory"},
{id:"race",d:2,o:"2.3",g:"vtype",t:"Race condition (TOC/TOU)",
 f:"The result depends on the timing of events. Time-of-check to time-of-use (TOCTOU): something changes between when it's checked and when it's used.",
 q:"An app checks that a user has enough balance, then deducts the money a moment later. An attacker sends two withdrawals at the same instant, and both pass the check before either deducts. What vulnerability is this?",
 a:["Race condition","Buffer overflow","Replay attack","Privilege escalation"],
 w:["","Nothing overflows memory here.","A replay resends captured traffic later. These are two simultaneous new requests exploiting timing.","The attacker never gains higher permissions."],
 c:"timing gap between check and use"},
{id:"malupdate",d:2,o:"2.3",g:"vtype",t:"Malicious update",
 f:"An attacker compromises a vendor's update process, so a legitimate, often signed, software update delivers malware to every customer who installs it.",
 q:"Thousands of companies install a routine update for their network monitoring software, signed by the real vendor. It turns out attackers had inserted a backdoor into the vendor's build system. What vulnerability is this?",
 a:["Malicious update","Typosquatting","Zero-day in the operating system","Default credentials"],
 w:["","Typosquatting uses a look-alike domain. This came from the real vendor.","The flaw wasn't in the OS; the trusted update itself carried the malware.","No default passwords were involved."],
 c:"real vendor update carries the payload"},
{id:"vmescape",d:2,o:"2.3",g:"vtype",t:"VM escape",
 f:"An attacker in one virtual machine breaks out of its isolation to reach the hypervisor, the host, or other VMs on the same host. Mitigate with hypervisor patching.",
 q:"A tenant on a shared cloud host exploits a hypervisor flaw from inside their own VM and reads memory belonging to other customers' VMs. What vulnerability is this?",
 a:["VM escape","Resource reuse","Memory injection","Race condition"],
 w:["","Resource reuse is leftover data in reallocated resources. This attacker actively broke out of the VM.","Memory injection puts code into a process within the same system.","A race condition is a timing flaw."],
 c:"break OUT of the VM to the host"},
{id:"resreuse",d:2,o:"2.3",g:"vtype",t:"Resource reuse",
 f:"Memory or storage released by one VM or tenant is handed to another without being wiped, so the new owner can read leftover data.",
 q:"A new cloud VM is given disk space that previously belonged to another customer, and that customer's old data is still readable on it. Which virtualization vulnerability is this?",
 a:["Resource reuse","VM escape","Buffer overflow","Misconfigured firewall"],
 w:["","VM escape is actively breaking out of isolation. Here the data was simply handed over unwiped.","A buffer overflow overwrites memory with too much input.","No network traffic or firewall is involved."],
 c:"leftover data in reallocated resources"},
{id:"firmware",d:2,o:"2.3",g:"vtype",t:"Firmware / hardware vulnerability",
 f:"Flaws in hardware or its low-level firmware, such as CPU side-channel bugs (Spectre, Meltdown) that let programs steal data during processing. Fixed with firmware or microcode updates, not normal app patches.",
 q:"A consultant learns that a flaw in a desktop's processors lets malicious programs steal data from other programs while it's being processed. What type of vulnerability is this?",
 a:["Firmware","End-of-life","Virtualization","Legacy"],
 w:["","End-of-life means the vendor no longer supports the product.","Virtualization flaws involve VMs and hypervisors, such as VM escape.","Legacy means old technology still in use."],
 c:"processor / low-level hardware code"},
{id:"zeroday",d:2,o:"2.3",g:"vtype",t:"Zero-day",
 f:"A vulnerability unknown to the vendor, or known but with no patch available yet. Defenders get 'zero days' of warning. Rely on layered defenses, behavior-based detection and WAF/IPS shielding.",
 q:"Attackers exploit a flaw in a popular VPN appliance that the vendor didn't know about, and no patch exists yet. What is this?",
 a:["Zero-day","End-of-life vulnerability","Misconfiguration","Default credentials"],
 w:["","EOL means the vendor stopped supporting the product. This vendor supports it; they just didn't know about the flaw.","Misconfiguration is an admin setting mistake, not an unknown code flaw.","Nothing suggests factory passwords were used."],
 c:"vendor didn't know + no patch yet"},
{id:"misconfig",d:2,o:"2.3",g:"vtype",t:"Misconfiguration",
 f:"A security weakness caused by settings, not code: a public cloud bucket, unnecessary services left enabled, overly broad permissions, debug mode left on.",
 q:"Customer records leak because an admin set a cloud storage bucket to 'public' for testing and forgot to change it back. What type of vulnerability is this?",
 a:["Misconfiguration","Zero-day","Buffer overflow","Supply chain"],
 w:["","A zero-day is an unknown code flaw. This is a setting someone chose.","A buffer overflow is a memory flaw in code.","No vendor or supplier was compromised."],
 c:"wrong SETTING, not bad code"},
// ---------- 2.4 Application attacks ----------
{id:"sqli",d:2,o:"2.4",g:"appatk",t:"SQL injection",
 f:"Inserting SQL commands into input fields so the database runs them, such as ' OR 1=1 --. Defend with input validation and parameterized queries (prepared statements).",
 q:"A web server log shows a login request with the username: admin' OR '1'='1' --. What attack is being attempted?",
 a:["SQL injection","Cross-site scripting","Directory traversal","Buffer overflow"],
 w:["","XSS injects <script> into pages viewed by other users.","Directory traversal uses ../ sequences to reach other files.","A buffer overflow sends oversized input to overwrite memory, not database logic."],
 c:"' OR 1=1 = talk to the DATABASE"},
{id:"xss",d:2,o:"2.4",g:"appatk",t:"Cross-site scripting (XSS)",
 f:"Injecting malicious script into a trusted website so it runs in OTHER users' browsers, often to steal session cookies. Defend with input validation and output encoding.",
 q:"An attacker posts a product review containing <script> code. Every customer who views the review has their session cookie sent to the attacker's server. What attack is this?",
 a:["Cross-site scripting","SQL injection","Cross-site request forgery","Directory traversal"],
 w:["","SQL injection targets the database, not other users' browsers.","CSRF tricks a logged-in user's browser into SENDING an unwanted request; it doesn't inject script into a page.","Directory traversal reads files outside the web root."],
 c:"<script> runs in VICTIMS' browsers"},
{id:"csrf",d:2,o:"2.4",g:"appatk",t:"Request forgery (CSRF)",
 f:"Cross-site request forgery: tricks a user's browser, which is already logged in to a site, into sending an unwanted request, such as a transfer or password change. Defend with anti-CSRF tokens.",
 q:"While logged in to her bank, a user visits a malicious page with a hidden form that silently submits a money transfer to the bank using her active session. What attack is this?",
 a:["Cross-site request forgery","Cross-site scripting","SQL injection","Replay attack"],
 w:["","XSS injects script into the trusted site itself. Here the trusted site is just receiving a forged request.","No database commands were injected.","A replay resends captured traffic. This request was freshly forged using her live session."],
 c:"rides your LOGGED-IN session"},
{id:"dirtrav",d:2,o:"2.4",g:"appatk",t:"Directory traversal",
 f:"Using ../ sequences in a path or URL to reach files outside the web root, such as ../../etc/passwd.",
 q:"A web server log shows: GET /download?file=../../../../etc/passwd. What attack is being attempted?",
 a:["Directory traversal","SQL injection","Cross-site scripting","Buffer overflow"],
 w:["","There's no SQL syntax in the request.","There's no script being injected.","The input isn't oversized; it's navigating up folders."],
 c:"../../ = climb out of the folder"},
{id:"replay",d:2,o:"2.4",g:"appatk",t:"Replay attack",
 f:"Capturing valid authentication data or a transaction, then resending it later to impersonate the user or repeat the action. Defend with timestamps, nonces and session tokens that expire.",
 q:"An attacker sniffs a valid authentication token from the network and resends it an hour later to log in as the victim. What attack is this?",
 a:["Replay attack","Brute force","Race condition","Cross-site scripting"],
 w:["","Brute force guesses passwords. This reused a real captured token.","A race condition exploits timing between two operations.","XSS injects script into a web page."],
 c:"capture → resend later"},
{id:"privesc",d:2,o:"2.4",g:"appatk",t:"Privilege escalation",
 f:"Gaining higher permissions than intended. Vertical = normal user to admin or root. Horizontal = accessing another user's account at the same level.",
 q:"An attacker who has a standard user account exploits a vulnerable Windows service to get SYSTEM-level rights. What attack is this?",
 a:["Vertical privilege escalation","Horizontal privilege escalation","Replay attack","Credential stuffing"],
 w:["","Horizontal means moving to another account at the SAME level. This went up to SYSTEM.","No captured traffic was resent.","Credential stuffing reuses leaked passwords on other sites."],
 c:"user → admin/SYSTEM (go UP)"},
// ---------- 2.4 Malware ----------
{id:"ransom",d:2,o:"2.4",g:"malware",t:"Ransomware",
 f:"Encrypts the victim's files or systems and demands payment for the key. Often paired with data theft and a leak threat (double extortion). Best defense: tested, offline or immutable backups.",
 q:"Users suddenly can't open their files, which now end in .locked, and a note on every desktop demands Bitcoin for the decryption key. What malware is this?",
 a:["Ransomware","Spyware","Rootkit","Logic bomb"],
 w:["","Spyware hides and collects information; it doesn't lock files and announce itself.","A rootkit hides itself with deep privileges; it doesn't demand payment.","A logic bomb is defined by its trigger condition, not by a ransom demand."],
 c:"encrypted files + payment demand"},
{id:"spyware",d:2,o:"2.4",g:"malware",t:"Spyware",
 f:"Secretly monitors the user and collects information (browsing, screenshots, credentials, location) and sends it to the attacker.",
 q:"Malware on a laptop quietly takes screenshots, logs visited websites and uploads them to a remote server every hour. Which malware type BEST fits?",
 a:["Spyware","Ransomware","Worm","Bloatware"],
 w:["","Ransomware announces itself and demands payment.","A worm is defined by spreading itself across networks.","Bloatware is unwanted preinstalled software, not hidden surveillance."],
 c:"secretly watches + reports back"},
{id:"keylogger",d:2,o:"2.4",g:"malware",t:"Keylogger",
 f:"Records keystrokes (software, or a hardware device between keyboard and PC) to capture passwords and messages. A specific kind of spyware.",
 q:"A small device is found plugged in between a reception computer's keyboard and its USB port. What is it MOST likely?",
 a:["Hardware keylogger","Rootkit","Logic bomb","RFID cloner"],
 w:["","A rootkit is software that hides in the OS.","A logic bomb is code waiting for a trigger.","An RFID cloner copies badges; it doesn't sit between a keyboard and a PC."],
 c:"captures KEYSTROKES"},
{id:"virus",d:2,o:"2.4",g:"malware",t:"Virus",
 f:"Malicious code that attaches to files or programs and spreads when the infected file is run or opened. It needs user action, unlike a worm.",
 q:"Malware attaches itself to Word macro documents and spreads only when users open infected files and share them with others. What is it?",
 a:["Virus","Worm","Trojan","Rootkit"],
 w:["","A worm spreads by itself across the network with no user action.","A Trojan poses as useful standalone software; it doesn't attach to other files.","A rootkit hides with deep privileges; spreading through files isn't its defining trait."],
 c:"attaches to files + needs user to run it"},
{id:"bloat",d:2,o:"2.4",g:"malware",t:"Bloatware",
 f:"Unwanted software preinstalled by the manufacturer or vendor. Usually not malicious, but it wastes resources and widens the attack surface. Remove it as part of hardening.",
 q:"New laptops arrive with a dozen preinstalled trial apps and vendor utilities nobody uses, some with known vulnerabilities. What is this, and what should IT do?",
 a:["Bloatware; remove it during hardening","Spyware; reimage immediately and report a breach","Rootkit; replace the hardware","Logic bomb; wait for the trigger date"],
 w:["","Preinstalled vendor apps aren't spyware by default, and there's no evidence of data collection or a breach.","There's no sign of hidden, privileged malware.","There's no trigger condition. Waiting makes no sense."],
 c:"preinstalled junk = attack surface"},
// ---------- 2.4 Network / physical / crypto attacks ----------
{id:"ddosamp",d:2,o:"2.4",g:"netatk",t:"Amplified / reflected DDoS",
 f:"Reflected = the attacker spoofs the victim's IP so servers send their replies to the victim. Amplified = small requests trigger much larger responses (DNS, NTP, memcached), multiplying traffic.",
 q:"Attackers send small DNS queries with the victim's spoofed IP address to thousands of open resolvers, which each send much larger responses to the victim. What attack is this?",
 a:["Amplified reflected DDoS","On-path attack","DNS poisoning","Replay attack"],
 w:["","An on-path attack intercepts traffic between two parties.","DNS poisoning plants false records to redirect users; it isn't a flood.","A replay resends captured authentication data."],
 c:"spoofed source + small query → big reply"},
{id:"dnspoison",d:2,o:"2.4",g:"netatk",t:"DNS poisoning",
 f:"Planting false DNS records (in a resolver's cache or a hosts file) so users who type the CORRECT name are sent to an attacker's IP. Pharming uses this. DNSSEC helps prevent it.",
 q:"Users type the correct address for their bank, but end up on a fake site because the company's DNS server cache now holds a false IP for that domain. What attack is this?",
 a:["DNS poisoning","Typosquatting","Watering hole","Amplified DDoS"],
 w:["","Typosquatting relies on users mistyping. These users typed it correctly.","A watering hole compromises the real site, not the name lookup.","A DDoS floods a target; it doesn't redirect users."],
 c:"correct name → wrong IP"},
{id:"eviltwin",d:2,o:"2.4",g:"netatk",t:"Evil twin / rogue access point",
 f:"Evil twin = an attacker's access point broadcasting the same SSID as a legitimate network, to lure users and intercept traffic. Rogue AP = any unauthorized access point connected to the network.",
 q:"At an airport, an attacker sets up an access point broadcasting 'Airport_Free_WiFi', identical to the real one, with a stronger signal. Travelers connect and their traffic is captured. What is this?",
 a:["Evil twin","Rogue access point plugged into the corporate LAN","Bluejacking","DNS poisoning"],
 w:["","A rogue AP on the LAN is an unauthorized device inside the network. This one impersonates a legitimate SSID to lure users.","Bluejacking sends unsolicited messages over Bluetooth.","DNS poisoning corrupts name lookups."],
 c:"SAME name as the real Wi-Fi"},
{id:"rfid",d:2,o:"2.4",g:"physatk",t:"RFID cloning",
 f:"Copying the data from an RFID badge or card, often from a short distance without the owner noticing, to make a duplicate that opens doors.",
 q:"An attacker brushes past an employee in a coffee shop line with a concealed reader, then uses a copy of the employee's badge to enter the building that night. What attack is this?",
 a:["RFID cloning","Tailgating","Shoulder surfing","Brute force"],
 w:["","Tailgating is following someone through a door. Here the attacker had his own copied badge.","Shoulder surfing is watching someone's screen or keypad.","Brute force is guessing passwords or forcing locks."],
 c:"copy the badge wirelessly"},
{id:"downgrade",d:2,o:"2.4",g:"crypto",t:"Downgrade attack",
 f:"Forcing a connection to fall back to an older, weaker protocol or cipher (such as SSL 3.0 instead of TLS 1.3) that the attacker can then break. Mitigate by disabling old versions.",
 q:"An on-path attacker manipulates a TLS handshake so the client and server agree on an obsolete protocol version with a weak cipher. What attack is this?",
 a:["Downgrade attack","Birthday attack","Replay attack","Password spraying"],
 w:["","A birthday attack finds hash collisions.","A replay resends captured data; it doesn't change the negotiated protocol.","Spraying tries common passwords across many accounts."],
 c:"force a WEAKER protocol"},
{id:"collision",d:2,o:"2.4",g:"crypto",t:"Collision / birthday attack",
 f:"A collision is two different inputs that produce the same hash. The birthday attack uses probability to find collisions much faster than brute force. That's why MD5 and SHA-1 are retired.",
 q:"An attacker creates a fraudulent contract that has the same MD5 hash as the legitimate signed contract, so the signature appears valid. What attack does this rely on?",
 a:["Collision (birthday) attack","Downgrade attack","Pass-the-hash","Brute force"],
 w:["","A downgrade forces an older protocol during a connection.","Pass-the-hash reuses a stolen password hash to authenticate.","Brute force guesses passwords or keys one by one."],
 c:"two inputs, SAME hash"},
// ---------- 2.4 Password attacks ----------
{id:"spray",d:2,o:"2.4",g:"pwatk",t:"Password spraying",
 f:"Trying a few very common passwords (Winter2026!) against MANY accounts, slowly, to avoid lockouts. The sign: failed logins across many users, few attempts each.",
 q:"Logs show one failed login attempt each, using the password 'Spring2026!', against 900 different user accounts over an hour. No accounts locked out. What attack is this?",
 a:["Password spraying","Brute force","Credential replay","Dictionary attack on one account"],
 w:["","Brute force hammers ONE account with many guesses, which usually triggers lockouts.","Replay reuses a captured valid credential.","A dictionary attack runs a word list against one account; here it's one password against many accounts."],
 c:"ONE password vs MANY accounts"},
{id:"brute",d:2,o:"2.4",g:"pwatk",t:"Brute force",
 f:"Trying many or all possible passwords against an account, online (against the live login, which triggers lockouts) or offline (against stolen hashes). Defend with lockouts, MFA and long passwords.",
 q:"An account receives 12,000 failed login attempts in 10 minutes from one IP, each with a different password, until the account locks. What attack is this?",
 a:["Brute force","Password spraying","Replay attack","Privilege escalation"],
 w:["","Spraying is a few passwords across many accounts. This is many passwords against one.","A replay reuses captured valid credentials, so it wouldn't fail 12,000 times.","Privilege escalation happens after access is gained."],
 c:"MANY passwords vs ONE account"},
// ---------- 2.4 Indicators ----------
{id:"imptravel",d:2,o:"2.4",g:"ioc",t:"Impossible travel",
 f:"Logins from locations too far apart to travel between in the time between them, such as Chicago at 9:00 and Moscow at 9:20. Strong sign of stolen credentials.",
 q:"A user's account logs in from Dallas at 1:05 p.m. and from Singapore at 1:25 p.m. the same day. Which indicator is this?",
 a:["Impossible travel","Concurrent session usage","Resource consumption","Out-of-cycle logging"],
 w:["","Concurrent sessions are simultaneous logins. The key clue here is distance over time.","Resource consumption is unusual CPU, disk or bandwidth use.","Out-of-cycle logging is log activity at unexpected times."],
 c:"too far, too fast"},
{id:"concurrent",d:2,o:"2.4",g:"ioc",t:"Concurrent session usage",
 f:"The same account active in multiple sessions at once when that shouldn't happen, such as a user logged in at their desk and from a VPN at the same time.",
 q:"An employee is badged in and working at her office workstation while her account is simultaneously active in a VPN session from an unknown device. Which indicator is this?",
 a:["Concurrent session usage","Impossible travel","Account lockout","Blocked content"],
 w:["","Impossible travel compares locations over time. Here the clue is two sessions at the SAME time.","Nothing was locked out.","Blocked content is a filter stopping access to something."],
 c:"same account, two places AT ONCE"},
{id:"lockout",d:2,o:"2.4",g:"ioc",t:"Account lockout as an indicator",
 f:"A sudden wave of locked accounts, or users locked out who didn't fail logins themselves, suggests someone else is guessing their passwords.",
 q:"The help desk gets 50 calls in an hour from users who are locked out but insist they didn't mistype their passwords. What does this MOST likely indicate?",
 a:["A password attack against those accounts","A misconfigured web filter","Resource exhaustion on the file server","Normal user error"],
 w:["","A web filter blocks websites; it doesn't lock accounts.","Resource exhaustion slows systems; it doesn't cause lockouts.","Fifty users at once who all say they didn't fail logins isn't normal error."],
 c:"many lockouts users didn't cause"},
{id:"missinglogs",d:2,o:"2.4",g:"ioc",t:"Missing / out-of-cycle logs",
 f:"Gaps in logs, deleted or cleared logs, or logging at strange times. Attackers often clear logs to cover their tracks, so the gap itself is an indicator.",
 q:"An analyst finds that the security log on a domain controller has no entries between 2:00 and 3:15 a.m., and event ID 1102 shows the log was cleared. What does this MOST likely indicate?",
 a:["An attacker covering their tracks","Normal log rotation","Impossible travel","A false positive from the SIEM"],
 w:["","Normal rotation archives logs; it doesn't leave an unexplained gap with a 'log cleared' event.","Impossible travel is about login locations.","The gap and the clear event are real, not a mistaken alert."],
 c:"gap / cleared logs = hiding something"},
// ---------- 2.5 Mitigations ----------
{id:"allowlist",d:2,o:"2.5",g:"mitig",t:"Application allow list",
 f:"Only explicitly approved applications can run; everything else is blocked by default. Stronger than a block list, which only stops known-bad items.",
 q:"Kiosk computers keep getting infected by new malware variants that antivirus doesn't recognize yet. Which mitigation BEST prevents any unapproved program from running?",
 a:["Application allow list","Application block list","More frequent antivirus updates","Host-based firewall"],
 w:["","A block list only stops programs you already know are bad. New variants aren't on it yet.","AV updates still lag behind brand-new variants.","A host firewall controls network traffic, not which programs execute."],
 c:"only APPROVED apps run"},
{id:"segment",d:2,o:"2.5",g:"mitig",t:"Segmentation",
 f:"Dividing the network into zones (VLANs, subnets, firewall rules) so a compromise in one area can't easily spread to others.",
 q:"A company keeps its unpatchable factory controllers but wants to make sure malware on office PCs can't reach them. Which mitigation fits BEST?",
 a:["Segmentation","Application allow list","Encryption","Decommissioning"],
 w:["","An allow list controls which programs run on a host; it doesn't stop network access to the controllers.","Encryption protects data confidentiality; it doesn't block malware from reaching systems.","Decommissioning would remove the controllers, but they still need them."],
 c:"separate zones, limit spread"},
{id:"leastpriv",d:2,o:"2.5",g:"mitig",t:"Least privilege",
 f:"Users, services and apps get only the minimum permissions needed for their job, so a compromised account can do less damage.",
 q:"Malware spread widely because every employee's account had local admin rights 'to make installs easier'. Which principle would have limited the damage MOST?",
 a:["Least privilege","Segmentation","Encryption","Monitoring"],
 w:["","Segmentation limits network spread, but the root problem is everyone having admin rights.","Encryption protects data secrecy, not what an account can do.","Monitoring detects the problem but doesn't reduce what the malware could do."],
 c:"minimum rights needed"},
{id:"isolate",d:2,o:"2.5",g:"mitig",t:"Isolation",
 f:"Separating a compromised or high-risk system from everything else (pulling it off the network, a quarantine VLAN) so it can't spread or communicate.",
 q:"EDR confirms ransomware is actively encrypting files on one laptop. What mitigation should happen IMMEDIATELY?",
 a:["Isolate the laptop from the network","Decommission the laptop permanently","Add an application allow list","Patch the laptop's browser"],
 w:["","Decommissioning is a long-term decision. Right now you need to stop the spread.","An allow list is a preventive control; the malware is already running.","Patching won't stop active encryption."],
 c:"cut it off NOW"},
{id:"harden2",d:2,o:"2.5",g:"mitig",t:"Hardening techniques",
 f:"Reducing the attack surface: disable unused ports, protocols and services; change default passwords; remove unnecessary software; install endpoint protection and host firewalls; encrypt.",
 q:"A new web server has Telnet, FTP and a print service running that it doesn't need, plus the vendor's default admin password. Which approach addresses ALL of this?",
 a:["Harden the server","Buy cyber insurance","Run a tabletop exercise","Add the server to the risk register as accepted"],
 w:["","Insurance transfers financial loss; it doesn't fix the server.","A tabletop tests IR plans through discussion.","Accepting the risk does nothing to reduce it, and these are easy fixes."],
 c:"disable unused + change defaults + remove extras"},
{id:"decom",d:2,o:"2.5",g:"mitig",t:"Decommissioning",
 f:"Properly retiring systems that are no longer needed: remove them from the network, revoke their accounts and DNS entries, and sanitize the storage. Forgotten systems become unpatched entry points.",
 q:"A scan finds an old, unpatched file server nobody has used in a year, still on the network with active service accounts. What is the BEST mitigation?",
 a:["Decommission it properly","Apply a policy exception","Add it to the allow list","Increase its log retention"],
 w:["","An exception accepts the risk of a system you still need. Nobody needs this one.","An allow list controls which apps run on a system; it doesn't fix an unneeded, unpatched server.","More logs don't reduce the risk of an unused, exposed server."],
 c:"not needed → retire it properly"}
);
