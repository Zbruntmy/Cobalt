<script>
(function(){
"use strict";
const DOM={1:"General Security Concepts",2:"Threats, Vulnerabilities & Mitigations",3:"Security Architecture",4:"Security Operations",5:"Security Program Management & Oversight"};
const WT={1:.12,2:.22,3:.18,4:.28,5:.20};
const INT=[0,10*60e3,60*60e3,8*36e5,24*36e5,3*24*36e5,7*24*36e5]; // box 0..6
const KEY="cobalt.v1";
const BYID={}; DECK.forEach(c=>BYID[c.id]=c);
const GROUPS={}; DECK.forEach(c=>{(GROUPS[c.g]=GROUPS[c.g]||[]).push(c.id)});
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickRand=a=>a[Math.floor(Math.random()*a.length)];

// ---------- state ----------
function blank(){return {v:1,cards:{},pbq:{},settings:{theme:"dark",domains:[],rev:false,rate:1,gap:5,voice:""},exams:[]}}
let S=blank();
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&p.cards) S=Object.assign(blank(),p,{settings:Object.assign(blank().settings,p.settings||{})});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cs=id=>S.cards[id]||{b:0,due:0,seen:0,right:0,wrong:0,idk:0,last:""};
document.documentElement.dataset.theme=S.settings.theme;

function masteryOf(ids){if(!ids.length)return 0;let t=0;ids.forEach(id=>t+=Math.min(cs(id).b,4)/4);return t/ids.length}
function domainIds(d){return DECK.filter(c=>c.d===d).map(c=>c.id)}
function domainStats(){
  const out={};
  for(const d of [1,2,3,4,5]){const ids=domainIds(d);const m=masteryOf(ids);
    out[d]={n:ids.length,seen:ids.filter(id=>cs(id).seen>0).length,m,risk:WT[d]*(1-m)}}
  return out;
}
function pool(){if(focus)return DECK.filter(c=>c.o===focus.o);const ds=S.settings.domains;return DECK.filter(c=>!ds.length||ds.includes(c.d))}
function isWeak(id){const s=cs(id);return s.seen>0&&(s.last!=="r"||s.b<=1)}

// ---------- session / selector ----------
let sess=null;
function newSession(mode){return {mode,answered:0,right:0,requeue:[],recent:[],last:null,cur:null,fmt:null,picked:null,done:false,flipped:false}}
function grade(id,r){
  const s=Object.assign({},cs(id)); s.seen++;
  if(r==="r"){s.b=s.b===0?2:Math.min(6,s.b+1);s.right++}
  else if(r==="w"){s.b=1;s.wrong++;sess&&sess.requeue.push({id,n:3})}
  else {s.b=s.b<=2?1:s.b-1;s.idk++;sess&&sess.requeue.push({id,n:6})}
  s.due=Date.now()+INT[s.b]; s.last=r; S.cards[id]=s; save();
  if(sess){sess.answered++; if(r==="r")sess.right++;}
}
function nextCard(){
  let P=pool(); if(sess.mode==="weak") P=P.filter(c=>isWeak(c.id));
  if(!P.length) return null;
  const inP=new Set(P.map(c=>c.id));
  sess.requeue.forEach(q=>q.n--);
  const rq=sess.requeue.findIndex(q=>q.n<=0&&inP.has(q.id)&&q.id!==sess.last);
  if(rq>-1){const id=sess.requeue[rq].id;sess.requeue.splice(rq,1);return id}
  const recent=new Set(sess.recent.slice(-Math.min(6,Math.max(1,P.length-1))));
  // confusion-pair follow-up
  if(sess.last&&Math.random()<0.45){
    const g=BYID[sess.last].g; const mates=(GROUPS[g]||[]).filter(id=>id!==sess.last&&inP.has(id)&&!recent.has(id));
    if(mates.length){mates.sort((a,b)=>cs(a).b-cs(b).b);return pickRand(mates.slice(0,2))}
  }
  const now=Date.now();
  const due=P.filter(c=>{const s=cs(c.id);return s.seen>0&&s.due<=now&&!recent.has(c.id)});
  const fresh=P.filter(c=>cs(c.id).seen===0&&!recent.has(c.id));
  if(sess.mode==="weak"){const w=P.filter(c=>!recent.has(c.id));const L=(w.length?w:P).slice().sort((a,b)=>cs(a.id).b-cs(b.id).b);return pickRand(L.slice(0,4)).id}
  if(due.length&&(Math.random()<0.65||!fresh.length)){
    due.sort((a,b)=>cs(a.id).b-cs(b.id).b||cs(a.id).due-cs(b.id).due);return pickRand(due.slice(0,4)).id}
  if(fresh.length){
    const ds=domainStats(); const byD={}; fresh.forEach(c=>(byD[c.d]=byD[c.d]||[]).push(c));
    const keys=Object.keys(byD); let tot=0; const w=keys.map(d=>{const x=ds[d].risk+.01;tot+=x;return x});
    let r=Math.random()*tot,k=keys[0]; for(let i=0;i<keys.length;i++){r-=w[i];if(r<=0){k=keys[i];break}}
    return pickRand(byD[k]).id}
  const rest=P.filter(c=>!recent.has(c.id)); const L=(rest.length?rest:P).slice().sort((a,b)=>cs(a.id).due-cs(b.id).due);
  return L[0].id;
}
function advance(){
  const id=nextCard(); sess.cur=id; sess.picked=null; sess.done=false; sess.flipped=false;
  if(!id){render();return}
  sess.recent.push(id); if(sess.recent.length>20)sess.recent.shift(); sess.last=id;
  const m=sess.mode; sess.fmt=m==="flip"?"flip":m==="drill"?"mc":(Math.random()<(m==="weak"?0.5:0.6)?"mc":"flip");
  const c=BYID[id]; sess.order=shuffle([0,1,2,3]);
  render();
}

  exam:{n:"Mini Exam",d:"30 timed MC, no feedback until the end. Domain breakdown."},
  audio:{n:"Audio",d:"Hands-free. Reads question, pause, answer. Weakest first."}
};

7503 594.6567,431.5481 C 628.9556,442.2467 672.6701,461.7327 700.4333,478.6985 C 703.9068,480.8211 708.7399,483.7465 711.1736,485.1993 C 713.6073,486.6521 719.7956,490.8734 724.9255,494.5801 C 730.0554,498.2868 735.9410,502.5294 738.0045,504.0081 C 756.8247,517.4945 781.7860,540.8503 797.7573,559.9178 C 800.0879,562.7003 804.6327,568.1304 807.8567,571.9848 C 816.2887,582.0654 835.1635,613.7917 840.2830,626.4896 L 840.2830,626.4896 M 406.5109,255.9767 C 496.0754,141.5120 663.7441,196.5718 665.6255,341.0659 C 666.4887,407.3587 596.7075,448.2775 553.0165,407.0984 C 552.3996,406.5169 549.9716,404.2945 547.6209,402.1597 C 535.0060,390.7033 529.0301,375.9177 538.8342,380.4199 C 562.4018,391.2424 585.9569,378.3333 590.4029,352.1583 C 597.8176,308.5052 548.8503,272.3506 507.0660,290.6274 C 412.8926,331.8194 413.1920,580.9317 507.4560,615.1520 C 517.9968,618.9786 517.7512,618.7622 514.6688,621.5094 C 513.4000,622.6403 507.9571,627.5176 502.5734,632.3479 C 451.7272,677.9675 372.5687,706.6869 318.8425,699.0070 C 309.7140,697.7021 310.0289,697.1147 321.8209,693.4512 C 352.8792,683.8023 369.4905,658.2891 369.1769,620.7172 C 369.0479,605.2593 368.4570,601.5441 360.4997,566.1661 C 352.6155,531.1130 347.6336,483.5122 348.4449,450.9857 C 348.5463,446.9162 348.6632,441.2679 348.7045,438.4339 C 348.7459,435.5999 349.3075,428.1299 349.9526,421.8340 C 350.5977,415.5380 351.3292,408.3197 351.5780,405.7932 C 353.8475,382.7512 361.5936,349.4563 370.1208,326.0909 C 371.3652,322.6813 373.7955,316.0304 375.5214,311.3111 C 380.0355,298.9684 398.0739,266.7593 406.5109,255.9767 L 406.5109,255.9767"/></svg><h1>COBALT</h1></div>
    <div class="lbl">Cram Or Bomb, All Last-minute Training</div>
    <p class="lede">Flashcards and exam drills that learn where you're weak and push those cards harder.</p>
    <div class="meta">${window.__cobaltInstall?`<button class="installbtn" data-act="install">⬇ Install app</button>`:""}<span>${DECK.length} cards · ${PBQ.length} PBQs · Wave 4</span><span>Progress saves on this device</span></div>

}
function homeView(){
  const ds=domainStats(); const all=DECK.map(c=>c.id);
  const seen=all.filter(id=>cs(id).seen>0).length; const now=Date.now();
  const dueN=all.filter(id=>{const s=cs(id);return s.seen>0&&s.due<=now}).length;
  const weakN=all.filter(isWeak).length;
  let top=1; for(const d of [1,2,3,4,5]) if(ds[d].risk>ds[top].risk) top=d;
  const lastEx=S.exams[S.exams.length-1];

function studyTop(){
  const m=MODES[sess.mode]; const pct=sess.answered?Math.round(sess.right/sess.answered*100):0;
  const flipFmt=sess.fmt==="flip";
  return `<div class="bar-top"><div class="left"><button class="btn ghost" data-act="home" style="min-height:40px;padding:8px 12px">← Home</button><div class="eyebrow">${m.n}${focus?` · ${focus.o} ${esc(OBJ[focus.o])}`:""}</div></div>
   <div class="row" style="align-items:center">${flipFmt?`<button class="toggle ${S.settings.rev?"on":""}" data-act="rev">⇄ Reverse</button>`:""}<span class="sess">${sess.answered} done · ${pct}%</span></div></div>`;
}
function tagHtml(c){return `<div class="tag"><span class="d">D${c.d} · ${c.o}</span><span>${esc(DOM[c.d])}</span></div>`}
function studyView(){
  if(!sess.cur){
    return studyTop()+`<div class="card"><h2>${sess.mode==="weak"?"No weak spots yet":"Nothing in this filter"}</h2>
    <p class="note">${sess.mode==="weak"?"Miss a few cards or hit 'No idea' in another mode and they'll land here.":"Change the domain filter on the home screen."}</p>
    <button class="btn primary" data-act="home">Back home</button></div>`;
  }
  const c=BYID[sess.cur];
  if(sess.fmt==="flip"){
    const rev=S.settings.rev; const front=rev?c.f:c.t, back=rev?c.t:c.f;
    const face=sess.flipped
      ?`<div><div class="${rev?"front":"back"}">${esc(back)}</div>${!rev?`<div class="clue" style="margin-top:14px;text-align:left"><b>Key clue</b>${esc(c.c)}</div>`:""}</div>`
      :`<div><div class="${rev?"back":"front"}">${esc(front)}</div><div class="hint">Tap to flip · Space</div></div>`;
    const btns=sess.flipped
      ?`<div class="row3"><button class="btn miss" data-act="g" data-r="w">Wrong <span class="kbd">1</span></button><button class="btn warn" data-act="g" data-r="i">No idea <span class="kbd">2</span></button><button class="btn safe" data-act="g" data-r="r">Right <span class="kbd">3</span></button></div>`
      :`<div class="row2"><button class="btn warn" data-act="g" data-r="i">No idea <span class="kbd">N</span></button><button class="btn primary" data-act="flip">Flip <span class="kbd">Space</span></button></div>`;
    return studyTop()+`<div class="card">${tagHtml(c)}<div class="flip" data-act="flip">${face}</div>${btns}${sess.flipped?guideLink(c):""}</div>`;
  }
  // MC
  const L="ABCD"; const done=sess.done;
  const opts=sess.order.map((oi,pos)=>{
    let cls=""; if(done){ if(oi===0)cls="right"; else if(sess.picked===oi)cls="wrong"; }
    return `<button class="opt ${cls}" data-act="pick" data-o="${oi}" ${done?"disabled":""}><span class="k">${L[pos]}</span><span>${esc(c.a[oi])}</span></button>`}).join("");
  let fb="";
  if(done){
    const p=sess.picked;
    const v=p===0?["good","Correct."]:p===-1?["idk","No idea? Here's every option."]:["bad","Not quite."];
    fb=`<div class="fb ${v[0]}"><div class="verdict">${v[1]}</div>${breakdownHtml(c,sess.order,p)}<div class="clue"><b>Key clue</b>${esc(c.c)}</div>${guideLink(c)}</div>`;
    fb+=`<button class="btn primary" data-act="next">Next <span class="kbd">Enter</span></button>`;
  } else fb=`<button class="linkbtn" data-act="pick" data-o="-1">I have no idea <span class="kbd">N</span></button>`;
  return studyTop()+`<div class="card">${tagHtml(c)}<p class="q">${esc(c.q)}</p><div class="opts">${opts}</div>${fb}</div>`;
}
// Every option, in the order shown (A–D): why the right one is right, why each wrong one is wrong.
function breakdownHtml(c,order,picked){
  const L="ABCD";
  return `<div class="bd">`+order.map((oi,pos)=>{const ok=oi===0, mine=oi===picked;
    const tag=(ok?"✓ Correct answer":"✗ Wrong")+(mine?" · your pick":"");
    return `<div class="bdr ${ok?"ok":""} ${mine?"mine":""}"><div class="bdh"><span class="k">${L[pos]}</span><div><b>${esc(c.a[oi])}</b><span class="bdtag">${tag}</span></div></div><p>${esc(ok?c.f:c.w[oi])}</p></div>`}).join("")+`</div>`;
}
function othersHtml(c,skip,open){
  const li=[1,2,3].filter(i=>!skip.includes(i)).map(i=>`<li><b>${esc(c.a[i])}</b>: ${esc(c.w[i])}</li>`).join("");
  return li?`<details ${open?"open":""}><summary>Why the other options are wrong</summary><ul>${li}</ul></details>`:"";
}

// ---------- mini exam ----------
let ex=null;
function startExam(){
  const P=pool(); const N=Math.min(30,P.length); const left=P.slice(); const picks=[];
  // pick a domain by exam weight (not by how many cards it has), then a random card in it
  while(picks.length<N){const ds=[...new Set(left.map(c=>c.d))];let tot=0;ds.forEach(d=>tot+=WT[d]);let r=Math.random()*tot,d=ds[0];
    for(const x of ds){r-=WT[x];if(r<=0){d=x;break}}
    const inD=left.filter(c=>c.d===d);const c=pickRand(inD);left.splice(left.indexOf(c),1);picks.push(c.id)}
  ex={ids:picks,orders:picks.map(()=>shuffle([0,1,2,3])),ans:picks.map(()=>null),i:0,end:Date.now()+N*60e3,done:false,tick:null};
  ex.tick=setInterval(()=>{const t=document.getElementById("timer");if(!t)return;const s=Math.max(0,Math.round((ex.end-Date.now())/1000));
    t.textContent=fmtT(s);t.classList.toggle("low",s<120);if(s<=0)finishExam()},1000);
  view="exam";render();
}
const fmtT=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function finishExam(){
  if(!ex||ex.done)return; clearInterval(ex.tick); ex.done=true;
  let right=0; ex.ids.forEach((id,k)=>{const ok=ex.ans[k]===0; if(ok)right++;
    const s=Object.assign({},cs(id)); s.seen++;
    if(ok){s.b=s.b===0?2:Math.min(6,s.b+1);s.right++;s.last="r"} else {s.b=1;s.wrong++;s.last=ex.ans[k]===null?"i":"w"}
    s.due=Date.now()+INT[s.b]; S.cards[id]=s});
  const score=Math.round(right/ex.ids.length*100); ex.score=score; ex.right=right;
  S.exams.push({t:Date.now(),score,n:ex.ids.length}); if(S.exams.length>50)S.exams.shift(); save();
  render();
}
function examView(){
  if(ex.done){
    const byD={}; ex.ids.forEach((id,k)=>{const d=BYID[id].d;byD[d]=byD[d]||{n:0,r:0};byD[d].n++;if(ex.ans[k]===0)byD[d].r++});
    const rows=Object.keys(byD).sort().map(d=>{const x=byD[d],p=Math.round(x.r/x.n*100);return `<div class="drow"><div class="top2"><b>D${d} · ${DOM[d]}</b><span class="pct">${x.r}/${x.n}</span></div><div class="bar"><i style="width:${p}%"></i></div>${p<80?`<button class="linkbtn gl" data-act="guide" data-d="${d}">📖 Review D${d} in the study guide</button>`:""}</div>`}).join("");
    const misses=ex.ids.map((id,k)=>({id,k})).filter(o=>ex.ans[o.k]!==0).map(({id,k})=>{const c=BYID[id],p=ex.ans[k];
      return `<div class="miss-item">${tagHtml(c)}<p>${esc(c.q)}</p>${p===null?`<p class="err">Skipped / no answer</p>`:""}${breakdownHtml(c,ex.orders[k],p)}<div class="clue"><b>Key clue</b>${esc(c.c)}</div>${guideLink(c)}</div>`}).join("");
    const pass=ex.score>=80;
    return `<div class="bar-top"><div class="left"><button class="btn ghost" data-act="home" style="min-height:40px;padding:8px 12px">← Home</button><div class="eyebrow">Mini Exam · Results</div></div></div>
     <section><div class="score" style="color:var(${pass?"--safe":"--miss"})">${ex.score}%</div><p class="note">${ex.right} of ${ex.ids.length} correct · target 80%+ (your WGU pass line)</p>
     <div class="row"><button class="btn primary" data-act="start" data-m="exam">Take another</button>${misses?`<button class="btn" data-act="start" data-m="weak">Drill weak spots</button>`:""}</div></section>
     <section><div class="eyebrow">By domain</div><div>${rows}</div></section>
     ${misses?`<section><div class="eyebrow">Review your misses</div><div class="miss-list">${misses}</div></section>`:""}`;
  }
  const id=ex.ids[ex.i], c=BYID[id], L="ABCD", s=Math.max(0,Math.round((ex.end-Date.now())/1000));
  const opts=ex.orders[ex.i].map((oi,pos)=>`<button class="opt ${ex.ans[ex.i]===oi?"sel":""}" data-act="xpick" data-o="${oi}"><span class="k">${L[pos]}</span><span>${esc(c.a[oi])}</span></button>`).join("");
  const last=ex.i===ex.ids.length-1;
  return `<div class="bar-top"><div class="left"><button class="btn ghost" data-act="quitexam" style="min-height:40px;padding:8px 12px">✕ Quit</button><div class="eyebrow">Mini Exam · ${ex.i+1}/${ex.ids.length}</div></div><span class="timer ${s<120?"low":""}" id="timer">${fmtT(s)}</span></div>
   <div class="prog"><i style="width:${(ex.i)/ex.ids.length*100}%"></i></div>
   <div class="card">${tagHtml(c)}<p class="q">${esc(c.q)}</p><div class="opts">${opts}</div>
   <div class="row2"><button class="btn" data-act="xprev" ${ex.i===0?"disabled":""}>← Back</button><button class="btn primary" data-act="${last?"xfinish":"xnext"}">${last?"Finish":"Next →"}</button></div></div>`;
}

// ---------- audio ----------
let au={on:false,i:0,q:[],tok:0,phase:"",lock:null};
const synth=window.speechSynthesis;
function audioQueue(){
  const P=pool(); const score=c=>{const s=cs(c.id);if(s.seen===0)return 1.5;return s.b-(s.last==="w"?1:s.last==="i"?.5:0)};
  return P.slice().sort((a,b)=>score(a)-score(b)||Math.random()-.5).map(c=>c.id);
}
function voices(){try{return synth.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return []}}
function chunks(t){return (t.match(/[^.!?]+[.!?]*/g)||[t]).map(x=>x.trim()).filter(Boolean)}
function speak(text,tok){
  return new Promise(res=>{
    const parts=chunks(text); let k=0;
    const go=()=>{ if(tok!==au.tok||k>=parts.length) return res();
      const u=new SpeechSynthesisUtterance(parts[k++]); u.rate=S.settings.rate;
      const v=voices().find(v=>v.name===S.settings.voice); if(v)u.voice=v;
      u.onend=go; u.onerror=go; synth.speak(u) };
    go();
  });
}
const sleep=(ms,tok)=>new Promise(r=>{const t0=Date.now();const iv=setInterval(()=>{if(tok!==au.tok||Date.now()-t0>=ms){clearInterval(iv);r()}},100)});
async function lockOn(){try{if(navigator.wakeLock)au.lock=await navigator.wakeLock.request("screen")}catch(e){au.lock=null}}
function lockOff(){try{au.lock&&au.lock.release()}catch(e){} au.lock=null}
document.addEventListener("visibilitychange",()=>{if(au.on&&document.visibilityState==="visible")lockOn()});
async function audioLoop(){
  const tok=au.tok;
  while(au.on&&tok===au.tok){
    if(au.i>=au.q.length){au.q=audioQueue();au.i=0;if(!au.q.length){stopAudio();return}}
    const c=BYID[au.q[au.i]]; au.phase="q"; paintAudio();
    await speak(c.q,tok); if(tok!==au.tok)return;
    au.phase="wait"; paintAudio(); await sleep(S.settings.gap*1000,tok); if(tok!==au.tok)return;
    au.phase="a"; paintAudio(); await speak("Answer: "+c.a[0]+".",tok); if(tok!==au.tok)return;
    await sleep(1800,tok); if(tok!==au.tok)return;
    au.i++;
  }
}
function startAudio(){ if(!synth)return; au.on=true; au.tok++; lockOn(); render(); audioLoop() }
function stopAudio(){ au.on=false; au.tok++; try{synth.cancel()}catch(e){} lockOff(); if(view==="audio")render() }
function skipAudio(){ au.tok++; try{synth.cancel()}catch(e){} au.i++; if(au.on){au.on=true;setTimeout(()=>{audioLoop()},150)} render() }
function paintAudio(){const el=document.getElementById("audiocard"); if(el) el.innerHTML=audioCardHtml()}
function audioCardHtml(){
  if(!au.q.length) return `<p class="note">No cards in this filter.</p>`;
  const c=BYID[au.q[Math.min(au.i,au.q.length-1)]];
  return `${tagHtml(c)}<p class="audio-q">${esc(c.q)}</p><div class="audio-a">${au.phase==="a"?esc(c.a[0]):au.phase==="wait"?"…":""}</div><p class="sess">Card ${au.i+1} of ${au.q.length} · weakest first</p>`;
}
function audioView(){
  if(!au.q.length){au.q=audioQueue();au.i=0}
  if(!synth) return `<div class="bar-top"><div class="left"><button class="btn ghost" data-act="home">← Home</button><div class="eyebrow">Audio</div></div></div><div class="card"><h2>No speech on this browser</h2><p class="note">This browser doesn't support text-to-speech. Try Chrome or Safari.</p></div>`;
  const vs=voices(); const vopts=`<option value="">Default voice</option>`+vs.map(v=>`<option ${v.name===S.settings.voice?"selected":""}>${esc(v.name)}</option>`).join("");
  return `<div class="bar-top"><div class="left"><button class="btn ghost" data-act="home" style="min-height:40px;padding:8px 12px">← Home</button><div class="eyebrow">Audio · listen only</div></div><span class="sess">${au.on?"Playing":"Paused"}</span></div>
   <div class="card" id="audiocard">${audioCardHtml()}</div>
   <div class="ctl"><button class="btn ${au.on?"":"primary"}" data-act="${au.on?"astop":"aplay"}">${au.on?"❚❚ Pause":"▶ Play"}</button><button class="btn" data-act="askip">Skip ⏭</button></div>
   <section><div class="row2">
     <label class="field"><span class="lbl">Speed</span><select data-act="arate">${[.8,.9,1,1.1,1.25,1.5].map(r=>`<option value="${r}" ${S.settings.rate==r?"selected":""}>${r}×</option>`).join("")}</select></label>
     <label class="field"><span class="lbl">Think time</span><select data-act="agap">${[3,5,8,12].map(g=>`<option value="${g}" ${S.settings.gap==g?"selected":""}>${g} sec</option>`).join("")}</select></label>
   </div><label class="field"><span class="lbl">Voice</span><select data-act="avoice">${vopts}</select></label>
   <p class="note">Keep this page open with the screen on (it asks your phone to stay awake). Locking the phone stops speech on most browsers. Audio mode doesn't grade you.</p></section>`;
}
if(synth&&synth.addEventListener) synth.addEventListener("voiceschanged",()=>{if(view==="audio"&&!au.on)render()});

// ---------- modal ----------
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box">${html}</div>`;
  m.addEventListener("click",e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function exportModal(){
  const data=JSON.stringify(S);
  const m=modal(`<div class="eyebrow">Export</div><h2>Your progress</h2><p class="note">Copy this, then on your other device open COBALT → Import progress → paste.</p>
   <textarea readonly id="exta">${esc(data)}</textarea><div class="row"><button class="btn primary" id="cp">Copy</button><button class="btn" id="cl">Close</button></div><p id="cpmsg"></p>`);
  m.querySelector("#cl").onclick=()=>m.remove();
  m.querySelector("#cp").onclick=async()=>{const ta=m.querySelector("#exta");const msg=m.querySelector("#cpmsg");
    try{await navigator.clipboard.writeText(data);msg.className="ok";msg.textContent="✓ Copied."}catch(e){ta.focus();ta.select();msg.className="note";msg.textContent="Text selected. Copy it with Ctrl+C or long-press → Copy."}};
}
function importModal(){
  const m=modal(`<div class="eyebrow">Import</div><h2>Paste progress</h2><p class="note">This replaces the progress on this device.</p>
   <textarea id="imta" placeholder="Paste exported progress here"></textarea><div class="row"><button class="btn primary" id="im">Import</button><button class="btn" id="cl">Cancel</button></div><p id="immsg"></p>`);
  m.querySelector("#cl").onclick=()=>m.remove();
  m.querySelector("#im").onclick=()=>{const msg=m.querySelector("#immsg");
    try{const p=JSON.parse(m.querySelector("#imta").value);if(!p||typeof p.cards!=="object")throw 0;
      S=Object.assign(blank(),p,{settings:Object.assign(blank().settings,p.settings||{})});save();document.documentElement.dataset.theme=S.settings.theme;
      msg.className="ok";msg.textContent="✓ Imported.";setTimeout(()=>{m.remove();render()},700)}
    catch(e){msg.className="err";msg.textContent="That doesn't look like COBALT progress. Paste the full export text."}};
}
let resetArm=0;

// ---------- PBQ lab ----------
let pq=null;
const PBY={}; PBQ.forEach(p=>PBY[p.id]=p);
function pbqPool(){if(focus)return PBQ.filter(p=>p.o===focus.o);const ds=S.settings.domains;return PBQ.filter(p=>!ds.length||ds.includes(p.d))}
function startPbq(){
  const ps=S.pbq||{}; const bestOf=id=>ps[id]?ps[id].best:-1;
  const ids=shuffle(pbqPool().map(p=>p.id)).sort((a,b)=>bestOf(a)-bestOf(b));
  pq={ids,i:0}; if(ids.length)loadPbq(); go("pbq");
}
function loadPbq(){
  pq.done=false; pq.res=null; const p=PBY[pq.ids[pq.i]];
  if(p.type==="table") pq.ans=p.rows.map(r=>r.a.map(()=>""));
  else if(p.type==="order"){let o;do{o=shuffle(p.items.map((_,i)=>i))}while(o.every((v,i)=>v===i));pq.ans=o}
  else pq.ans=new Set();
}
function scorePbq(p,ans){
  if(p.type==="table"){let n=0,r=0;p.rows.forEach((row,ri)=>row.a.forEach((v,ci)=>{n++;if(ans[ri][ci]===v)r++}));return {r,n}}
  if(p.type==="order"){let r=0;ans.forEach((v,i)=>{if(v===i)r++});return {r,n:ans.length}}
  let tp=0,fp=0,fn=0;p.lines.forEach((l,i)=>{const s=ans.has(i);if(l.hit&&s)tp++;else if(!l.hit&&s)fp++;else if(l.hit)fn++});
  return {r:tp,n:tp+fp+fn,fp,fn,hits:tp+fn};
}
function submitPbq(){
  const p=PBY[pq.ids[pq.i]]; const sc=scorePbq(p,pq.ans); sc.pct=Math.round(sc.r/Math.max(1,sc.n)*100);
  pq.done=true; pq.res=sc;
  S.pbq=S.pbq||{}; const o=S.pbq[p.id]||{best:0,tries:0}; o.tries++; o.last=sc.pct; o.best=Math.max(o.best,sc.pct); S.pbq[p.id]=o; save();
  render(); const el=document.getElementById("pqres"); if(el&&el.scrollIntoView)el.scrollIntoView({block:"start"});
}
function pbqView(){
  const n=pq.ids.length;
  const top=`<div class="bar-top"><div class="left"><button class="btn ghost" data-act="home" style="min-height:40px;padding:8px 12px">← Home</button><div class="eyebrow">PBQ Lab${n&&pq.i<n?` · ${pq.i+1}/${n}`:""}</div></div><span class="sess">Partial credit</span></div>`;
  if(!n) return top+`<div class="card"><h2>No PBQs in this filter</h2><p class="note">Change the domain filter on the home screen.</p><button class="btn primary" data-act="home">Back home</button></div>`;
  if(pq.i>=n){
    const rows=pq.ids.map(id=>{const p=PBY[id],s=(S.pbq||{})[id]||{best:0,last:0};
      return `<div class="drow"><div class="top2"><b>${esc(p.t)}</b><span class="pct">${s.last}% · best ${s.best}%</span></div><div class="bar"><i style="width:${s.last}%"></i></div></div>`}).join("");
    return top+`<section><div class="eyebrow">Round complete</div><h2>PBQ results</h2><div>${rows}</div><div class="row"><button class="btn primary" data-act="pq-again">Run them again</button><button class="btn" data-act="home">Home</button></div></section>`;
  }
  const p=PBY[pq.ids[pq.i]], done=pq.done;
  let body="";
  if(p.type==="table"){
    body=`<div class="ptab">`+p.rows.map((row,ri)=>{
      const fx=`<div class="pfx">`+row.fx.map((v,k)=>`<div><span class="lbl">${esc(p.fixed[k])}</span><div class="pv ${p.mono?"mono":""}">${esc(v)}</div></div>`).join("")+`</div>`;
      const sels=`<div class="psel">`+p.cols.map((c,ci)=>{const cur=pq.ans[ri][ci], ok=cur===row.a[ci];
        return `<label class="field"><span class="lbl">${esc(c.h)}</span><select data-act="pq-sel" data-r="${ri}" data-c="${ci}" ${done?`disabled class="${ok?"sok":"sbad"}"`:""}><option value="">Choose…</option>${c.o.map(o=>`<option ${o===cur?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}).join("")+`</div>`;
      let fb="";
      if(done){const ok=row.a.every((v,ci)=>pq.ans[ri][ci]===v);
        fb=`<div class="pfb ${ok?"ok":""}"><b>${ok?"✓ Correct":"✗ Answer: "+esc(row.a.join(" · "))}</b> ${esc(row.why)}</div>`}
      return `<div class="prow ${done?(row.a.every((v,ci)=>pq.ans[ri][ci]===v)?"ok":"no"):""}">${fx}${sels}${fb}</div>`}).join("")+`</div>`;
  } else if(p.type==="order"){
    body=`<ol class="pord">`+pq.ans.map((ii,pos)=>{const ok=ii===pos;
      return `<li class="${done?(ok?"ok":"no"):""}"><span class="k">${pos+1}</span><div><b>${esc(p.items[ii])}</b>${done?`<p>${ok?"✓ Right spot.":`✗ Belongs at #${ii+1}.`} ${esc(p.why[ii])}</p>`:""}</div>${done?"":`<span class="mv"><button class="btn" data-act="pq-up" data-i="${pos}" ${pos===0?"disabled":""} aria-label="Move up">↑</button><button class="btn" data-act="pq-dn" data-i="${pos}" ${pos===pq.ans.length-1?"disabled":""} aria-label="Move down">↓</button></span>`}</li>`}).join("")+`</ol>`;
  } else {
    body=`<p class="note">Tap a line to select it. Tap again to unselect.</p><div class="plog">`+p.lines.map((l,i)=>{const s=pq.ans.has(i);let cls=s?"on":"",note="";
      if(done){if(l.hit&&s){cls="ok";note="✓ Attack line, caught."}else if(l.hit){cls="miss";note="✗ Attack line you missed."}else if(s){cls="fp";note="✗ Normal line, wrongly flagged."}else{cls="quiet";note="Normal, correctly left alone."}}
      return `<button class="pl ${cls}" data-act="pq-tog" data-i="${i}" ${done?"disabled":""}><code>${esc(l.x)}</code>${done?`<span class="pn"><b>${note}</b> ${esc(l.why||"")}</span>`:""}</button>`}).join("")+`</div>`;
  }
  let res="";
  if(done){const r=pq.res,v=r.pct===100?["good","Full marks."]:r.pct>=50?["idk","Partial credit."]:["bad","Not yet."];
    const detail=p.type==="select"?`${r.r} of ${r.hits} attack lines caught${r.fp?`, ${r.fp} false flag${r.fp>1?"s":""}`:""}.`:`${r.r} of ${r.n} correct.`;
    res=`<div class="fb ${v[0]}" id="pqres"><div class="verdict">${v[1]} ${r.pct}%</div><p>${detail}</p><div class="clue"><b>Takeaway</b>${esc(p.f)}</div>${r.pct<100?guideLink(p):""}</div>`}
  const btns=done?`<div class="row2"><button class="btn" data-act="pq-retry">Try again</button><button class="btn primary" data-act="pq-next">${pq.i<n-1?"Next PBQ →":"Finish round"}</button></div>`
                 :`<button class="btn primary" data-act="pq-submit">Submit</button>`;
  return top+`<div class="card"><div class="tag"><span class="d">D${p.d} · ${p.o}</span><span>${esc(DOM[p.d])}</span><span>PBQ · ${p.type==="table"?(p.cols.length>1||p.fixed.length>1?"configure":"match"):p.type==="order"?"order":"select"}</span></div><h3>${esc(p.t)}</h3><p class="q">${esc(p.q)}</p>${res}${body}${btns}</div>`;
}

// ---------- study guide ----------
const OBJ={"1.1":"Security controls","1.2":"Fundamental security concepts","1.3":"Change management","1.4":"Cryptographic solutions",
"2.1":"Threat actors and motivations","2.2":"Threat vectors and attack surfaces","2.3":"Types of vulnerabilities","2.4":"Indicators of malicious activity","2.5":"Mitigation techniques",
"3.1":"Architecture models","3.2":"Securing enterprise infrastructure","3.3":"Protecting data","3.4":"Resilience and recovery",
"4.1":"Securing computing resources","4.2":"Asset management","4.3":"Vulnerability management","4.4":"Alerting and monitoring","4.5":"Enterprise security capabilities","4.6":"Identity and access management","4.7":"Automation and orchestration","4.8":"Incident response","4.9":"Data sources for investigations",
"5.1":"Security governance","5.2":"Risk management","5.3":"Third-party risk","5.4":"Compliance and privacy","5.5":"Audits and assessments","5.6":"Security awareness"};
let focus=null; // {o:"1.4"} narrows every mode to one objective
let gd={d:1,o:null,hl:null,weak:false};
function openGuide(d,o,hl){
  gd={d:+d,o:o||null,hl:hl||null,weak:false}; go("guide");
  const el=document.getElementById(hl?"g-"+hl:o?"o-"+o.replace(".","-"):"");
  if(el&&el.scrollIntoView) el.scrollIntoView({block:"start"});
}
function guideLink(c,label){return `<button class="linkbtn gl" data-act="guide" data-d="${c.d}" data-o="${c.o}" data-id="${c.id||""}">📖 ${label||`Study guide · ${c.o} ${esc(OBJ[c.o]||"")}`}</button>`}
function guideView(){
  const d=gd.d, ids=domainIds(d), m=Math.round(masteryOf(ids)*100), wkAll=ids.filter(isWeak).length;
  const objs=Object.keys(OBJ).filter(o=>o.split(".")[0]==String(d));
  const tabs=[1,2,3,4,5].map(x=>`<button class="chip ${x===d?"on":""}" data-act="gdom" data-d="${x}">D${x}</button>`).join("");
  const secs=objs.map(o=>{
    const allC=DECK.filter(c=>c.o===o), all=allC.map(c=>c.id), om=Math.round(masteryOf(all)*100), wk=all.filter(isWeak).length;
    let cards=gd.weak?allC.filter(c=>isWeak(c.id)):allC.slice();
    cards.sort((a,b)=>(isWeak(b.id)-isWeak(a.id)));
    const pb=PBQ.filter(p=>p.o===o).length;
    const list=cards.length?cards.map(c=>`<div class="gcard ${isWeak(c.id)?"weak":""} ${gd.hl===c.id?"hl":""}" id="g-${c.id}"><div class="gt"><b>${esc(c.t)}</b>${isWeak(c.id)?`<span class="gw">missed</span>`:cs(c.id).b>=4?`<span class="gk">solid</span>`:""}</div><p>${esc(c.f)}</p><div class="gc"><span>Key clue</span> ${esc(c.c)}</div></div>`).join("")
      :`<p class="note">${gd.weak?"Nothing missed here.":"No cards for this objective yet."}</p>`;
    const open=gd.o===o||(gd.weak&&wk>0);
    return `<details class="gobj" id="o-${o.replace(".","-")}" ${open?"open":""}><summary><div class="gs"><span class="go">${o}</span><b>${esc(OBJ[o])}</b></div><div class="gm">${all.length} cards · ${om}% mastered${wk?` · <span class="gwt">${wk} missed</span>`:""}</div><div class="bar"><i style="width:${om}%"></i></div></summary>
      <div class="gbody"><div class="row">${all.length?`<button class="btn primary" data-act="gdrill" data-o="${o}">Drill ${o}</button>`:""}${pb?`<button class="btn" data-act="gpbq" data-o="${o}">PBQs (${pb})</button>`:""}</div>${list}</div></details>`}).join("");
  return `<div class="bar-top"><div class="left"><button class="btn ghost" data-act="home" style="min-height:40px;padding:8px 12px">← Home</button><div class="eyebrow">Study guide</div></div><button class="toggle ${gd.weak?"on":""}" data-act="gweak">⚠ Missed only</button></div>
   <div class="chips">${tabs}</div>
   <section><h2>D${d} · ${esc(DOM[d])}</h2><p class="note">${Math.round(WT[d]*100)}% of the exam · ${m}% mastered · ${ids.length} cards${wkAll?` · ${wkAll} missed`:""}. Tap an objective to open it. Missed cards are listed first.</p></section>
   <div class="glist">${secs}</div>`;
}

// ---------- render + events ----------
function render(){
  if(view==="home") app.innerHTML=homeView();
  else if(view==="study") app.innerHTML=studyView();
  else if(view==="exam") app.innerHTML=examView();
  else if(view==="audio") app.innerHTML=audioView();
  else if(view==="pbq") app.innerHTML=pbqView();
  else if(view==="guide") app.innerHTML=guideView();
}
function go(v){ if(view==="audio"&&v!=="audio") stopAudio(); if(view==="exam"&&ex&&!ex.done&&v!=="exam"){clearInterval(ex.tick)} view=v; render(); window.scrollTo(0,0) }
function start(m){
  if(m==="exam") return startExam();
  if(m==="pbq") return startPbq();
  if(m==="audio"){au.q=audioQueue();au.i=0;au.phase="";return go("audio")}
  sess=newSession(m); view="study"; advance(); window.scrollTo(0,0);
}
app.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t)return; const a=t.dataset.act;
  if(a==="install"){const p=window.__cobaltInstall;if(p){p.prompt();p.userChoice.finally(()=>{window.__cobaltInstall=null;render()})}return}
  if(a==="theme"){S.settings.theme=S.settings.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.settings.theme;save();render()}
  else if(a==="dom"){const d=+t.dataset.d;let ds=S.settings.domains;if(!d)ds=[];else ds=ds.includes(d)?ds.filter(x=>x!==d):ds.concat(d);if(ds.length===5)ds=[];S.settings.domains=ds;save();render()}
  else if(a==="start") start(t.dataset.m);
  else if(a==="drilldom"){S.settings.domains=[+t.dataset.d];save();start("smart")}
  else if(a==="home"){focus=null;go("home")}
  else if(a==="guide") openGuide(t.dataset.d,t.dataset.o,t.dataset.id);
  else if(a==="gdom"){gd={d:+t.dataset.d,o:null,hl:null,weak:gd.weak};render();window.scrollTo(0,0)}
  else if(a==="gweak"){gd.weak=!gd.weak;gd.hl=null;render()}
  else if(a==="gdrill"){focus={o:t.dataset.o};start("smart")}
  else if(a==="gpbq"){focus={o:t.dataset.o};start("pbq")}
  else if(a==="flip"){if(!sess.flipped){sess.flipped=true;render()}}
  else if(a==="rev"){S.settings.rev=!S.settings.rev;save();render()}
  else if(a==="g"){grade(sess.cur,t.dataset.r);advance()}
  else if(a==="pick"){if(sess.done)return;const o=+t.dataset.o;sess.picked=o;sess.done=true;grade(sess.cur,o===0?"r":o===-1?"i":"w");render()}
  else if(a==="next") advance();
  else if(a==="xpick"){ex.ans[ex.i]=+t.dataset.o;render()}
  else if(a==="xnext"){ex.i++;render();window.scrollTo(0,0)}
  else if(a==="xprev"){ex.i--;render()}
  else if(a==="xfinish") finishExam();
  else if(a==="quitexam"){clearInterval(ex.tick);ex=null;go("home")}
  else if(a==="pq-up"||a==="pq-dn"){const i=+t.dataset.i,j=a==="pq-up"?i-1:i+1;[pq.ans[i],pq.ans[j]]=[pq.ans[j],pq.ans[i]];render()}
  else if(a==="pq-tog"){const i=+t.dataset.i;pq.ans.has(i)?pq.ans.delete(i):pq.ans.add(i);render()}
  else if(a==="pq-submit") submitPbq();
  else if(a==="pq-next"){pq.i++;if(pq.i<pq.ids.length)loadPbq();render();window.scrollTo(0,0)}
  else if(a==="pq-retry"){loadPbq();render();window.scrollTo(0,0)}
  else if(a==="pq-again") startPbq();
  else if(a==="aplay") startAudio();
  else if(a==="astop") stopAudio();
  else if(a==="askip") skipAudio();
  else if(a==="export") exportModal();
  else if(a==="import") importModal();
  else if(a==="reset"){
    if(Date.now()-resetArm<4000){const th=S.settings.theme;S=blank();S.settings.theme=th;save();resetArm=0;render()}
    else{resetArm=Date.now();t.textContent="Tap again to wipe everything";setTimeout(()=>{if(view==="home")render()},4000)}}
});
app.addEventListener("change",e=>{
  const t=e.target.closest("[data-act]"); if(!t)return; const a=t.dataset.act;
  if(a==="pq-sel"){pq.ans[+t.dataset.r][+t.dataset.c]=t.value;return}
  if(a==="arate")S.settings.rate=+t.value; else if(a==="agap")S.settings.gap=+t.value; else if(a==="avoice")S.settings.voice=t.value;
  save();
});
document.addEventListener("keydown",e=>{
  if(document.querySelector(".modal")||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(view==="study"&&sess&&sess.cur){
    if(sess.fmt==="flip"){
      if(k===" "&&!sess.flipped){e.preventDefault();sess.flipped=true;render()}
      else if(k==="n"&&!sess.flipped){grade(sess.cur,"i");advance()}
      else if(sess.flipped&&["1","2","3"].includes(k)){grade(sess.cur,{1:"w",2:"i",3:"r"}[k]);advance()}
    } else {
      if(!sess.done){const idx="1234".indexOf(k)>-1?"1234".indexOf(k):"abcd".indexOf(k);
        if(idx>-1){const o=sess.order[idx];sess.picked=o;sess.done=true;grade(sess.cur,o===0?"r":"w");render()}
        else if(k==="n"){sess.picked=-1;sess.done=true;grade(sess.cur,"i");render()}}
      else if(k==="enter"||k===" "){e.preventDefault();advance()}
    }
  } else if(view==="exam"&&ex&&!ex.done){
    const idx="1234".indexOf(k)>-1?"1234".indexOf(k):"abcd".indexOf(k);
    if(idx>-1){ex.ans[ex.i]=ex.orders[ex.i][idx];render()}
    else if(k==="enter"){if(ex.i<ex.ids.length-1){ex.i++;render()}else finishExam()}
  }
});
render();
function syncThemeColor(){const m=document.getElementById("themecolor");if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#0a0f1d"}
syncThemeColor(); new MutationObserver(syncThemeColor).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__cobaltInstall=e;if(view==="home")render()});
window.addEventListener("appinstalled",()=>{window.__cobaltInstall=null;if(view==="home")render()});
if("serviceWorker" in navigator&&window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
